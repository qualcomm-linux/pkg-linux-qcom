# Releases. Dispatched from release.yml and never scheduled, so nothing here
# runs until someone asks for it by name.
#
# Every entry pins its ref: ref_strategy must be pinned_ref, because a release
# names the exact source that ships. latest_tag would make two dispatches of
# one entry release different kernels, and branch_tip would make them release
# whatever the branch had reached.
#
# Debian suites only. Promotion runs through Debusine, and the Ubuntu path
# publishes to S3 without a workspace to promote into, so an Ubuntu entry here
# would name a destination nothing could deliver it to.
#
# Updating a release means editing branch_or_tag in a pull request, which is
# what puts the ref that ships under review.
