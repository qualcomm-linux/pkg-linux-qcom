#
# Kernel delivery matrix.
#
# One entry in "builds" is one generated package: a single name, a single
# delivery type, and a single suite. The only list-valued fields are
# kernel_config and dkms, which name the fragments and the out-of-tree modules
# that go into that one package, so an entry needs no expansion — ci/scripts/
# resolve-matrix.py validates the document, filters it, and hands the matching
# entries straight to the workflow matrix.
#
# Entries are written out in full rather than sharing YAML anchors, so each one
# can be read, grepped, and changed on its own. resolve-matrix.py enforces the
# consistency that duplication would otherwise put at risk: a flavour's entries
# must agree on srcpkg, binpkg and kernel_config, its entries of one delivery
# type must agree on the kernel ref they build, and its entries for one suite
# must agree on dkms.
#
# The two identifiers are not the same thing. flavour is the kernel's own
# identity: it becomes the LOCALVERSION suffix, so qcom-next and
# qcom-next-debug produce distinct kernel releases that install alongside each
# other, and every suite building one flavour produces the same kernel release.
# A build's name is what CI calls it: the Actions job name, and what a manual
# dispatch asks for by name. It never reaches a package name or version, and
# never a published path. It must be unique within a delivery type, so a Daily
# and the Release that supersedes it share one. It may not be "all", which the
# daily and release dispatch forms read as every entry of their type.
#
# dkms varies by suite because it depends on which <name>-dkms packages the
# target archive carries: the Debian suites bundle camx and iris-vpu, which
# Ubuntu does not package.
#
# A flavour tracking a moving upstream is Daily only. A Release entry must name
# an immutable ref, and a branch tip or a tag cut every night is not one, so
# mainline, next and the topic branches are built and published daily and never
# promoted. A Release entry still requires the Daily that tests it.
#
# debian_revision is stated outright, not derived. Daily revisions end in "~"
# so they sort below the Release revision for the same suite; the rest of the
# revision places the suite where it belongs relative to the other suites (see
# the ordering discussion in README.md). No two entries may produce the same
# srcpkg at the same debian_revision.

builds:
  # ---------------------------------------------------------------------------
  # qcom-next — the standard kernel.
  # ---------------------------------------------------------------------------
  - name: qcom-next-trixie
    type: Daily
    suite: trixie
    flavour: qcom-next
    git_clone: https://github.com/qualcomm-linux/kernel
    branch_or_tag: qcom-next
    ref_strategy: latest_tag
    tag_pattern: 'qcom-next-*'
    srcpkg: linux-qcom-next
    binpkg: linux-image-qcom-next
    kernel_config: []
    dkms:
      - kgsl
      - camx
      - iris-vpu
      - audioreach
    debian_revision: '0qli1~bpo13+1~'

  - name: qcom-next-forky
    type: Daily
    suite: forky
    flavour: qcom-next
    git_clone: https://github.com/qualcomm-linux/kernel
    branch_or_tag: qcom-next
    ref_strategy: latest_tag
    tag_pattern: 'qcom-next-*'
    srcpkg: linux-qcom-next
    binpkg: linux-image-qcom-next
    kernel_config: []
    dkms:
      - kgsl
      - camx
      - iris-vpu
      - audioreach
    debian_revision: '0qli1~'

  - name: qcom-next-resolute
    type: Daily
    suite: resolute
    flavour: qcom-next
    git_clone: https://github.com/qualcomm-linux/kernel
    branch_or_tag: qcom-next
    ref_strategy: latest_tag
    tag_pattern: 'qcom-next-*'
    srcpkg: linux-qcom-next
    binpkg: linux-image-qcom-next
    kernel_config: []
    # kgsl alone: camx-dkms and iris-vpu-dkms are not packaged for Ubuntu.
    dkms:
      - kgsl
    debian_revision: '0qli1~26.04.1~'

  - name: qcom-next-trixie
    type: Release
    suite: trixie
    flavour: qcom-next
    git_clone: https://github.com/qualcomm-linux/kernel
    branch_or_tag: qcom-next-7.2-rc7-20260821
    ref_strategy: pinned_ref
    srcpkg: linux-qcom-next
    binpkg: linux-image-qcom-next
    kernel_config: []
    dkms:
      - kgsl
      - camx
      - iris-vpu
      - audioreach
    debian_revision: '0qli1~bpo13+1'
    target_workspace: qli

  - name: qcom-next-forky
    type: Release
    suite: forky
    flavour: qcom-next
    git_clone: https://github.com/qualcomm-linux/kernel
    branch_or_tag: qcom-next-7.2-rc7-20260821
    ref_strategy: pinned_ref
    srcpkg: linux-qcom-next
    binpkg: linux-image-qcom-next
    kernel_config: []
    dkms:
      - kgsl
      - camx
      - iris-vpu
      - audioreach
    debian_revision: '0qli1'
    target_workspace: qli

  # ---------------------------------------------------------------------------
  # qcom-next-debug — the same kernel ref built with the in-tree debug
  # fragments, packaged separately so it installs alongside qcom-next.
  # ---------------------------------------------------------------------------
  - name: qcom-next-debug-trixie
    type: Daily
    suite: trixie
    flavour: qcom-next-debug
    git_clone: https://github.com/qualcomm-linux/kernel
    branch_or_tag: qcom-next
    ref_strategy: latest_tag
    tag_pattern: 'qcom-next-*'
    srcpkg: linux-qcom-next-debug
    binpkg: linux-image-qcom-next-debug
    kernel_config:
      - intree:arch/arm64/configs/qcom_debug.config
      - intree:kernel/configs/debug.config
    dkms:
      - kgsl
      - camx
      - iris-vpu
      - audioreach
    debian_revision: '0qli1~bpo13+1~'

  - name: qcom-next-debug-forky
    type: Daily
    suite: forky
    flavour: qcom-next-debug
    git_clone: https://github.com/qualcomm-linux/kernel
    branch_or_tag: qcom-next
    ref_strategy: latest_tag
    tag_pattern: 'qcom-next-*'
    srcpkg: linux-qcom-next-debug
    binpkg: linux-image-qcom-next-debug
    kernel_config:
      - intree:arch/arm64/configs/qcom_debug.config
      - intree:kernel/configs/debug.config
    dkms:
      - kgsl
      - camx
      - iris-vpu
      - audioreach
    debian_revision: '0qli1~'

  - name: qcom-next-debug-trixie
    type: Release
    suite: trixie
    flavour: qcom-next-debug
    git_clone: https://github.com/qualcomm-linux/kernel
    branch_or_tag: qcom-next-7.2-rc7-20260821
    ref_strategy: pinned_ref
    srcpkg: linux-qcom-next-debug
    binpkg: linux-image-qcom-next-debug
    kernel_config:
      - intree:arch/arm64/configs/qcom_debug.config
      - intree:kernel/configs/debug.config
    dkms:
      - kgsl
      - camx
      - iris-vpu
      - audioreach
    debian_revision: '0qli1~bpo13+1'
    target_workspace: qli

  - name: qcom-next-debug-forky
    type: Release
    suite: forky
    flavour: qcom-next-debug
    git_clone: https://github.com/qualcomm-linux/kernel
    branch_or_tag: qcom-next-7.2-rc7-20260821
    ref_strategy: pinned_ref
    srcpkg: linux-qcom-next-debug
    binpkg: linux-image-qcom-next-debug
    kernel_config:
      - intree:arch/arm64/configs/qcom_debug.config
      - intree:kernel/configs/debug.config
    dkms:
      - kgsl
      - camx
      - iris-vpu
      - audioreach
    debian_revision: '0qli1'
    target_workspace: qli

  # ---------------------------------------------------------------------------
  # qcom-arduino — the Arduino hardware-enablement topic branch.
  #
  # Daily only: a topic branch has no immutable ref to promote from.
  # ---------------------------------------------------------------------------
  - name: qcom-arduino-trixie
    type: Daily
    suite: trixie
    flavour: qcom-arduino
    git_clone: https://github.com/qualcomm-linux/kernel-topics
    branch_or_tag: early/hwe/arduino
    ref_strategy: branch_tip
    srcpkg: linux-qcom-arduino
    binpkg: linux-image-qcom-arduino
    kernel_config: []
    dkms:
      - kgsl
      - camx
      - iris-vpu
    debian_revision: '0qli~bpo13+1~'

  - name: qcom-arduino-forky
    type: Daily
    suite: forky
    flavour: qcom-arduino
    git_clone: https://github.com/qualcomm-linux/kernel-topics
    branch_or_tag: early/hwe/arduino
    ref_strategy: branch_tip
    srcpkg: linux-qcom-arduino
    binpkg: linux-image-qcom-arduino
    kernel_config: []
    dkms:
      - kgsl
      - camx
      - iris-vpu
    debian_revision: '0qli~'

  # ---------------------------------------------------------------------------
  # mainline — Linus's tree, tracked for early warning of upstream breakage.
  #
  # Daily only, and no DKMS: the out-of-tree modules target the Qualcomm tree,
  # and a listed module is a presence contract that would fail the build here.
  # ---------------------------------------------------------------------------
  - name: mainline-trixie
    type: Daily
    suite: trixie
    flavour: mainline
    git_clone: https://github.com/torvalds/linux
    branch_or_tag: master
    ref_strategy: branch_tip
    srcpkg: linux-mainline
    binpkg: linux-image-mainline
    kernel_config: []
    dkms: []
    debian_revision: '0qli~bpo13+1~'

  - name: mainline-forky
    type: Daily
    suite: forky
    flavour: mainline
    git_clone: https://github.com/torvalds/linux
    branch_or_tag: master
    ref_strategy: branch_tip
    srcpkg: linux-mainline
    binpkg: linux-image-mainline
    kernel_config: []
    dkms: []
    debian_revision: '0qli~'

  # ---------------------------------------------------------------------------
  # next — linux-next, the integration tree, one step ahead of mainline.
  #
  # next-YYYYMMDD tags are cut daily, so latest_tag resolves the newest of
  # them the same way qcom-next-* does. Daily only, and no DKMS, as above.
  # ---------------------------------------------------------------------------
  - name: next-trixie
    type: Daily
    suite: trixie
    flavour: next
    git_clone: https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git
    branch_or_tag: master
    ref_strategy: latest_tag
    tag_pattern: 'next-*'
    srcpkg: linux-next
    binpkg: linux-image-next
    kernel_config: []
    dkms: []
    debian_revision: '0qli~bpo13+1~'

  - name: next-forky
    type: Daily
    suite: forky
    flavour: next
    git_clone: https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git
    branch_or_tag: master
    ref_strategy: latest_tag
    tag_pattern: 'next-*'
    srcpkg: linux-next
    binpkg: linux-image-next
    kernel_config: []
    dkms: []
    debian_revision: '0qli~'
