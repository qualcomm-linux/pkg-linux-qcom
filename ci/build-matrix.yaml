#
# Kernel delivery matrix.
#
# One entry in "builds" is one generated package: a single name for a single
# suite. The only list-valued fields are kernel_config and dkms, which name the
# fragments and the out-of-tree modules that go into that one package, so an
# entry needs no expansion — ci/scripts/resolve-matrix.py validates the
# document, filters it, and hands the matching entries straight to the workflow
# matrix.
#
# Entries are written out in full rather than sharing YAML anchors, so each one
# can be read, grepped, and changed on its own. resolve-matrix.py enforces the
# consistency that duplication would otherwise put at risk: a flavour's entries
# must agree on srcpkg, binpkg, kernel_config and the kernel ref they build,
# and its entries for one suite must agree on dkms.
#
# The two identifiers are not the same thing. flavour is the kernel's own
# identity: it becomes the LOCALVERSION suffix, so qcom-next and
# qcom-next-debug produce distinct kernel releases that install alongside each
# other, and every suite building one flavour produces the same kernel release.
# A build's name is what CI calls it: the Actions job name, and what a manual
# dispatch asks for by name. It never reaches a package name or version, and
# never a published path. It must be unique, and may not be "all", which the
# daily and release dispatch forms read as every entry.
#
# dkms varies by suite because it depends on which <name>-dkms packages the
# target archive carries: the Debian suites bundle camx and iris-vpu, which
# Ubuntu does not package.
#
# Every entry is built nightly. Where a build is published is not stated here:
# the workflow that runs the build decides it, because it depends on why the
# build is running rather than on what is being built. The nightly promotes its
# Debian entries into the staging workspace; a PR build of the same entry
# promotes nowhere; and release.yml promotes onward from staging into the
# release workspace, building nothing. So an entry describes a kernel, and
# never a destination.
#
# debian_revision is stated outright, not derived. The trailing "~" marks a
# version as unreleased, and it is carried into the archive as built: what
# release.yml promotes is the tested artifact, not a rebuild at a tidier
# version. The rest of the revision places the suite where it belongs relative
# to the other suites (see the ordering discussion in README.md). No two
# entries may produce the same srcpkg at the same debian_revision.

builds:
  # ---------------------------------------------------------------------------
  # qcom-next — the standard kernel.
  # ---------------------------------------------------------------------------
  - name: qcom-next-trixie
    suite: trixie
    flavour: qcom-next
    git_clone: https://github.com/qualcomm-linux/kernel
    branch_or_tag: qcom-next
    ref_strategy: latest_tag
    tag_pattern: 'qcom-next-*'
    srcpkg: linux-qcom-next
    binpkg: linux-image-qcom-next
    kernel_config: []
    dkms:
      - kgsl
      - camx
      - iris-vpu
      - audioreach
    debian_revision: '0qli1~bpo13+1~'

  - name: qcom-next-forky
    suite: forky
    flavour: qcom-next
    git_clone: https://github.com/qualcomm-linux/kernel
    branch_or_tag: qcom-next
    ref_strategy: latest_tag
    tag_pattern: 'qcom-next-*'
    srcpkg: linux-qcom-next
    binpkg: linux-image-qcom-next
    kernel_config: []
    dkms:
      - kgsl
      - camx
      - iris-vpu
      - audioreach
    debian_revision: '0qli1~'

  - name: qcom-next-resolute
    suite: resolute
    flavour: qcom-next
    git_clone: https://github.com/qualcomm-linux/kernel
    branch_or_tag: qcom-next
    ref_strategy: latest_tag
    tag_pattern: 'qcom-next-*'
    srcpkg: linux-qcom-next
    binpkg: linux-image-qcom-next
    kernel_config: []
    # kgsl alone: camx-dkms and iris-vpu-dkms are not packaged for Ubuntu.
    dkms:
      - kgsl
    debian_revision: '0qli1~26.04.1~'

  # ---------------------------------------------------------------------------
  # qcom-next-debug — the same kernel ref built with the in-tree debug
  # fragments, packaged separately so it installs alongside qcom-next.
  # ---------------------------------------------------------------------------
  - name: qcom-next-debug-trixie
    suite: trixie
    flavour: qcom-next-debug
    git_clone: https://github.com/qualcomm-linux/kernel
    branch_or_tag: qcom-next
    ref_strategy: latest_tag
    tag_pattern: 'qcom-next-*'
    srcpkg: linux-qcom-next-debug
    binpkg: linux-image-qcom-next-debug
    kernel_config:
      - intree:arch/arm64/configs/qcom_debug.config
      - intree:kernel/configs/debug.config
    dkms:
      - kgsl
      - camx
      - iris-vpu
      - audioreach
    debian_revision: '0qli1~bpo13+1~'

  - name: qcom-next-debug-forky
    suite: forky
    flavour: qcom-next-debug
    git_clone: https://github.com/qualcomm-linux/kernel
    branch_or_tag: qcom-next
    ref_strategy: latest_tag
    tag_pattern: 'qcom-next-*'
    srcpkg: linux-qcom-next-debug
    binpkg: linux-image-qcom-next-debug
    kernel_config:
      - intree:arch/arm64/configs/qcom_debug.config
      - intree:kernel/configs/debug.config
    dkms:
      - kgsl
      - camx
      - iris-vpu
      - audioreach
    debian_revision: '0qli1~'

  # ---------------------------------------------------------------------------
  # qcom-arduino — the Arduino hardware-enablement topic branch.
  #
  # A topic branch, built for early warning of what it will take to carry.
  # ---------------------------------------------------------------------------
  - name: qcom-arduino-trixie
    suite: trixie
    flavour: qcom-arduino
    git_clone: https://github.com/qualcomm-linux/kernel-topics
    branch_or_tag: early/hwe/arduino
    ref_strategy: branch_tip
    srcpkg: linux-qcom-arduino
    binpkg: linux-image-qcom-arduino
    kernel_config: []
    dkms:
      - kgsl
      - camx
      - iris-vpu
    debian_revision: '0qli~bpo13+1~'

  - name: qcom-arduino-forky
    suite: forky
    flavour: qcom-arduino
    git_clone: https://github.com/qualcomm-linux/kernel-topics
    branch_or_tag: early/hwe/arduino
    ref_strategy: branch_tip
    srcpkg: linux-qcom-arduino
    binpkg: linux-image-qcom-arduino
    kernel_config: []
    dkms:
      - kgsl
      - camx
      - iris-vpu
    debian_revision: '0qli~'

  # ---------------------------------------------------------------------------
  # mainline — Linus's tree, tracked for early warning of upstream breakage.
  #
  # No DKMS: the out-of-tree modules target the Qualcomm tree, and a listed
  # module is a presence contract that would fail the build here.
  # ---------------------------------------------------------------------------
  - name: mainline-trixie
    suite: trixie
    flavour: mainline
    git_clone: https://github.com/torvalds/linux
    branch_or_tag: master
    ref_strategy: branch_tip
    srcpkg: linux-mainline
    binpkg: linux-image-mainline
    kernel_config: []
    dkms: []
    debian_revision: '0qli~bpo13+1~'

  - name: mainline-forky
    suite: forky
    flavour: mainline
    git_clone: https://github.com/torvalds/linux
    branch_or_tag: master
    ref_strategy: branch_tip
    srcpkg: linux-mainline
    binpkg: linux-image-mainline
    kernel_config: []
    dkms: []
    debian_revision: '0qli~'

  # ---------------------------------------------------------------------------
  # next — linux-next, the integration tree, one step ahead of mainline.
  #
  # next-YYYYMMDD tags are cut daily, so latest_tag resolves the newest of
  # them the same way qcom-next-* does. No DKMS, as above.
  # ---------------------------------------------------------------------------
  - name: next-trixie
    suite: trixie
    flavour: next
    git_clone: https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git
    branch_or_tag: master
    ref_strategy: latest_tag
    tag_pattern: 'next-*'
    srcpkg: linux-next
    binpkg: linux-image-next
    kernel_config: []
    dkms: []
    debian_revision: '0qli~bpo13+1~'

  - name: next-forky
    suite: forky
    flavour: next
    git_clone: https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git
    branch_or_tag: master
    ref_strategy: latest_tag
    tag_pattern: 'next-*'
    srcpkg: linux-next
    binpkg: linux-image-next
    kernel_config: []
    dkms: []
    debian_revision: '0qli~'
