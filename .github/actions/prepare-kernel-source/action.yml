name: Prepare kernel source
description: >
  Resolve the kernel ref, clone it, apply any PR patches, inject debian/ and
  generate the source package, then upload the prepared tree as an artifact.

# Every build takes this path, whichever family it belongs to, so it lives in a
# composite action rather than a reusable workflow: the two family workflows
# call it as a step of their own prepare job, which keeps one copy of these
# steps without adding a nesting level to every job name in the checks list.
#
# The caller must have checked out pkg-linux-qcom into the workspace first:
# debian/ and ci/ come from that checkout, and so does this action.
#
# Runs on the self-hosted arm64 runner, and leaves nothing behind in the job
# environment: values pass between these steps as step outputs, each consumer
# naming what it reads. Writing them to GITHUB_ENV instead would put them in
# the environment of every later step in the job, including steps outside this
# action, and a newline in one would let the value that carried it define
# environment variables of its own. Several of these values are not ours: the
# kernel ref comes from a remote's tag list, and on pr-build.yml the inputs
# come from the build matrix as the pull request wrote it.

inputs:
  build:
    description: 'Name of this build, as listed in ci/build-matrix.yaml'
    required: true
  suite:
    description: 'Target suite'
    required: true
  registry-token:
    description: >
      Token used to pull the pkg-builder image from ghcr.io, which is not a
      public package. Defaults to the job's own GITHUB_TOKEN, which needs the
      packages: read permission the calling workflows declare. The secrets
      context does not reach a composite action, hence an input.
    default: ${{ github.token }}
  expect-family:
    description: >
      Build family the calling workflow builds, debian or ubuntu. The suite is
      a free-text matrix value, so this catches one handed to the workflow for
      the other family before anything is cloned or built.
    required: true
  flavour:
    description: 'Kernel flavour: the LOCALVERSION suffix and so the kernel release identity'
    required: true
  kernel-url:
    description: 'Kernel repository URL'
    default: 'https://github.com/qualcomm-linux/kernel'
  ref-strategy:
    description: 'Kernel ref strategy: latest_tag, branch_tip, or pinned_ref'
    default: 'latest_tag'
  kernel-branch:
    description: 'Branch for branch_tip or immutable ref for pinned_ref (ignored for latest_tag)'
    default: 'qcom-next'
  tag-pattern:
    description: 'Tag glob used only by latest_tag'
    default: 'qcom-next-*'
  srcpkg:
    description: 'Debian source package name'
    default: 'linux-qcom-next'
  binpkg:
    description: 'Kernel image metapackage name'
    default: 'linux-image-qcom-next'
  kernel-config:
    description: 'Extra config fragments applied on top of all of debian/config-available/'
    default: ''
  dkms:
    description: 'Out-of-tree DKMS modules to bundle, comma-separated and without the -dkms suffix'
    default: ''
  debian-revision:
    description: 'Debian revision override (empty takes the Daily revision the matrix gives this build)'
    default: ''
  localversion:
    description: 'LOCALVERSION override (auto-derived from the resolved ref if empty)'
    default: ''
  kver-extra:
    description: 'Extra package-version suffix (e.g. -ci42)'
    default: ''
  debug-build:
    description: 'Enable the debug build configuration'
    default: 'false'
  qcom-next-pr:
    description: 'qcom-next PR numbers to merge, space-separated'
    default: ''
  kernel-topics-pr:
    description: 'kernel-topics PR numbers to apply as patches, space-separated'
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve build environment
      id: env
      shell: bash
      env:
        SUITE_INPUT: ${{ inputs.suite }}
        EXPECT_FAMILY: ${{ inputs.expect-family }}
      run: |
        set -euo pipefail
        # Family and docker image in one place, because they answer the same
        # question about a suite. The family list here is the one in
        # ci/scripts/resolve-matrix.py, which routes an entry to the workflow
        # that calls this action.
        #
        # Ubuntu-family suites use an image of their own suite. Every
        # Debian-family suite uses the trixie image, forky and sid included:
        # the registry publishes no image for either, and docker-pkg-build has
        # no Dockerfile to build one from, so they borrow trixie's until one
        # exists. That costs nothing today because Debusine performs the actual
        # suite-specific build; this container only has to run
        # prepare-source.sh, which generates packaging rather than compiling
        # anything.
        case "$SUITE_INPUT" in
          trixie|forky|sid|unstable) FAMILY=debian; DOCKER_DISTRO=trixie ;;
          *)                         FAMILY=ubuntu; DOCKER_DISTRO="$SUITE_INPUT" ;;
        esac

        if [[ "$FAMILY" != "$EXPECT_FAMILY" ]]; then
          echo "::error::Suite $SUITE_INPUT is $FAMILY-family, but this workflow builds the $EXPECT_FAMILY family."
          echo "::error::Dispatch the $FAMILY build workflow for it instead."
          exit 1
        fi

        # Pull the images qualcomm-linux/docker-pkg-build publishes, and build
        # the rest here. Its container-build-and-upload.yml pushes trixie and
        # resolute (and noble) on every push to main and weekly, having
        # validated each with a test package build, so rebuilding them from the
        # same Dockerfile on every job repeats work already done. Anything it
        # does not publish still has to be built on the runner.
        case "$DOCKER_DISTRO" in
          trixie|resolute) IMAGE_SOURCE=pull ;;
          *)               IMAGE_SOURCE=build ;;
        esac

        echo "distro=$SUITE_INPUT" >> "$GITHUB_OUTPUT"
        echo "docker_distro=$DOCKER_DISTRO" >> "$GITHUB_OUTPUT"
        echo "image_source=$IMAGE_SOURCE" >> "$GITHUB_OUTPUT"
        echo "Suite $SUITE_INPUT is $FAMILY-family and uses the $DOCKER_DISTRO image ($IMAGE_SOURCE)"

    - name: Pull builder image
      if: ${{ steps.env.outputs.image_source == 'pull' }}
      shell: bash
      env:
        DOCKER_DISTRO: ${{ steps.env.outputs.docker_distro }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
      run: |
        # No -x: REGISTRY_TOKEN is in env.
        set -euo pipefail
        # ghcr.io/qualcomm-linux/pkg-builder is not a public package, so the
        # pull needs a login even though the image is only ever read.
        echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        docker pull "ghcr.io/qualcomm-linux/pkg-builder:$DOCKER_DISTRO"
        docker image ls

    # Only for a suite with no published image: the pull path needs neither
    # this checkout nor the build below.
    - name: Checkout docker-pkg-build
      if: ${{ steps.env.outputs.image_source == 'build' }}
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        repository: qualcomm-linux/docker-pkg-build
        ref: main
        path: docker-pkg-build

    - name: Build builder image
      if: ${{ steps.env.outputs.image_source == 'build' }}
      shell: bash
      env:
        DOCKER_DISTRO: ${{ steps.env.outputs.docker_distro }}
      run: |
        set -euo pipefail
        ./docker-pkg-build/docker_deb_build.py --rebuild -d "$DOCKER_DISTRO"
        docker image ls

    - name: Resolve kernel ref
      id: ref
      shell: bash
      env:
        KERNEL_URL_INPUT: ${{ inputs.kernel-url }}
        BRANCH_INPUT: ${{ inputs.kernel-branch }}
        REF_STRATEGY_INPUT: ${{ inputs.ref-strategy }}
        TAG_PATTERN_INPUT: ${{ inputs.tag-pattern }}
        BUILD_INPUT: ${{ inputs.build }}
      run: |
        set -euo pipefail
        [[ "$BUILD_INPUT" =~ ^[a-z0-9]+([a-z0-9-]*[a-z0-9])?$ ]] || {
          echo "::error::build name must use lowercase letters, digits, and internal hyphens"
          exit 1
        }
        case "$REF_STRATEGY_INPUT" in
          latest_tag)
            KERNEL_REF=$(ci/scripts/resolve-kernel-ref.sh \
              --url "$KERNEL_URL_INPUT" \
              --latest-tag "$TAG_PATTERN_INPUT")
            ;;
          branch_tip|pinned_ref)
            KERNEL_REF=$(ci/scripts/resolve-kernel-ref.sh \
              --url "$KERNEL_URL_INPUT" --ref "$BRANCH_INPUT")
            ;;
          *)
            echo "::error::unsupported ref strategy: $REF_STRATEGY_INPUT"
            exit 1
            ;;
        esac

        # A ref carrying a newline would otherwise define outputs of its own.
        # The remote chooses this value, so check it before writing it out.
        [[ "$KERNEL_REF" == *$'\n'* ]] && {
          echo "::error::resolved kernel ref contains a newline"
          exit 1
        }

        echo "kernel_ref=$KERNEL_REF" >> "$GITHUB_OUTPUT"
        echo "Build: $BUILD_INPUT"
        echo "Ref strategy: $REF_STRATEGY_INPUT"
        echo "Resolved kernel ref: $KERNEL_REF"

    - name: Clone kernel source
      id: clone
      shell: bash
      env:
        KERNEL_URL: ${{ inputs.kernel-url }}
        KERNEL_REF: ${{ steps.ref.outputs.kernel_ref }}
      run: |
        set -euo pipefail
        KERNEL_DIR="$GITHUB_WORKSPACE/kernel-source"
        echo "kernel_dir=$KERNEL_DIR" >> "$GITHUB_OUTPUT"
        echo "Cloning $KERNEL_URL @ $KERNEL_REF (shallow)..."
        git clone --depth 1 --single-branch --branch "$KERNEL_REF" --no-tags \
          "$KERNEL_URL" "$KERNEL_DIR"
        KERNEL_SHA=$(git -C "$KERNEL_DIR" rev-parse HEAD)
        echo "kernel_sha=$KERNEL_SHA" >> "$GITHUB_OUTPUT"
        echo "Kernel HEAD SHA: $KERNEL_SHA"

        # Committer date of HEAD, normalised to UTC. Committer rather than
        # author date: an author date can be months old on a backported patch,
        # which would date the build by when someone first wrote the code
        # rather than by when this snapshot came to exist.
        KERNEL_DATE=$(TZ=UTC git -C "$KERNEL_DIR" log -1 --format=%cd --date=format-local:%Y%m%d)
        [[ "$KERNEL_DATE" =~ ^[0-9]{8}$ ]] || {
          echo "::error::could not read a YYYYMMDD commit date from $KERNEL_REF (got '$KERNEL_DATE')"
          exit 1
        }
        echo "kernel_date=$KERNEL_DATE" >> "$GITHUB_OUTPUT"
        echo "Kernel HEAD commit date (UTC): $KERNEL_DATE"

    - name: Derive version fields
      id: localversion
      shell: bash
      env:
        LOCALVERSION_INPUT: ${{ inputs.localversion }}
        FLAVOUR_INPUT: ${{ inputs.flavour }}
        KERNEL_REF: ${{ steps.ref.outputs.kernel_ref }}
        KERNEL_SHA: ${{ steps.clone.outputs.kernel_sha }}
        KERNEL_DATE: ${{ steps.clone.outputs.kernel_date }}
      run: |
        set -euo pipefail
        if [[ -n "$LOCALVERSION_INPUT" ]]; then
          # An override supplies no snapshot, and the ref it was chosen to
          # replace cannot be trusted to describe it. The Debian version then
          # carries no +git<date>; prepare-source.sh warns about the same.
          echo "Using explicit LOCALVERSION override: $LOCALVERSION_INPUT"
          echo "localversion=$LOCALVERSION_INPUT" >> "$GITHUB_OUTPUT"
          echo "snapshot=" >> "$GITHUB_OUTPUT"
          echo "gitsha=" >> "$GITHUB_OUTPUT"
        else
          # Emits LOCALVERSION=, SNAPSHOT= and GITSHA= lines. They are read
          # here rather than recovered from LOCALVERSION later: that string
          # also carries a flavour name, and a hex SHA can end in eight digits
          # of its own.
          #
          # --date is only consulted for branch-tip builds, where the ref
          # carries no snapshot. It comes from the commit rather than the
          # clock, so rebuilding a commit reproduces its version instead of
          # inventing a higher one.
          FIELDS=$(ci/scripts/derive-localversion.sh \
            --flavour "$FLAVOUR_INPUT" \
            --ref "$KERNEL_REF" \
            --sha "$KERNEL_SHA" \
            --date "$KERNEL_DATE")
          echo "Derived version fields:"
          echo "$FIELDS"
          echo "$FIELDS" | while IFS='=' read -r key value; do
            case "$key" in
              LOCALVERSION) echo "localversion=$value" ;;
              SNAPSHOT)     echo "snapshot=$value" ;;
              GITSHA)       echo "gitsha=$value" ;;
              *) echo "::error::unexpected field '$key' from derive-localversion.sh"; exit 1 ;;
            esac
          done >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve Debian revision
      # Callers driven by the matrix pass the entry's own debian-revision
      # straight through. A direct workflow_dispatch that leaves it empty looks
      # the same entry up itself, so a manual build of a configured build gets
      # exactly the revision the daily build would have used. The lookup is
      # always the Daily entry: direct dispatch is build-only and never
      # promotes.
      id: revision
      shell: bash
      env:
        DEBIAN_REVISION_INPUT: ${{ inputs.debian-revision }}
        BUILD_INPUT: ${{ inputs.build }}
        DISTRO: ${{ steps.env.outputs.distro }}
      run: |
        set -euo pipefail
        if [[ -n "$DEBIAN_REVISION_INPUT" ]]; then
          DEBIAN_REVISION="$DEBIAN_REVISION_INPUT"
          echo "Using supplied Debian revision: $DEBIAN_REVISION"
        else
          DEBIAN_REVISION=$(ci/scripts/resolve-matrix.py \
            --type Daily \
            --build "$BUILD_INPUT" \
            --suite "$DISTRO" \
            --field debian_revision) || {
            echo "::error::No Daily matrix entry named $BUILD_INPUT for suite $DISTRO."
            echo "::error::Add one to ci/build-matrix.yaml, or set the debian-revision input to build this combination ad hoc."
            exit 1
          }
          echo "Matrix Debian revision for $BUILD_INPUT/$DISTRO: $DEBIAN_REVISION"
        fi
        echo "debian_revision=$DEBIAN_REVISION" >> "$GITHUB_OUTPUT"

    - name: Merge qcom-next PR patches
      if: ${{ inputs.qcom-next-pr != '' }}
      shell: bash
      env:
        QCOM_NEXT_PR: ${{ inputs.qcom-next-pr }}
        KERNEL_DIR: ${{ steps.clone.outputs.kernel_dir }}
      run: |
        cd "$KERNEL_DIR"
        echo "Merging qcom-next PR(s): $QCOM_NEXT_PR"
        for pr in $QCOM_NEXT_PR; do
          [[ "$pr" =~ ^[0-9]+$ ]] || { echo "::error::invalid qcom-next PR number: $pr"; exit 1; }
          echo "::group::Merging qcom-next PR #$pr"
          git fetch --no-tags origin "pull/$pr/head:pr-$pr"
          if ! git merge --no-ff --no-commit "pr-$pr"; then
            echo "ERROR: Merge conflict while merging PR #$pr. Aborting."
            git merge --abort || true
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Merged qcom-next PR #$pr"
            echo "PR #$pr merged successfully."
          else
            echo "PR #$pr already present; nothing to merge."
          fi
          echo "::endgroup::"
        done

    - name: Apply kernel-topics PR patches
      if: ${{ inputs.kernel-topics-pr != '' }}
      shell: bash
      env:
        KERNEL_TOPICS_PR: ${{ inputs.kernel-topics-pr }}
        KERNEL_DIR: ${{ steps.clone.outputs.kernel_dir }}
      run: |
        cd "$KERNEL_DIR"
        echo "Applying kernel-topics PR patch(es): $KERNEL_TOPICS_PR"
        for pr in $KERNEL_TOPICS_PR; do
          [[ "$pr" =~ ^[0-9]+$ ]] || { echo "::error::invalid kernel-topics PR number: $pr"; exit 1; }
          echo "::group::Applying kernel-topics PR #$pr"
          wget -q "https://github.com/qualcomm-linux/kernel-topics/pull/$pr.patch" -O "$pr.patch"
          if ! git am "$pr.patch"; then
            echo "ERROR: Patch application failed for PR #$pr. Aborting."
            git am --abort || true
            exit 1
          fi
          echo "PR #$pr applied successfully."
          echo "::endgroup::"
        done

    - name: Prepare source
      shell: bash
      env:
        SRCPKG_INPUT: ${{ inputs.srcpkg }}
        BINPKG_INPUT: ${{ inputs.binpkg }}
        KVER_EXTRA_INPUT: ${{ inputs.kver-extra }}
        KERNEL_CONFIG_INPUT: ${{ inputs.kernel-config }}
        DKMS_INPUT: ${{ inputs.dkms }}
        DEBUG_BUILD_INPUT: ${{ inputs.debug-build }}
        KERNEL_DIR: ${{ steps.clone.outputs.kernel_dir }}
        DISTRO: ${{ steps.env.outputs.distro }}
        DOCKER_DISTRO: ${{ steps.env.outputs.docker_distro }}
        LOCALVERSION: ${{ steps.localversion.outputs.localversion }}
        SNAPSHOT: ${{ steps.localversion.outputs.snapshot }}
        DEBIAN_REVISION: ${{ steps.revision.outputs.debian_revision }}
        KERNEL_URL: ${{ inputs.kernel-url }}
        KERNEL_REF: ${{ steps.ref.outputs.kernel_ref }}
        KERNEL_SHA: ${{ steps.clone.outputs.kernel_sha }}
      run: |
        # No -x here: keep xtrace off for this step as it assembles the
        # prepare-source.sh argument list which may include sensitive paths.
        set -euo pipefail

        ARGS=(
          --source-dir "$KERNEL_DIR"
          --distro "$DISTRO"
          --srcpkg "$SRCPKG_INPUT"
          --binpkg "$BINPKG_INPUT"
          --debian-revision "$DEBIAN_REVISION"
        )

        # The version fields all come from derive-localversion.sh, which
        # composed them from the ref and HEAD together. Nothing here appends to
        # them: the SHA is already inside LOCALVERSION, and SNAPSHOT and the
        # SHA are passed separately for the Debian version, which joins them
        # differently.
        [[ -n "$LOCALVERSION" ]]        && ARGS+=(--localversion "$LOCALVERSION")
        [[ -n "$SNAPSHOT" ]]            && ARGS+=(--snapshot "$SNAPSHOT")
        # Full SHA: prepare-source.sh takes the first 12 for the version
        # strings and records the whole thing in the changelog, alongside the
        # repository and ref that the version strings do not name.
        ARGS+=(--git-sha "$KERNEL_SHA" --git-clone "$KERNEL_URL" --git-ref "$KERNEL_REF")
        [[ -n "$KVER_EXTRA_INPUT" ]]    && ARGS+=(--kver-extra "$KVER_EXTRA_INPUT")
        [[ -n "$KERNEL_CONFIG_INPUT" ]] && ARGS+=(--kernel-config "$KERNEL_CONFIG_INPUT")
        # Always passed, unlike the optional inputs above: an empty list is a
        # genuine "bundle nothing" rather than a request for some default.
        ARGS+=(--dkms "$DKMS_INPUT")
        [[ "$DEBUG_BUILD_INPUT" == "true" ]] && ARGS+=(--debug)

        docker run -i --rm \
          -v "$PWD:$PWD" --workdir="$PWD" \
          "ghcr.io/qualcomm-linux/pkg-builder:$DOCKER_DISTRO" \
          ./prepare-source.sh "${ARGS[@]}"

    - name: Pack prepared source tree
      shell: bash
      env:
        KERNEL_DIR: ${{ steps.clone.outputs.kernel_dir }}
      run: |
        set -euo pipefail
        tar czf /tmp/kernel-srcpkg.tar.gz \
          -C "$(dirname "$KERNEL_DIR")" \
          "$(basename "$KERNEL_DIR")"

    - name: Upload prepared source tree artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-srcpkg-${{ inputs.flavour }}-${{ inputs.suite }}
        path: /tmp/kernel-srcpkg.tar.gz
        if-no-files-found: error
        retention-days: 7
