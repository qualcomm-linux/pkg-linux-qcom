name: build-kernel

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      qcom-build-utils-ref:
        description: qcom-build-utils ref branch or commit
        required: false
        default: 'main'
      kernel-branch:
        description: Kernel Branch or Tag to sync
        required: false
        default: 'qcom-next'
      kernel-url:
        description: Custom Kernel Repo URL (Leave empty for default qualcomm-linux/kernel)
        required: false
        default: ''
      qcom-next-pr:
        description: Space-separated PR numbers to merge from qcom-next
        type: string
        required: false
        default: ''
      kernel-topics-pr:
        description: Space-separated list of kernel-topics PR numbers
        type: string
        required: false
        default: ''

    secrets:
      DEB_PKG_BOT_CI_TOKEN:
        required: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: [self-hosted, lecore-prd-u2404-arm64-xlrg-od-ephem]

    env:
      KERNEL_BRANCH: ${{ github.event.inputs.kernel-branch || 'qcom-next' }}
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Extract org, repo and branch name
        run: |
          # Extract org (owner) and repo name from GITHUB_REPOSITORY (format: org/repo)
          echo "ORG_NAME=${GITHUB_REPOSITORY%%/*}" >> "$GITHUB_ENV"
          echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - name: Debug print exported env
        run: |
          echo "ORG_NAME=$ORG_NAME"
          echo "REPO_NAME=$REPO_NAME"
      
      - name: Checkout qcom-build-utils
        uses: actions/checkout@v4
        with:
          repository: qualcomm-linux/qcom-build-utils
          ref: ${{ inputs.qcom-build-utils-ref }}
          token: ${{ secrets.DEB_PKG_BOT_CI_TOKEN }}
          path: ./qcom-build-utils
          fetch-depth: 1

      - name: Deduce qcom-build-utils head commit SHA
        run: |
          # Get the tip commit SHA of the qcom-build-utils branch/tag used
          cd qcom-build-utils
          QCOM_BUILD_UTILS_SHA=$(git rev-parse HEAD)
          echo "QCOM_BUILD_UTILS_SHA=$QCOM_BUILD_UTILS_SHA" >> "$GITHUB_ENV"
          # Echo for logs
          echo "Head SHA for qcom-build-utils: $QCOM_BUILD_UTILS_SHA"

      - name: Pull docker image
        run: |
          docker pull artifacts.codelinaro.org/clo-420-qli-registry/kmake-image-ubuntu-noble-arm64:ver.1.0
          docker tag artifacts.codelinaro.org/clo-420-qli-registry/kmake-image-ubuntu-noble-arm64:ver.1.0 kmake-image:ubuntu-noble-arm64

      # Runs if kernel-url is EMPTY
      - name: Sync kernel codebase (Default)
        if: ${{ inputs.kernel-url == '' }}
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          cd qcom-build-utils
          cd kernel && export BUILD_TOP=`pwd`
          echo "build_top=$BUILD_TOP" >> "$GITHUB_ENV"

          export REPO="qualcomm-linux/kernel"
          echo "kernel_repo=$REPO" >> "$GITHUB_ENV"
          echo "Syncing ${REPO} ref ${KERNEL_BRANCH}"

          git ls-remote --exit-code --heads "https://${PAT}@github.com/${REPO}.git" ${KERNEL_BRANCH} && IS_BRANCH=true || IS_BRANCH=false

          git init $BUILD_TOP/qcom-kernel
          cd $BUILD_TOP/qcom-kernel
          git remote add origin "https://${PAT}@github.com/${REPO}.git"

          if [ "$IS_BRANCH" = true ]; then
            echo "Detected branch: ${KERNEL_BRANCH}"
            git fetch --depth=1 origin ${KERNEL_BRANCH}
            git checkout ${KERNEL_BRANCH}
          else
            echo "Assuming tag: ${KERNEL_BRANCH}"
            git fetch --depth=1 origin tag ${KERNEL_BRANCH}
            git checkout FETCH_HEAD
          fi

          # Get Head SHA of kernel branch/tag cloned
          QCOM_KERNEL_SHA=$(git rev-parse HEAD)
          echo "QCOM_KERNEL_SHA=$QCOM_KERNEL_SHA" >> "$GITHUB_ENV"

      # Runs if kernel-url is PROVIDED
      - name: Sync custom kernel codebase
        if: ${{ inputs.kernel-url != '' }}
        env:
          KERNEL_URL_INPUT: ${{ inputs.kernel-url }}
        run: |
          cd qcom-build-utils
          mkdir -p kernel
          cd kernel && export BUILD_TOP=`pwd`
          echo "build_top=$BUILD_TOP" >> "$GITHUB_ENV"

          KERNEL_URL="$KERNEL_URL_INPUT"
          echo "Syncing custom repo: ${KERNEL_URL} ref ${KERNEL_BRANCH}"

          git ls-remote --exit-code --heads ${KERNEL_URL} ${KERNEL_BRANCH} && IS_BRANCH=true || IS_BRANCH=false

          mkdir -p $BUILD_TOP/qcom-kernel
          cd $BUILD_TOP/qcom-kernel
          git init
          git remote add origin ${KERNEL_URL}

          if [ "$IS_BRANCH" = true ]; then
            echo "Detected branch: ${KERNEL_BRANCH}"
            git fetch --depth=1 origin ${KERNEL_BRANCH}
            git checkout ${KERNEL_BRANCH}
          else
            echo "Assuming tag: ${KERNEL_BRANCH}"
            git fetch --depth=1 origin tag ${KERNEL_BRANCH}
            git checkout FETCH_HEAD
          fi

          QCOM_KERNEL_SHA=$(git rev-parse HEAD)
          echo "QCOM_KERNEL_SHA=$QCOM_KERNEL_SHA" >> "$GITHUB_ENV"

      - name: Merge qcom-next PR patches
        if: ${{ inputs.kernel-url == '' }}
        env:
          QCOM_NEXT_PR_INPUT: ${{ github.event.inputs.qcom-next-pr }}
          PAT: ${{ secrets.PAT }}
        run: |
          cd "$build_top/"
          if [ -z "$QCOM_NEXT_PR_INPUT" ]; then
            echo "No PR number specified, skipping merge."
          else
            echo "Merging PR(s) #$QCOM_NEXT_PR_INPUT"

            cd "$build_top/qcom-kernel"

            for pr in $QCOM_NEXT_PR_INPUT; do
              echo "::group::Merging qcom-next PR #$pr"
              git fetch "https://${PAT}@github.com/${kernel_repo}.git" "pull/$pr/head:pr-$pr"

              if ! git merge "pr-$pr" --no-commit; then
                echo "Merge conflict while merging PR #$pr. Aborting merge and failing the job."
                git merge --abort || true
                exit 1
              fi

              if ! git diff --cached --quiet; then
                git commit -m "Merged PR #$pr"
              else
                echo "Nothing to commit for PR #$pr (already merged or fast-forwarded)."
                git merge --abort 2>/dev/null || true
              fi
              echo "::endgroup::"
            done
          fi

      - name: Apply kernel-topics PR patches
        if: ${{ inputs.kernel-url == '' }}
        env:
          KERNEL_TOPICS_PR_INPUT: ${{ github.event.inputs.kernel-topics-pr }}
        run: |
          cd "$build_top/"
          if [ -z "$KERNEL_TOPICS_PR_INPUT" ]; then
            echo "Nothing to apply in kernel topics."
          else
            echo "Applying PR(s) from topics branch #$KERNEL_TOPICS_PR_INPUT"
            for pr in $KERNEL_TOPICS_PR_INPUT; do
              echo "::group::Applying kernel-topics PR #$pr"
              wget -q "https://github.com/qualcomm-linux/kernel-topics/pull/$pr.patch" -O "$pr.patch"


              cd "$build_top/qcom-kernel"

              if ! git am "../$pr.patch"; then
                echo "Patch application failed for PR #$pr. Aborting 'git am' and failing the job."
                git am --abort || true
                exit 1
              fi
              echo "::endgroup::"
              cd "$build_top/"
            done
          fi

      - name: Enable Kernel Configs
        run: |
          cd qcom-build-utils/kernel
          export BUILD_TOP=$(pwd)
          ./scripts/enable_squashfs_configs.sh $BUILD_TOP/qcom-kernel/

      - name: Run build script
        run: |
          docker run -i \
          --privileged --rm -v $PWD:$PWD --workdir="$PWD" kmake-image:ubuntu-noble-arm64 \
          -c '
            cd qcom-build-utils/kernel
            export BUILD_TOP=`pwd`
            ./scripts/build_kernel.sh $BUILD_TOP/qcom-kernel/
          '

      - name: Build Kernel Debian Package
        env:
          JOB_ID: ${{ github.run_id }}
          JOB_ATTEMPT: ${{ github.run_attempt }}
        run: |
          docker run -i \
          --privileged --rm -v $PWD:$PWD --workdir="$PWD" \
          -e JOB_ID -e JOB_ATTEMPT \
          kmake-image:ubuntu-noble-arm64 \
          -c '
            cd qcom-build-utils/kernel
            export BUILD_TOP=`pwd`
            ./scripts/build-kernel-deb.sh out/ ${JOB_ID}-${JOB_ATTEMPT}
            mkdir -p deb_artifact
            cp ./*.deb deb_artifact/
          '

      - name: Generate build_info metadata
        env:
          JOB_ID: ${{ github.run_id }}
          JOB_ATTEMPT: ${{ github.run_attempt }}
          QCOM_BUILD_UTILS_REF_INPUT: ${{ inputs.qcom-build-utils-ref }}
          KERNEL_URL_INPUT: ${{ inputs.kernel-url }}
          KERNEL_BRANCH_INPUT: ${{ inputs.kernel-branch }}
          QCOM_NEXT_PR_INPUT: ${{ inputs.qcom-next-pr }}
          KERNEL_TOPICS_PR_INPUT: ${{ inputs.kernel-topics-pr }}
        run: |
          docker run -i \
          --privileged --rm -v $PWD:$PWD --workdir="$PWD" \
          -e JOB_ID -e JOB_ATTEMPT -e ORG_NAME -e REPO_NAME \
          -e QCOM_BUILD_UTILS_REF_INPUT -e QCOM_BUILD_UTILS_SHA \
          -e KERNEL_URL_INPUT -e KERNEL_BRANCH_INPUT -e QCOM_KERNEL_SHA \
          -e QCOM_NEXT_PR_INPUT -e KERNEL_TOPICS_PR_INPUT \
          kmake-image:ubuntu-noble-arm64 \
          -c '
            cd qcom-build-utils/kernel
            {
              echo "JOB_ID: $JOB_ID"
              echo "JOB_ATTEMPT: $JOB_ATTEMPT"
              echo "ORG_NAME: $ORG_NAME"
              echo "REPO_NAME: $REPO_NAME"
              echo "QCOM-BUILD-UTILS BRANCH/TAG: $QCOM_BUILD_UTILS_REF_INPUT"
              echo "QCOM-BUILD-UTILS HEAD SHA: $QCOM_BUILD_UTILS_SHA"
              echo "CUSTOM KERNEL URL: $KERNEL_URL_INPUT"
              echo "KERNEL BRANCH/TAG: $KERNEL_BRANCH_INPUT"
              echo "KERNEL HEAD SHA: $QCOM_KERNEL_SHA"
              echo "PRs FROM QCOM-NEXT: $QCOM_NEXT_PR_INPUT"
              echo "PRs FROM KERNEL TOPICS: $KERNEL_TOPICS_PR_INPUT"
            } > deb_artifact/build_info
          '

      - name: Upload kernel .deb package to S3
        uses: qualcomm-linux/upload-private-artifact-action@aws
        with:
          s3_bucket: qli-prd-lecore-gh-artifacts
          path: qcom-build-utils/kernel/deb_artifact
          destination: ${{ env.ORG_NAME }}/pkg/temp/${{ env.REPO_NAME }}/${{ github.run_id }}-${{ github.run_attempt }}/
