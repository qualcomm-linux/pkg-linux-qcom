name: build-debian-image

# Reusable workflow: build a custom Debian image (qcom-deb-images) with a
# kernel built elsewhere in the calling workflow run.
#
# This is derived from qcom-deb-images' .github/workflows/debos.yml and is
# meant to be made generic and contributed back there, once the pieces that
# are specific to this repository are inputs rather than being hard-coded:
#   - the runner (and with it the lack of the /efsx EFS volume and /dev/kvm),
#   - the S3 bucket,
#   - checking out qcom-deb-images rather than the calling repository,
#   - taking the kernel .debs from an artifact rather than APT or EFS.
#
# Kernel:
#   kernel-artifact set   -> the .debs in that artifact are put in a local
#                            APT repository and installed into the image.
#   kernel-artifact empty -> kernelpackages are installed from the QLI APT
#                            repository, which the rootfs recipe configures.
#
# TODO: the image is built with --disable-fakemachine because the runner has
# no /dev/kvm, which makes the qemu backend very slow. Move to a runner with
# KVM and go back to the fakemachine backend.

on:
  workflow_call:
    inputs:
      suite:
        description: 'Distribution suite (e.g. trixie, forky)'
        type: string
        default: trixie
      variant:
        description: 'Image variant to build (e.g. console, gnome)'
        type: string
        default: console
      profile:
        description: 'Image profile to build (e.g. default, performance, debug)'
        type: string
        default: default
      kernel-artifact:
        description: >
          Name of an artifact of this workflow run holding the kernel .debs
          to install; when empty, kernelpackages is installed from APT.
        type: string
        default: ''
      kernelpackages:
        description: >
          Comma-separated kernel packages to install from the QLI APT
          repository; only used when kernel-artifact is empty.
        type: string
        default: 'linux-image-qcom-next,linux-headers-qcom-next'
      qcom-deb-images-ref:
        description: 'qcom-deb-images branch, tag or SHA to build'
        type: string
        default: main

# grant nothing by default; the job below declares the scopes it needs.
permissions: {}

env:
  # image build id
  BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  SUITE: ${{ inputs.suite }}
  VARIANT: ${{ inputs.variant }}
  PROFILE: ${{ inputs.profile }}
  KERNEL_ARTIFACT: ${{ inputs.kernel-artifact }}
  KERNEL_PACKAGES: ${{ inputs.kernelpackages }}
  # Filename prefix for all published artifacts, "<suite>[-<variant>][-<profile>]";
  # the variant is omitted when "console" and the profile when "default".
  ARTIFACT_PREFIX: >-
    ${{ format(
      '{0}{1}{2}',
      inputs.suite,
      (inputs.variant && inputs.variant != 'console') && format('-{0}', inputs.variant) || '',
      (inputs.profile && inputs.profile != 'default') && format('-{0}', inputs.profile) || '')
    }}

jobs:
  image:
    name: Build custom Debian image
    runs-on: [self-hosted, lecore-prd-u2404-arm64-xlrg-od-ephem]
    permissions:
      contents: read # actions/checkout
    container:
      image: public.ecr.aws/debian/debian:trixie
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      # make sure we have latest packages first, to get latest fixes and to
      # avoid an automated update while we're building
      - name: Update OS packages
        run: |
          set -ux
          apt -y upgrade --update
          apt -y full-upgrade

      - name: Checkout qcom-deb-images
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: qualcomm-linux/qcom-deb-images
          ref: ${{ inputs.qcom-deb-images-ref }}
          fetch-depth: 1

      # mtools is needed for the flash recipe
      # file, device-tree-compiler and u-boot-tools are needed by qcom-dtb-metadata
      # parted and dosfstools are needed by debos to partition and format the
      #   images on the host, as there's no fakemachine
      - name: Install debos and dependencies of the recipes and local tests
        run: >
          apt -y install debian-archive-keyring debos file make mmdebstrap
          mtools python3-pexpect python3-pytest qemu-efi-aarch64
          qemu-system-arm xmlstarlet python3-defusedxml python3-yaml
          python3-jsonschema device-tree-compiler u-boot-tools pigz e2fsprogs
          parted dosfstools

      - name: Download kernel .deb packages
        if: ${{ inputs.kernel-artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.kernel-artifact }}
          path: local-apt-repo/kernel

      - name: Setup local APT repo
        run: |
          set -ux -o pipefail

          # needed for apt-ftparchive
          apt -y install --no-install-recommends apt-utils
          mkdir -pv local-apt-repo

          kernel_packages="$KERNEL_PACKAGES"
          if [ -n "$KERNEL_ARTIFACT" ]; then
              if ! ls local-apt-repo/kernel/linux-image-*.deb >/dev/null 2>&1; then
                  echo "ERROR: artifact ${KERNEL_ARTIFACT} contains no linux-image-*.deb" >&2
                  exit 1
              fi
              # install the generated linux-headers-* packages alongside the
              # linux-image-* ones since these are ephemeral and not published
              # in an APT repo
              kernel_packages="$(find local-apt-repo/kernel -type f \( -name 'linux-image-*' -o -name 'linux-headers-*' \) -not -name '*dbg*' -printf '%f\n' | cut -f1 -d_ | sort | paste -sd,)"
          fi
          echo "KERNEL_PACKAGES_RESOLVED=${kernel_packages}" >> "$GITHUB_ENV"

          (
              cd local-apt-repo
              apt-ftparchive packages . >Packages
              apt-ftparchive release . >Release
          )

      - name: Build rootfs with debos
        run: |
          set -ux
          # TODO: use fakemachine once we have a runner with KVM
          debos \
              --disable-fakemachine \
              -t aptlocalrepo:${PWD}/local-apt-repo \
              -t "buildid:${BUILD_ID}" \
              -t extract_dbg_vmlinux:true \
              -t kernelpackages:"${KERNEL_PACKAGES_RESOLVED}" \
              -t overlays:none \
              -t "suite:${SUITE}" \
              -t "profile:${PROFILE}" \
              -t "variant:${VARIANT}" \
              --print-recipe \
              debos-recipes/qualcomm-linux-debian-rootfs.yaml

      # the image recipes take the same -t options as the rootfs one; the
      # RB1 U-Boot (-t u_boot_rb1) is only available on EFS, so the flash
      # files are built without it
      #
      # the two disk images use the fakemachine qemu backend explicitly:
      # building them on the host (--disable-fakemachine) got stuck. This is
      # SLOW, as there's no /dev/kvm on the runner and qemu has to emulate
      # everything (TCG).
      # TODO: use the kvm backend once we have a runner with KVM
      - name: Build UFS image with debos
        run: |
          set -ux
          make disk-ufs.img FAKEMACHINE_OPTS="--fakemachine-backend qemu" EXTRA_DEBOS_OPTS="--print-recipe -t suite:${SUITE} -t profile:${PROFILE} -t variant:${VARIANT}"

      - name: Build SD card image with debos
        run: |
          set -ux
          make disk-sdcard.img FAKEMACHINE_OPTS="--fakemachine-backend qemu" EXTRA_DEBOS_OPTS="--print-recipe -t suite:${SUITE} -t profile:${PROFILE} -t variant:${VARIANT}"

      - name: Build flashable files with debos
        run: |
          set -ux
          make flash FAKEMACHINE_OPTS="--disable-fakemachine" EXTRA_DEBOS_OPTS="-t buildid:${BUILD_ID} --print-recipe -t suite:${SUITE} -t profile:${PROFILE} -t variant:${VARIANT}"

      - name: Stage image artifacts
        run: |
          set -ux
          dir="image-artifacts"
          mkdir -v "${dir}"
          pigz -c rootfs.tar >"${dir}/${ARTIFACT_PREFIX}-rootfs.tar.gz"
          pigz -c disk-ufs.img >"${dir}/${ARTIFACT_PREFIX}-disk-ufs.img.gz"
          pigz -c disk-sdcard.img >"${dir}/${ARTIFACT_PREFIX}-disk-sdcard.img.gz"
          cp -av dtbs.tar.gz "${dir}/${ARTIFACT_PREFIX}-dtbs.tar.gz"
          # the unstripped vmlinux of the installed kernel, to debug
          # oops/panic backtraces; absent when it has no -dbg package
          if [ -f vmlinux ]; then
              pigz -c vmlinux >"${dir}/${ARTIFACT_PREFIX}-vmlinux.gz"
          fi
          # tarballs with support for all UFS and all eMMC boards
          scripts/bundle-flash-dirs.sh "${dir}" "${ARTIFACT_PREFIX}"
          {
              echo "suite=${SUITE}"
              echo "variant=${VARIANT}"
              echo "profile=${PROFILE}"
              echo "kernel_artifact=${KERNEL_ARTIFACT}"
              echo "kernelpackages=${KERNEL_PACKAGES_RESOLVED}"
              echo "qcom_deb_images_commit=$(git rev-parse HEAD)"
          } | tee "${dir}/${ARTIFACT_PREFIX}-build-info.txt"
          (cd "${dir}" && sha256sum * | tee "${ARTIFACT_PREFIX}-sha256sums.txt")

      # TODO: upload the images once we're happy with where they should go.
      # - name: Upload image artifacts to S3
      #   id: upload-image
      #   uses: qualcomm-linux/upload-private-artifact-action@4940e9327cd7386acdb908b61c714c079b7d754b # aws-v4
      #   with:
      #     s3_bucket: ${{ vars.ARTIFACT_S3_BUCKET }}
      #     path: image-artifacts
      #     destination: ${{ github.repository_owner }}/images/${{ github.event.repository.name }}/${{ env.ARTIFACT_PREFIX }}/${{ github.run_id }}-${{ github.run_attempt }}/
      #
      # - name: Save image artifacts URL to summary
      #   env:
      #     IMAGE_URL: ${{ steps.upload-image.outputs.url }}
      #   run: |
      #     echo "Custom Debian image artifacts: $IMAGE_URL" >> "$GITHUB_STEP_SUMMARY"

      # TODO: boot the image in QEMU to test it; commented out as it's slow
      # without KVM.
      # - name: Test the image in QEMU
      #   run: py.test-3 --verbose --capture=no ci/qemu_test.py
