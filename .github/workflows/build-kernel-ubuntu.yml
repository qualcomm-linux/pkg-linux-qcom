name: build-kernel-ubuntu

# Build a kernel package for an Ubuntu-family suite and publish it to S3.
#
# Called per matrix entry by daily.yml and pr-build.yml, which select the
# Ubuntu entries with resolve-matrix.sh --family ubuntu and call only this
# workflow for them. The package is built in a suite-matched pkg-builder
# container on the self-hosted runner rather than in Debusine, which builds
# only the Debian family.
#
# Ubuntu has no release path: promotion runs through Debusine, so a Release
# entry for an Ubuntu suite is rejected by resolve-matrix.sh rather than built
# here and quietly not promoted.
#
# Jobs:
#   prepare (self-hosted): clone, patch, inject debian/, build the source package.
#   build   (self-hosted): build the .deb files and upload them to S3.

on:
  workflow_call:
    inputs:
      kernel-variant:
        description: 'Kernel variant identifier'
        type: string
        default: 'qcom-next'
      suite:
        description: 'Target Ubuntu suite (noble, resolute)'
        type: string
        default: 'resolute'
      kernel-branch:
        description: 'Source branch or pinned tag used by branch_tip or pinned_ref'
        type: string
        default: 'qcom-next'
      git-clone:
        description: 'Kernel repository URL'
        type: string
        default: 'https://github.com/qualcomm-linux/kernel'
      ref-strategy:
        description: 'Kernel ref strategy: latest_tag, branch_tip, or pinned_ref'
        type: string
        default: 'latest_tag'
      tag-pattern:
        description: 'Tag glob used when ref-strategy=latest_tag'
        type: string
        default: 'qcom-next-*'
      srcpkg:
        description: 'Source package name'
        type: string
        default: 'linux-qcom-next'
      binpkg:
        description: 'Binary metapackage name'
        type: string
        default: 'linux-image-qcom-next'
      kernel-config:
        description: 'Extra config fragments applied on top of all of debian/config-available/ (e.g. intree:arch/arm64/configs/qcom_debug.config)'
        type: string
        default: ''
      dkms:
        description: 'Out-of-tree DKMS modules to build and bundle into the kernel image, comma-separated and without the -dkms suffix (e.g. kgsl,camx); empty bundles nothing'
        type: string
        default: ''
      debian-revision:
        description: 'Debian revision component of the package version'
        type: string
        default: '0qli1~'
      localversion:
        description: 'Override LOCALVERSION suffix (auto-derived from the resolved ref if empty)'
        type: string
        default: ''
      kver-extra:
        description: 'Extra KVER suffix, appended to the kernel release verbatim'
        type: string
        default: ''

  # Ad-hoc build of one Ubuntu suite.
  workflow_dispatch:
    inputs:
      kernel-variant:
        description: 'Kernel variant identifier'
        required: true
        default: 'qcom-next'
        type: string
      suite:
        description: 'Target Ubuntu suite (noble, resolute). A Debian suite here is rejected before anything is built; dispatch build-kernel-debian for those.'
        required: true
        default: 'resolute'
        type: string
      ref-strategy:
        description: 'Kernel ref strategy'
        required: true
        default: 'latest_tag'
        type: choice
        options:
          - latest_tag
          - branch_tip
          - pinned_ref
      kernel-branch:
        description: 'Branch for branch_tip or immutable ref for pinned_ref (ignored for latest_tag)'
        required: false
        default: 'qcom-next'
      tag-pattern:
        description: 'Tag glob used only by latest_tag (ignored for branch_tip and pinned_ref)'
        required: false
        default: 'qcom-next-*'
      kernel-url:
        description: 'Advanced: custom kernel repository URL (empty uses qualcomm-linux/kernel)'
        required: false
        default: ''
      srcpkg:
        description: 'Advanced: Debian source package name'
        required: false
        default: 'linux-qcom-next'
      binpkg:
        description: 'Advanced: kernel image metapackage name'
        required: false
        default: 'linux-image-qcom-next'
      kernel-config:
        description: 'Advanced: extra config fragments applied on top of all of debian/config-available/ (e.g. intree:arch/arm64/configs/qcom_debug.config)'
        required: false
        default: ''
      dkms:
        description: 'Advanced: out-of-tree DKMS modules to build and bundle into the kernel image, comma-separated and without the -dkms suffix (e.g. kgsl,camx); empty bundles nothing'
        required: false
        default: ''
      debian-version-stub:
        description: 'Advanced: Debian version stub; the selected suite''s mapped suffix and a Daily-style trailing ~ are applied automatically'
        required: false
        default: '0qli1'
      localversion:
        description: 'Advanced: LOCALVERSION override (auto-derived from the resolved ref if empty)'
        required: false
        default: ''
      kver-extra:
        description: 'Advanced: extra KVER suffix (e.g. -ci42), appended to the kernel release verbatim'
        required: false
        default: ''
      qcom-next-pr:
        description: 'Advanced Qualcomm-only override: qcom-next PR numbers to merge (e.g. "42 43")'
        type: string
        required: false
        default: ''
      kernel-topics-pr:
        description: 'Advanced Qualcomm-only override: kernel-topics PR numbers to apply as patches'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # prepare: clone kernel source, inject packaging, run prepare-source.sh.
  # ---------------------------------------------------------------------------
  prepare:
    name: Generate source package
    runs-on: [self-hosted, lecore-prd-u2404-arm64-xlrg-od-ephem]
    permissions:
      contents: read  # actions/checkout
      packages: read  # docker pull ghcr.io/qualcomm-linux/pkg-builder
    steps:
      # debian/ and ci/ live on the same branch, so one checkout supplies both
      # the packaging and the scripts, the delivery matrix they read, and the
      # prepare-kernel-source action below.
      #
      # An empty ref leaves actions/checkout on github.sha, the commit this run
      # was dispatched from or the one the calling workflow runs at.
      - name: Checkout pkg-linux-qcom
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare kernel source
        uses: ./.github/actions/prepare-kernel-source
        with:
          kernel-variant: ${{ inputs.kernel-variant || 'qcom-next' }}
          suite: ${{ inputs.suite }}
          expect-family: ubuntu
          kernel-url: ${{ inputs.git-clone || inputs.kernel-url || 'https://github.com/qualcomm-linux/kernel' }}
          ref-strategy: ${{ inputs.ref-strategy }}
          kernel-branch: ${{ inputs.kernel-branch }}
          tag-pattern: ${{ inputs.tag-pattern }}
          srcpkg: ${{ inputs.srcpkg }}
          binpkg: ${{ inputs.binpkg }}
          kernel-config: ${{ inputs.kernel-config }}
          dkms: ${{ inputs.dkms }}
          debian-revision: ${{ inputs.debian-revision }}
          debian-version-stub: ${{ inputs.debian-version-stub || '0qli1' }}
          localversion: ${{ inputs.localversion }}
          kver-extra: ${{ inputs.kver-extra }}
          qcom-next-pr: ${{ inputs.qcom-next-pr }}
          kernel-topics-pr: ${{ inputs.kernel-topics-pr }}

  # ---------------------------------------------------------------------------
  # build: build the source package in a suite-matched container, then publish.
  #
  # Named for where the build happens, as the Debian workflows' Build package
  # (Debusine) is: this one runs in a suite-matched pkg-builder container on
  # the runner rather than being submitted to a build service.
  # ---------------------------------------------------------------------------
  build:
    name: Build package (Docker)
    needs: prepare
    runs-on: [self-hosted, lecore-prd-u2404-arm64-xlrg-od-ephem]
    permissions:
      contents: read  # actions/checkout
      packages: read  # docker pull ghcr.io/qualcomm-linux/pkg-builder
    env:
      DISTRO: ${{ inputs.suite }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout pkg-linux-qcom
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to @main while native kernel-build support is still landing
      # upstream in qualcomm-linux/docker-pkg-build.
      - name: Checkout docker-pkg-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: qualcomm-linux/docker-pkg-build
          ref: main
          path: docker-pkg-build

      - name: Pull builder image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No -x: REGISTRY_TOKEN is in env.
          set -euo pipefail
          # Same split as the prepare job: pull what docker-pkg-build
          # publishes, build what it does not. Nothing is forced here, because
          # the build below builds the image itself when it finds it missing,
          # so an unpublished suite needs no step of its own, only the absence
          # of a pull.
          case "$DISTRO" in
            noble|resolute)
              echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
              docker pull "ghcr.io/qualcomm-linux/pkg-builder:$DISTRO"
              ;;
            *)
              echo "No published pkg-builder image for $DISTRO; it will be built on demand."
              ;;
          esac
          docker image ls

      - name: Download source package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-package-${{ inputs.kernel-variant || 'qcom-next' }}-${{ inputs.suite }}
          path: source-package

      - name: Build kernel package
        run: |
          # The prepare job built the source package; --dsc hands it to
          # sbuild in the suite's pkg-builder image, so what is built here
          # is the .dsc the run reported, as Debusine builds it for the Debian
          # family. Nothing is cloned or prepared again.
          set -euo pipefail
          DSC=$(ls source-package/*.dsc)
          [[ $(wc -l <<<"$DSC") -eq 1 ]] || {
            echo "::error::Expected exactly one .dsc in the source package artifact, found: $DSC"
            exit 1
          }
          ./build-kernel.sh \
            --build-mode docker \
            --distro "$DISTRO" \
            --dsc "$DSC" \
            --docker-build "$GITHUB_WORKSPACE/docker-pkg-build/docker_deb_build.py"

      - name: Upload .deb packages to S3
        # build-kernel.sh outputs to kernel-build/<distro>/ by default.
        # Keep kernel variant and suite in the destination so concurrent matrix
        # legs cannot overwrite or mix package outputs. Consumers must select
        # the variant and suite they intend to install.
        uses: qualcomm-linux/upload-private-artifact-action@4940e9327cd7386acdb908b61c714c079b7d754b # aws-v4
        with:
          s3_bucket: ${{ vars.ARTIFACT_S3_BUCKET }}
          path: kernel-build/${{ inputs.suite }}
          destination: ${{ github.repository_owner }}/pkg/temp/${{ github.event.repository.name }}/${{ inputs.kernel-variant || 'qcom-next' }}/${{ inputs.suite }}/${{ github.run_id }}-${{ github.run_attempt }}/
