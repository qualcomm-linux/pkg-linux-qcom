name: build-kernel-ubuntu

# Build a kernel package for an Ubuntu-family suite and publish it to S3.
#
# Called per matrix entry by daily.yml and pr-build.yml, which select the
# Ubuntu entries with resolve-matrix.py --family ubuntu and call only this
# workflow for them. The package is built in a suite-matched pkg-builder
# container on the self-hosted runner rather than in Debusine, which builds
# only the Debian family.
#
# Ubuntu has no release path: promotion runs through Debusine, so a Release
# entry for an Ubuntu suite is rejected by resolve-matrix.py rather than built
# here and quietly not promoted.
#
# workflow_call only. One run of this workflow is one matrix entry, and a
# reusable workflow cannot fan itself out over several, so manual builds are
# dispatched from daily.yml -- which resolves the entries and calls this once
# per Ubuntu entry it selected. That also keeps every value describing a build
# in ci/build-matrix.yaml, rather than in a dispatch form that drifts from it.
#
# Jobs:
#   prepare (self-hosted): clone, patch, inject debian/, generate the source.
#   build   (self-hosted): build the .deb files and upload them to S3.

on:
  workflow_call:
    inputs:
      build:
        description: 'Name of this build, as listed in ci/build-matrix.yaml'
        type: string
        default: 'qcom-next-resolute'
      flavour:
        description: 'Kernel flavour: the LOCALVERSION suffix and so the kernel release identity'
        type: string
        default: 'qcom-next'
      suite:
        description: 'Target Ubuntu suite (noble, resolute)'
        type: string
        default: 'resolute'
      kernel-branch:
        description: 'Source branch or pinned tag used by branch_tip or pinned_ref'
        type: string
        default: 'qcom-next'
      git-clone:
        description: 'Kernel repository URL'
        type: string
        default: 'https://github.com/qualcomm-linux/kernel'
      ref-strategy:
        description: 'Kernel ref strategy: latest_tag, branch_tip, or pinned_ref'
        type: string
        default: 'latest_tag'
      tag-pattern:
        description: 'Tag glob used when ref-strategy=latest_tag'
        type: string
        default: 'qcom-next-*'
      srcpkg:
        description: 'Source package name'
        type: string
        default: 'linux-qcom-next'
      binpkg:
        description: 'Binary metapackage name'
        type: string
        default: 'linux-image-qcom-next'
      kernel-config:
        description: 'Extra config fragments applied on top of all of debian/config-available/'
        type: string
        default: ''
      dkms:
        description: 'Out-of-tree DKMS modules to bundle, comma-separated and without the -dkms suffix'
        type: string
        default: ''
      debian-revision:
        description: 'Debian revision component of the package version'
        type: string
        default: '0qli~'
      localversion:
        description: 'Override LOCALVERSION suffix (auto-derived from the resolved ref if empty)'
        type: string
        default: ''
      kver-extra:
        description: 'Extra suffix appended to the package version'
        type: string
        default: ''
      debug-build:
        description: 'Enable the debug build configuration'
        type: boolean
        default: false
      qcom-next-pr:
        description: 'qcom-next PR numbers to merge (e.g. "42 43")'
        type: string
        default: ''
      kernel-topics-pr:
        description: 'kernel-topics PR numbers to apply as patches'
        type: string
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # prepare: clone kernel source, inject packaging, run prepare-source.sh.
  # ---------------------------------------------------------------------------
  prepare:
    name: Generate source package
    runs-on: [self-hosted, lecore-prd-u2404-arm64-xlrg-od-ephem]
    permissions:
      contents: read  # actions/checkout
      packages: read  # docker pull ghcr.io/qualcomm-linux/pkg-builder
    steps:
      - name: Checkout pkg-linux-qcom
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare kernel source
        uses: ./.github/actions/prepare-kernel-source
        with:
          build: ${{ inputs.build }}
          suite: ${{ inputs.suite }}
          expect-family: ubuntu
          flavour: ${{ inputs.flavour }}
          kernel-url: ${{ inputs.git-clone }}
          ref-strategy: ${{ inputs.ref-strategy }}
          kernel-branch: ${{ inputs.kernel-branch }}
          tag-pattern: ${{ inputs.tag-pattern }}
          srcpkg: ${{ inputs.srcpkg }}
          binpkg: ${{ inputs.binpkg }}
          kernel-config: ${{ inputs.kernel-config }}
          dkms: ${{ inputs.dkms }}
          debian-revision: ${{ inputs.debian-revision }}
          localversion: ${{ inputs.localversion }}
          kver-extra: ${{ inputs.kver-extra }}
          debug-build: ${{ inputs.debug-build }}
          qcom-next-pr: ${{ inputs.qcom-next-pr }}
          kernel-topics-pr: ${{ inputs.kernel-topics-pr }}

  # ---------------------------------------------------------------------------
  # build: build the prepared source in a suite-matched container, then publish.
  #
  # Named for where the build happens, as the Debian workflows' Build package
  # (Debusine) is: this one runs in a suite-matched pkg-builder container on
  # the runner rather than being submitted to a build service.
  # ---------------------------------------------------------------------------
  build:
    name: Build package (Docker)
    needs: prepare
    runs-on: [self-hosted, lecore-prd-u2404-arm64-xlrg-od-ephem]
    permissions:
      contents: read  # actions/checkout
      packages: read  # docker pull ghcr.io/qualcomm-linux/pkg-builder
    env:
      DISTRO: ${{ inputs.suite }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout pkg-linux-qcom
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to @main while native kernel-build support is still landing
      # upstream in qualcomm-linux/docker-pkg-build.
      - name: Checkout docker-pkg-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: qualcomm-linux/docker-pkg-build
          ref: main
          path: docker-pkg-build

      - name: Fetch builder image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No -x: REGISTRY_TOKEN is in env.
          set -euo pipefail
          # Same split as prepare-kernel-source: pull what docker-pkg-build
          # publishes, build what it does not. Nothing is forced here, because
          # docker_deb_build.py builds the image itself when the build below
          # finds it missing -- so an unpublished suite needs no step of its
          # own, only the absence of a pull.
          case "$DISTRO" in
            resolute)
              echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
              docker pull "ghcr.io/qualcomm-linux/pkg-builder:$DISTRO"
              ;;
            *)
              echo "No published pkg-builder image for $DISTRO; it will be built on demand."
              ;;
          esac
          docker image ls

      - name: Download prepared source tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kernel-srcpkg-${{ inputs.flavour }}-${{ inputs.suite }}
          path: /tmp/srcpkg-artifact

      - name: Extract prepared source tree
        run: |
          # tar.gz preserves the execute bits that upload-artifact's zip would
          # strip (see README); --strip-components=1 drops the archive's top dir.
          mkdir -p kernel-source
          tar xzf /tmp/srcpkg-artifact/*.tar.gz \
            -C kernel-source --strip-components=1
          echo "KERNEL_DIR=$GITHUB_WORKSPACE/kernel-source" >> "$GITHUB_ENV"

      - name: Build kernel package
        run: |
          # Kernel source was cloned, patched, and prepared by the prepare job.
          # Pass --local-source and --skip-prepare so build-kernel.sh goes
          # directly to the build step. debian/control, debian/changelog, and
          # all config fragments are already baked into the extracted source
          # tree; no re-derivation of LOCALVERSION, kver-extra, or debug config
          # is needed here.
          ./build-kernel.sh \
            --build-mode docker \
            --distro "$DISTRO" \
            --local-source "$KERNEL_DIR" \
            --skip-prepare \
            --docker-build "$GITHUB_WORKSPACE/docker-pkg-build/docker_deb_build.py"

      - name: Upload .deb packages to S3
        # build-kernel.sh outputs to kernel-build/<distro>/ by default.
        # Keep flavour and suite in the destination so concurrent matrix legs
        # cannot overwrite or mix package outputs. Consumers must select the
        # flavour and suite they intend to install.
        uses: qualcomm-linux/upload-private-artifact-action@4940e9327cd7386acdb908b61c714c079b7d754b # aws-v4
        with:
          s3_bucket: ${{ vars.ARTIFACT_S3_BUCKET }}
          path: kernel-build/${{ inputs.suite }}
          destination: ${{ github.repository_owner }}/pkg/temp/${{ github.event.repository.name }}/${{ inputs.flavour }}/${{ inputs.suite }}/${{ github.run_id }}-${{ github.run_attempt }}/
