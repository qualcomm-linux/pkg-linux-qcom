name: build-kernel-ubuntu

# Reusable workflow: Ubuntu kernel build via build-kernel.sh.
#
# Called by build-kernel-deb.yml when the target suite is Ubuntu-family
# (noble, resolute). The kernel source has already been cloned, patched,
# prepared and built into a source package by the prepare job in the caller
# workflow. This workflow downloads the source-package artifact and runs
# build-kernel.sh --dsc, which builds that .dsc with sbuild.
#
# The artifact is shared from the caller via github.run_id. Build and S3 upload
# run on the self-hosted runner, which has direct IAM access.

on:
  workflow_call:
    inputs:
      distro:
        description: Target Ubuntu suite (noble, resolute)
        type: string
        required: true
      kernel-variant:
        description: 'Kernel variant identifier used to isolate source-package artifacts and published packages'
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build kernel package
    runs-on: [self-hosted, lecore-prd-u2404-arm64-xlrg-od-ephem]
    permissions:
      contents: read  # actions/checkout
      packages: read  # docker pull ghcr.io/qualcomm-linux/pkg-builder
    env:
      DISTRO: ${{ inputs.distro }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout pkg-linux-qcom
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to @main while native kernel-build support is still landing
      # upstream in qualcomm-linux/docker-pkg-build.
      - name: Checkout docker-pkg-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: qualcomm-linux/docker-pkg-build
          ref: main
          path: docker-pkg-build

      - name: Pull builder image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No -x: REGISTRY_TOKEN is in env.
          set -euo pipefail
          # Same split as the caller's prepare job: pull what docker-pkg-build
          # publishes, build what it does not. Nothing is forced here, because
          # the build below builds the image itself when it finds it missing,
          # so an unpublished suite needs no step of its own, only the absence
          # of a pull.
          case "$DISTRO" in
            noble|resolute)
              echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
              docker pull "ghcr.io/qualcomm-linux/pkg-builder:$DISTRO"
              ;;
            *)
              echo "No published pkg-builder image for $DISTRO; it will be built on demand."
              ;;
          esac
          docker image ls

      - name: Download source package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-package-${{ inputs.kernel-variant }}-${{ inputs.distro }}
          path: source-package

      - name: Build kernel package
        run: |
          # The caller's prepare job built the source package; --dsc hands it
          # to sbuild in the suite's pkg-builder image, so what is built here
          # is the .dsc the run reported, as Debusine builds it for the Debian
          # family. Nothing is cloned or prepared again.
          set -euo pipefail
          DSC=$(ls source-package/*.dsc)
          [[ $(wc -l <<<"$DSC") -eq 1 ]] || {
            echo "::error::Expected exactly one .dsc in the source package artifact, found: $DSC"
            exit 1
          }
          ./build-kernel.sh \
            --build-mode docker \
            --distro "$DISTRO" \
            --dsc "$DSC" \
            --docker-build "$GITHUB_WORKSPACE/docker-pkg-build/docker_deb_build.py"

      - name: Upload .deb packages to S3
        # build-kernel.sh outputs to kernel-build/<distro>/ by default.
        # Keep kernel variant and suite in the destination so concurrent matrix
        # legs cannot overwrite or mix package outputs. Consumers must select
        # the variant and suite they intend to install.
        uses: qualcomm-linux/upload-private-artifact-action@4940e9327cd7386acdb908b61c714c079b7d754b # aws-v4
        with:
          s3_bucket: ${{ vars.ARTIFACT_S3_BUCKET }}
          path: kernel-build/${{ inputs.distro }}
          destination: ${{ github.repository_owner }}/pkg/temp/${{ github.event.repository.name }}/${{ inputs.kernel-variant }}/${{ inputs.distro }}/${{ github.run_id }}-${{ github.run_attempt }}/
