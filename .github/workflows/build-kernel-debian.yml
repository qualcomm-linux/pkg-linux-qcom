name: build-kernel-debian

# Build a kernel package for a Debian-family suite and publish it to S3.
#
# Called per matrix entry by daily.yml and pr-build.yml, which select the
# Debian entries with resolve-matrix.py --family debian and call only this
# workflow for them. Nothing here is conditional on the suite: a caller that
# reaches this file has already decided the build belongs on the Debusine
# path, so every job in it runs.
#
# workflow_call only. One run of this workflow is one matrix entry, and a
# reusable workflow cannot fan itself out over several, so manual builds are
# dispatched from daily.yml -- which resolves the entries and calls this once
# per Debian entry it selected. That also keeps every value describing a build
# in ci/build-matrix.yaml, rather than in a dispatch form that drifts from it.
#
# release-kernel-debian.yml is the same build with the release tail: it
# promotes to a target Debusine workspace instead of publishing to S3.
#
# Jobs:
#   prepare (self-hosted): clone, patch, inject debian/, generate the source.
#   build   (debusine-pkg-builder container): submit to Debusine.
#   publish (self-hosted): download the .deb files and upload them to S3.

on:
  workflow_call:
    inputs:
      build:
        description: 'Name of this build, as listed in ci/build-matrix.yaml'
        type: string
        default: 'qcom-next-trixie'
      flavour:
        description: 'Kernel flavour: the LOCALVERSION suffix and so the kernel release identity'
        type: string
        default: 'qcom-next'
      suite:
        description: 'Target Debian suite (trixie, forky, sid)'
        type: string
        default: 'trixie'
      kernel-branch:
        description: 'Source branch or pinned tag used by branch_tip or pinned_ref'
        type: string
        default: 'qcom-next'
      git-clone:
        description: 'Kernel repository URL'
        type: string
        default: 'https://github.com/qualcomm-linux/kernel'
      ref-strategy:
        description: 'Kernel ref strategy: latest_tag, branch_tip, or pinned_ref'
        type: string
        default: 'latest_tag'
      tag-pattern:
        description: 'Tag glob used when ref-strategy=latest_tag'
        type: string
        default: 'qcom-next-*'
      srcpkg:
        description: 'Source package name'
        type: string
        default: 'linux-qcom-next'
      binpkg:
        description: 'Binary metapackage name'
        type: string
        default: 'linux-image-qcom-next'
      kernel-config:
        description: 'Extra config fragments applied on top of all of debian/config-available/'
        type: string
        default: ''
      dkms:
        description: 'Out-of-tree DKMS modules to bundle, comma-separated and without the -dkms suffix'
        type: string
        default: ''
      debian-revision:
        description: 'Debian revision component of the package version'
        type: string
        default: '0qli~'
      localversion:
        description: 'Override LOCALVERSION suffix (auto-derived from the resolved ref if empty)'
        type: string
        default: ''
      kver-extra:
        description: 'Extra suffix appended to the package version'
        type: string
        default: ''
      debug-build:
        description: 'Enable the debug build configuration'
        type: boolean
        default: false
      debusine-parent-workspace:
        description: 'Parent Debusine workspace for CI child workspace creation'
        type: string
        default: ''
      qcom-next-pr:
        description: 'qcom-next PR numbers to merge (e.g. "42 43")'
        type: string
        default: ''
      kernel-topics-pr:
        description: 'kernel-topics PR numbers to apply as patches'
        type: string
        default: ''
    secrets:
      DEBUSINE_USER:
        description: 'Debusine account used to submit CI builds'
        required: false
      DEBUSINE_TOKEN:
        description: 'Debusine token for the CI child workspace'
        required: false

permissions:
  contents: read
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # prepare: clone kernel source, inject packaging, run prepare-source.sh.
  # ---------------------------------------------------------------------------
  prepare:
    name: Generate source package
    runs-on: [self-hosted, lecore-prd-u2404-arm64-xlrg-od-ephem]
    permissions:
      contents: read  # actions/checkout
      packages: read  # docker pull ghcr.io/qualcomm-linux/pkg-builder
    steps:
      # debian/ and ci/ live on the same branch, so one checkout supplies both
      # the packaging and the scripts, the delivery matrix they read, and the
      # prepare-kernel-source action below.
      #
      # An empty ref leaves actions/checkout on github.sha, the commit this run
      # was dispatched from or the one the calling workflow runs at.
      - name: Checkout pkg-linux-qcom
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare kernel source
        uses: ./.github/actions/prepare-kernel-source
        with:
          build: ${{ inputs.build }}
          suite: ${{ inputs.suite }}
          expect-family: debian
          flavour: ${{ inputs.flavour }}
          kernel-url: ${{ inputs.git-clone }}
          ref-strategy: ${{ inputs.ref-strategy }}
          kernel-branch: ${{ inputs.kernel-branch }}
          tag-pattern: ${{ inputs.tag-pattern }}
          srcpkg: ${{ inputs.srcpkg }}
          binpkg: ${{ inputs.binpkg }}
          kernel-config: ${{ inputs.kernel-config }}
          dkms: ${{ inputs.dkms }}
          debian-revision: ${{ inputs.debian-revision }}
          localversion: ${{ inputs.localversion }}
          kver-extra: ${{ inputs.kver-extra }}
          debug-build: ${{ inputs.debug-build }}
          qcom-next-pr: ${{ inputs.qcom-next-pr }}
          kernel-topics-pr: ${{ inputs.kernel-topics-pr }}

  # ---------------------------------------------------------------------------
  # build: generate the Debian source package and submit it to Debusine.
  # ---------------------------------------------------------------------------
  build:
    name: Build package (Debusine)
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read  # actions/checkout
      packages: read  # container: ghcr.io/qualcomm-linux/debusine-pkg-builder
    environment: Staging
    container:
      image: ghcr.io/qualcomm-linux/debusine-pkg-builder:trixie
      options: --user 0:0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      workspace: ${{ steps.debusine.outputs.workspace }}
    steps:
      # Only for the debusine-build action itself: the package being built
      # comes from the prepared-source artifact, not from this checkout.
      - name: Checkout pkg-linux-qcom
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build in Debusine
        id: debusine
        uses: ./.github/actions/debusine-build
        with:
          suite: ${{ inputs.suite }}
          flavour: ${{ inputs.flavour }}
          debusine-host: ${{ vars.DEBUSINE_HOST }}
          debusine-scope: ${{ vars.DEBUSINE_SCOPE }}
          debusine-user: ${{ secrets.DEBUSINE_USER }}
          debusine-token: ${{ secrets.DEBUSINE_TOKEN }}
          debusine-parent-workspace: ${{ inputs.debusine-parent-workspace || vars.DEBUSINE_PARENT_WORKSPACE || 'qli-ci' }}
          # A staging build: also reads qli-staging, which carries package
          # versions that have not been released to qli yet.
          extra-build-dep-workspaces: qli qli-staging

  # ---------------------------------------------------------------------------
  # publish: download the .deb files from Debusine and upload them to S3.
  # Runs on the self-hosted runner, which has direct IAM access.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to S3
    needs: build
    runs-on: [self-hosted, lecore-prd-u2404-arm64-xlrg-od-ephem]
    permissions:
      contents: read  # actions/checkout
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout debusine-action helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: qualcomm-linux/debusine-action
          ref: main
          path: debusine-action
          fetch-depth: 1
          sparse-checkout: |
            lib

      - name: Generate Debusine apt configuration
        env:
          DEBUSINE_HOST: ${{ vars.DEBUSINE_HOST }}
          DEBUSINE_SCOPE: ${{ vars.DEBUSINE_SCOPE }}
          DEBUSINE_USER: ${{ secrets.DEBUSINE_USER }}
          DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}
          DEBUSINE_WORKSPACE: ${{ needs.build.outputs.workspace }}
          SUITE: ${{ inputs.suite }}
        run: |
          debusine-action/lib/generate-apt-config

      - name: Download .deb packages from Debusine workspace
        run: |
          set -euxo pipefail
          sudo apt-get install -y --no-install-recommends devscripts
          mkdir -p "$GITHUB_WORKSPACE/deb-artifacts"
          chdist create debusine-workspace
          rm -f ~/.chdist/debusine-workspace/etc/apt/sources.list
          install -d ~/.chdist/debusine-workspace/etc/apt/sources.list.d
          install -d ~/.chdist/debusine-workspace/etc/apt/auth.conf.d
          install -m 0644 debusine-ci.sources \
            ~/.chdist/debusine-workspace/etc/apt/sources.list.d/
          install -m 0600 debusine-ci-auth.conf \
            ~/.chdist/debusine-workspace/etc/apt/auth.conf.d/
          chdist apt-get debusine-workspace update
          packages=$(chdist apt-cache debusine-workspace search . | awk '{print $1}' | tr '\n' ' ')
          [[ -n "$packages" ]] || { echo "ERROR: no packages found in Debusine workspace"; exit 1; }
          echo "Packages to download: $packages"
          cd "$GITHUB_WORKSPACE/deb-artifacts"
          # shellcheck disable=SC2086
          chdist apt-get debusine-workspace download $packages

      - name: Upload .deb packages to S3
        # Keep flavour and suite in the destination so concurrent matrix legs
        # cannot overwrite or mix package outputs. Consumers must select the
        # flavour and suite they intend to install.
        uses: qualcomm-linux/upload-private-artifact-action@4940e9327cd7386acdb908b61c714c079b7d754b # aws-v4
        with:
          s3_bucket: ${{ vars.ARTIFACT_S3_BUCKET }}
          path: deb-artifacts
          destination: ${{ github.repository_owner }}/pkg/debusine/${{ github.event.repository.name }}/${{ inputs.flavour }}/${{ inputs.suite }}/${{ github.run_id }}-${{ github.run_attempt }}/
