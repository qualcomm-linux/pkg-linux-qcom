name: build-kernel-debian

# Build a kernel package for a Debian-family suite, publish it to S3, and
# promote it into a Debusine workspace when the caller names one.
#
# Called per matrix entry by daily.yml and pr-build.yml, which select the
# Debian entries with resolve-matrix.py --family debian and call only this
# workflow for them. Nothing here is conditional on the suite: a caller that
# reaches this file has already decided the build belongs on the Debusine
# path.
#
# workflow_call only. One run of this workflow is one matrix entry, and a
# reusable workflow cannot fan itself out over several, so manual builds are
# dispatched from daily.yml -- which resolves the entries and calls this once
# per Debian entry it selected. That also keeps every value describing a build
# in ci/build-matrix.yaml, rather than in a dispatch form that drifts from it.
#
# Publishing happens here and nowhere else. A caller that names a
# target-workspace has this run's own build promoted into it, out of the
# ephemeral CI workspace it was built in, so the archive carries the artifact
# this run produced and tested. There is no later step that could publish
# something else, and nothing rebuilds a ref that has already been built.
#
# Jobs:
#   prepare (self-hosted): clone, inject debian/, build the source package,
#           and decide whether the version it produces is already published.
#   build   (debusine-pkg-builder container): submit to Debusine.
#   publish (self-hosted): download the .deb files and upload them to S3.
#   promote (debusine-pkg-builder container): copy the result into
#           target-workspace. Skipped entirely when no workspace was named.

on:
  workflow_call:
    inputs:
      build:
        description: 'Name of this build, as listed in ci/build-matrix.yaml'
        type: string
        required: true
      flavour:
        description: 'Kernel flavour: the LOCALVERSION suffix and so the kernel release identity'
        type: string
        required: true
      suite:
        description: 'Target Debian suite (trixie, forky, sid)'
        type: string
        required: true
      kernel-branch:
        description: 'Source branch or pinned tag used by branch_tip or pinned_ref'
        type: string
        required: true
      git-clone:
        description: 'Kernel repository URL'
        type: string
        required: true
      ref-strategy:
        description: 'Kernel ref strategy: latest_tag, branch_tip, or pinned_ref'
        type: string
        required: true
      tag-pattern:
        description: 'Tag glob used when ref-strategy=latest_tag'
        type: string
        default: 'qcom-next-*'
      srcpkg:
        description: 'Source package name'
        type: string
        required: true
      binpkg:
        description: 'Binary metapackage name'
        type: string
        required: true
      kernel-config:
        description: 'Extra config fragments applied on top of all of debian/config-available/'
        type: string
        default: ''
      dkms:
        description: 'Out-of-tree DKMS modules to bundle, comma-separated and without the -dkms suffix'
        type: string
        default: ''
      debian-revision:
        description: 'Debian revision component of the package version'
        type: string
        required: true
      localversion:
        description: 'Override LOCALVERSION suffix (auto-derived from the resolved ref if empty)'
        type: string
        default: ''
      kver-extra:
        description: 'Extra suffix appended to the package version'
        type: string
        default: ''
      debusine-parent-workspace:
        description: 'Parent Debusine workspace for CI child workspace creation'
        type: string
        default: ''
      extra-build-dep-workspaces:
        description: >
          Workspaces the build resolves its Build-Depends from, space
          separated. The caller decides, because it follows from what becomes
          of the result: the nightly is what a release promotes, so it reads
          released archives only, and a PR build may legitimately need a
          package that has reached staging and no further.
        type: string
        default: 'qli'
      target-workspace:
        description: >
          Debusine workspace to promote the built package into, empty to
          promote nowhere. The caller decides: the nightly build names the
          staging workspace, and pr-build.yml leaves it empty because a pull
          request's kernel must not reach an archive.
        type: string
        default: ''
      promote-environment:
        description: >
          GitHub environment the promote job runs in, and so which approvals
          and which credentials stand between a build and the archive it
          publishes into. Defaults to Staging, where the nightly promotes
          unattended. release.yml passes Production, because a release reaches
          an archive people install from and an unreviewed one must not.
        type: string
        default: 'Staging'
    secrets:
      DEBUSINE_USER:
        description: 'Debusine account used to submit CI builds'
        required: false
      DEBUSINE_TOKEN:
        description: 'Debusine token for the CI child workspace'
        required: false

permissions:
  contents: read
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # prepare: clone kernel source, inject packaging, run prepare-source.sh, and
  # report the version that produces.
  #
  # The version is decided here, by the ref this run resolved and the revision
  # it was given, so this is the first point at which the run can tell whether
  # there is anything new to build. When the caller named a target workspace
  # and that version is already in it, every later job is skipped: the nightly
  # build of a tag that has not moved would otherwise rebuild the same version
  # and then fail promoting it as a duplicate.
  # ---------------------------------------------------------------------------
  prepare:
    name: Generate source package
    runs-on: [self-hosted, lecore-prd-u2404-arm64-xlrg-od-ephem]
    permissions:
      contents: read  # actions/checkout
      packages: read  # docker pull ghcr.io/qualcomm-linux/pkg-builder
    outputs:
      srcpkg_version: ${{ steps.prepare.outputs.srcpkg_version }}
      already_published: ${{ steps.published.outputs.already_published }}
    steps:
      # debian/ and ci/ live on the same branch, so one checkout supplies both
      # the packaging and the scripts, the delivery matrix they read, and the
      # prepare-kernel-source action below.
      #
      # An empty ref leaves actions/checkout on github.sha, the commit this run
      # was dispatched from or the one the calling workflow runs at.
      - name: Checkout pkg-linux-qcom
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare kernel source
        id: prepare
        uses: ./.github/actions/prepare-kernel-source
        with:
          build: ${{ inputs.build }}
          suite: ${{ inputs.suite }}
          expect-family: debian
          flavour: ${{ inputs.flavour }}
          kernel-url: ${{ inputs.git-clone }}
          ref-strategy: ${{ inputs.ref-strategy }}
          kernel-branch: ${{ inputs.kernel-branch }}
          tag-pattern: ${{ inputs.tag-pattern }}
          srcpkg: ${{ inputs.srcpkg }}
          binpkg: ${{ inputs.binpkg }}
          kernel-config: ${{ inputs.kernel-config }}
          dkms: ${{ inputs.dkms }}
          debian-revision: ${{ inputs.debian-revision }}
          localversion: ${{ inputs.localversion }}
          kver-extra: ${{ inputs.kver-extra }}

      # Only needed to ask the target workspace what it already has, so it is
      # checked out only when there is a target workspace to ask.
      - name: Checkout debusine-action helpers
        if: ${{ inputs.target-workspace != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: qualcomm-linux/debusine-action
          ref: main
          path: debusine-action
          fetch-depth: 1
          sparse-checkout: |
            lib

      # The archive is the authority on whether there is anything to do. A
      # rerun, a retry, and a night on which the tracked tag did not move all
      # generate the version that is already published, because the version is
      # a function of the resolved ref and the revision -- so asking here is
      # what turns "nothing new upstream" into a skipped run rather than a
      # rebuild that fails promoting a duplicate.
      #
      # Two ways of not getting an answer, deliberately treated differently.
      # A workspace whose signing key cannot be fetched is a configuration
      # problem -- it does not exist, or this token cannot see it -- and fails
      # the run, because every later night would fail the same way and silence
      # would hide it. An index that cannot be read once the workspace is
      # reachable is reported as not having the version, which builds and lets
      # the promotion fail loudly. Neither is allowed to look like a
      # successful night on which nothing needed doing.
      - name: Check the target workspace for this version
        id: published
        if: ${{ inputs.target-workspace != '' }}
        env:
          DEBUSINE_HOST: ${{ vars.DEBUSINE_HOST }}
          DEBUSINE_SCOPE: ${{ vars.DEBUSINE_SCOPE }}
          DEBUSINE_USER: ${{ secrets.DEBUSINE_USER }}
          DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}
          DEBUSINE_WORKSPACE: ${{ inputs.target-workspace }}
          SUITE: ${{ inputs.suite }}
          SRCPKG: ${{ inputs.srcpkg }}
          SRCPKG_VERSION: ${{ steps.prepare.outputs.srcpkg_version }}
        run: |
          # No -x: DEBUSINE_TOKEN is in env, keep xtrace off.
          set -euo pipefail
          debusine-action/lib/generate-apt-config || {
            echo "::error::Cannot read $DEBUSINE_WORKSPACE. Check that the workspace exists and that DEBUSINE_TOKEN may read it."
            exit 1
          }
          sudo apt-get install -y --no-install-recommends devscripts
          chdist create target-workspace
          rm -f ~/.chdist/target-workspace/etc/apt/sources.list
          install -d ~/.chdist/target-workspace/etc/apt/sources.list.d
          install -d ~/.chdist/target-workspace/etc/apt/auth.conf.d
          install -m 0644 debusine-ci.sources \
            ~/.chdist/target-workspace/etc/apt/sources.list.d/
          install -m 0600 debusine-ci-auth.conf \
            ~/.chdist/target-workspace/etc/apt/auth.conf.d/

          if ! chdist apt-get target-workspace update; then
            echo "::warning::Could not read $DEBUSINE_WORKSPACE; treating $SRCPKG $SRCPKG_VERSION as unpublished."
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if chdist apt-cache target-workspace showsrc "$SRCPKG" 2>/dev/null \
               | grep -qxF "Version: $SRCPKG_VERSION"; then
            echo "$SRCPKG $SRCPKG_VERSION is already in $DEBUSINE_WORKSPACE."
            echo "Nothing new to build; the rest of this run is skipped." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "$SRCPKG $SRCPKG_VERSION is not in $DEBUSINE_WORKSPACE yet."
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # build: generate the Debian source package and submit it to Debusine.
  #
  # Skipped, with everything after it, when prepare found this version already
  # published in the target workspace.
  # ---------------------------------------------------------------------------
  build:
    name: Build package (Debusine)
    needs: prepare
    if: ${{ needs.prepare.outputs.already_published != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read  # actions/checkout
      packages: read  # container: ghcr.io/qualcomm-linux/debusine-pkg-builder
    environment: Staging
    container:
      image: ghcr.io/qualcomm-linux/debusine-pkg-builder:trixie
      options: --user 0:0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      workspace: ${{ steps.debusine.outputs.workspace }}
      srcpkg_version: ${{ steps.debusine.outputs.srcpkg_version }}
    steps:
      # Only for the debusine-build action itself: the package being built
      # comes from the source-package artifact, not from this checkout.
      - name: Checkout pkg-linux-qcom
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build in Debusine
        id: debusine
        uses: ./.github/actions/debusine-build
        with:
          suite: ${{ inputs.suite }}
          flavour: ${{ inputs.flavour }}
          debusine-host: ${{ vars.DEBUSINE_HOST }}
          debusine-scope: ${{ vars.DEBUSINE_SCOPE }}
          debusine-user: ${{ secrets.DEBUSINE_USER }}
          debusine-token: ${{ secrets.DEBUSINE_TOKEN }}
          debusine-parent-workspace: ${{ inputs.debusine-parent-workspace || vars.DEBUSINE_PARENT_WORKSPACE || 'qli-ci' }}
          extra-build-dep-workspaces: ${{ inputs.extra-build-dep-workspaces }}

  # ---------------------------------------------------------------------------
  # publish: download the .deb files from Debusine and upload them to S3.
  # Runs on the self-hosted runner, which has direct IAM access.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to S3
    needs: build
    runs-on: [self-hosted, lecore-prd-u2404-arm64-xlrg-od-ephem]
    permissions:
      contents: read  # actions/checkout
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout debusine-action helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: qualcomm-linux/debusine-action
          ref: main
          path: debusine-action
          fetch-depth: 1
          sparse-checkout: |
            lib

      - name: Generate Debusine apt configuration
        env:
          DEBUSINE_HOST: ${{ vars.DEBUSINE_HOST }}
          DEBUSINE_SCOPE: ${{ vars.DEBUSINE_SCOPE }}
          DEBUSINE_USER: ${{ secrets.DEBUSINE_USER }}
          DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}
          DEBUSINE_WORKSPACE: ${{ needs.build.outputs.workspace }}
          SUITE: ${{ inputs.suite }}
        run: |
          debusine-action/lib/generate-apt-config

      - name: Download .deb packages from Debusine workspace
        run: |
          set -euxo pipefail
          sudo apt-get install -y --no-install-recommends devscripts
          mkdir -p "$GITHUB_WORKSPACE/deb-artifacts"
          chdist create debusine-workspace
          rm -f ~/.chdist/debusine-workspace/etc/apt/sources.list
          install -d ~/.chdist/debusine-workspace/etc/apt/sources.list.d
          install -d ~/.chdist/debusine-workspace/etc/apt/auth.conf.d
          install -m 0644 debusine-ci.sources \
            ~/.chdist/debusine-workspace/etc/apt/sources.list.d/
          install -m 0600 debusine-ci-auth.conf \
            ~/.chdist/debusine-workspace/etc/apt/auth.conf.d/
          chdist apt-get debusine-workspace update
          packages=$(chdist apt-cache debusine-workspace search . | awk '{print $1}' | tr '\n' ' ')
          [[ -n "$packages" ]] || { echo "ERROR: no packages found in Debusine workspace"; exit 1; }
          echo "Packages to download: $packages"
          cd "$GITHUB_WORKSPACE/deb-artifacts"
          # shellcheck disable=SC2086
          chdist apt-get debusine-workspace download $packages

      - name: Upload .deb packages to S3
        # Keep flavour and suite in the destination so concurrent matrix legs
        # cannot overwrite or mix package outputs. Consumers must select the
        # flavour and suite they intend to install.
        uses: qualcomm-linux/upload-private-artifact-action@4940e9327cd7386acdb908b61c714c079b7d754b # aws-v4
        with:
          s3_bucket: ${{ vars.ARTIFACT_S3_BUCKET }}
          path: deb-artifacts
          destination: ${{ github.repository_owner }}/pkg/debusine/${{ github.event.repository.name }}/${{ inputs.flavour }}/${{ inputs.suite }}/${{ github.run_id }}-${{ github.run_attempt }}/

  # ---------------------------------------------------------------------------
  # promote: copy the built package from the ephemeral CI workspace into the
  # workspace the caller named, making it installable from that archive.
  #
  # Promotion is in-run by necessity, not by preference: lib/build names the
  # CI workspace after the run that created it
  # (<parent>-gh-<repo>-<run>-<attempt>-<leg>) and it does not outlive it, so
  # the only moment its contents can be published is while the run still holds
  # it. That is why release.yml builds the ref it releases rather than
  # promoting a nightly afterwards -- by then there would be nothing left to
  # promote from.
  #
  # The if: is the whole of the decision: a caller that named no workspace
  # promotes nowhere. pr-build.yml is that caller, so a pull request's kernel
  # never reaches an archive. Which archive, and what stands in front of it,
  # is the caller's too: promote-environment carries the approval gate, so a
  # release into qli can require one where the nightly into staging does not.
  # ---------------------------------------------------------------------------
  promote:
    name: Promote to ${{ inputs.target-workspace }}
    # build alone: it already needs prepare, so a run prepare skipped as
    # already published skips the build and this job with it.
    needs: build
    if: ${{ inputs.target-workspace != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read  # actions/checkout
      packages: read  # container: ghcr.io/qualcomm-linux/debusine-pkg-builder
    environment: ${{ inputs.promote-environment }}
    container:
      image: ghcr.io/qualcomm-linux/debusine-pkg-builder:trixie
      options: --user 0:0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout debusine-action helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: qualcomm-linux/debusine-action
          ref: main
          path: debusine-action
          fetch-depth: 1
          sparse-checkout: |
            lib

      - name: Promote packages to the target workspace
        env:
          DEBUSINE_HOST: ${{ vars.DEBUSINE_HOST }}
          DEBUSINE_SCOPE: ${{ vars.DEBUSINE_SCOPE }}
          DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}
          DEBUSINE_CI_WORKSPACE: ${{ needs.build.outputs.workspace }}
          DEBUSINE_TARGET_WORKSPACE: ${{ inputs.target-workspace }}
          SRCPKG_NAME: ${{ inputs.srcpkg }}
          SRCPKG_VERSION: ${{ needs.build.outputs.srcpkg_version }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -eu
          debusine-action/lib/release

      - name: Note the promoted version
        env:
          SRCPKG_NAME: ${{ inputs.srcpkg }}
          SRCPKG_VERSION: ${{ needs.build.outputs.srcpkg_version }}
          TARGET_WORKSPACE: ${{ inputs.target-workspace }}
        run: |
          echo "Promoted $SRCPKG_NAME $SRCPKG_VERSION to $TARGET_WORKSPACE" \
            >> "$GITHUB_STEP_SUMMARY"
