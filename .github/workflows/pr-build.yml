name: PR Build

# Build-test PRs through the same pipeline the daily builds use.
#
# Packaging and CI now live on one branch, so a PR is tested entirely against
# its own commit: its ci/build-matrix.yaml defines the legs, and its debian/
# tree and ci/scripts build them. Nothing is read from main.

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: pr-build-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # configure-matrix: select the Daily entries from the PR's build-matrix.yaml.
  #
  # The PR head, not the merge commit: a push mid-run must not change what this
  # run tested. A SHA also resolves for fork PRs, whose head branch does not
  # exist in this repository.
  # ---------------------------------------------------------------------------
  configure-matrix:
    name: Configure build matrix
    runs-on: ubuntu-latest
    outputs:
      debian: ${{ steps.set-matrix.outputs.debian }}
      ubuntu: ${{ steps.set-matrix.outputs.ubuntu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Generate build matrix
        id: set-matrix
        run: |
          set -euo pipefail
          # Split by build path: the families are built by different workflows,
          # so a PR gets one job per leg it actually builds and no skipped job
          # for the path that leg does not take.
          for family in debian ubuntu; do
            MATRIX=$(ci/scripts/resolve-matrix.py --type Daily \
              --family "$family" --allow-empty)
            echo "$family=$MATRIX" >> "$GITHUB_OUTPUT"
            echo "$family entries: $(echo "$MATRIX" | jq length)"
          done

  # ---------------------------------------------------------------------------
  # build-debian / build-ubuntu: one parallel job per matrix entry, mirroring
  # daily.yml.
  #
  # A PR gets one check per build leg and nothing else: neither workflow has a
  # branch to skip, and a PR builds the whole Daily matrix, so both families
  # have entries and neither guard fires.
  #
  # fail-fast is disabled so a broken trixie leg still leaves forky and
  # resolute results on the PR.
  #
  # Neither takes DEBUSINE_RELEASE_TOKEN: a PR build never promotes, so it
  # calls the S3-publishing workflow and not release-kernel-debian.yml.
  # ---------------------------------------------------------------------------
  build-debian:
    name: ${{ matrix.name }}
    needs: configure-matrix
    if: ${{ needs.configure-matrix.outputs.debian != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.configure-matrix.outputs.debian) }}
    uses: ./.github/workflows/build-kernel-debian.yml
    with:
      suite: ${{ matrix.suite }}
      build: ${{ matrix.name }}
      flavour: ${{ matrix.flavour }}
      git-clone: ${{ matrix.git_clone }}
      kernel-branch: ${{ matrix.branch_or_tag }}
      ref-strategy: ${{ matrix.ref_strategy }}
      tag-pattern: ${{ matrix.tag_pattern || '' }}
      srcpkg: ${{ matrix.srcpkg }}
      binpkg: ${{ matrix.binpkg }}
      kernel-config: ${{ matrix.kernel_config }}
      dkms: ${{ matrix.dkms }}
      debian-revision: ${{ matrix.debian_revision }}
      localversion: ${{ matrix.localversion || '' }}
      # Mark the version so PR artifacts never collide with the daily build's
      # in the shared Debusine workspace.
      kver-extra: -pr${{ github.event.number }}
    secrets:
      DEBUSINE_USER: ${{ secrets.DEBUSINE_USER }}
      DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}

  build-ubuntu:
    name: ${{ matrix.name }}
    needs: configure-matrix
    if: ${{ needs.configure-matrix.outputs.ubuntu != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.configure-matrix.outputs.ubuntu) }}
    uses: ./.github/workflows/build-kernel-ubuntu.yml
    with:
      suite: ${{ matrix.suite }}
      build: ${{ matrix.name }}
      flavour: ${{ matrix.flavour }}
      git-clone: ${{ matrix.git_clone }}
      kernel-branch: ${{ matrix.branch_or_tag }}
      ref-strategy: ${{ matrix.ref_strategy }}
      tag-pattern: ${{ matrix.tag_pattern || '' }}
      srcpkg: ${{ matrix.srcpkg }}
      binpkg: ${{ matrix.binpkg }}
      kernel-config: ${{ matrix.kernel_config }}
      dkms: ${{ matrix.dkms }}
      debian-revision: ${{ matrix.debian_revision }}
      localversion: ${{ matrix.localversion || '' }}
      kver-extra: -pr${{ github.event.number }}
