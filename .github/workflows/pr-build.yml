name: PR Build

# Build-test PRs through the same pipeline the daily builds use.

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: pr-build-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # configure-matrix: flatten the Daily rows from the PR's build-matrix.json.
  #
  # The PR head, not the merge commit: a push mid-run must not change what this
  # run tested.
  #
  # GitHub gives a pull request from a fork none of this repository's secrets
  # or variables, so every Debusine and S3 step would fail without saying why.
  # Fail here instead, and tell the contributor to push to this repository.
  # ---------------------------------------------------------------------------
  configure-matrix:
    name: Configure build matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read  # actions/checkout
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Refuse pull requests from forks
        if: github.event.pull_request.head.repo.full_name != github.repository
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          echo "::error title=Pull request from a fork::This pull request comes from $HEAD_REPO. GitHub does not pass secrets or variables to pull requests from forks, so the Debusine and S3 builds cannot run. Push the branch to $GITHUB_REPOSITORY instead of a fork and open the pull request from there; ask a maintainer for write access if you do not have it."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Generate build matrix
        id: set-matrix
        run: |
          set -euo pipefail
          MATRIX=$(ci/scripts/resolve-matrix.sh --type Daily)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matrix entries: $(echo "$MATRIX" | jq length)"

  # ---------------------------------------------------------------------------
  # build: one parallel job per flat matrix entry, mirroring daily.yml.
  #
  # fail-fast is disabled so a broken trixie leg still leaves forky and
  # resolute results on the PR.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.kernel_variant }} / ${{ matrix.suite }}
    needs: configure-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.configure-matrix.outputs.matrix) }}
    permissions:
      contents: read  # actions/checkout in the called workflow
      packages: read  # ghcr.io images it pulls
    uses: ./.github/workflows/build-kernel-deb.yml
    with:
      suite: ${{ matrix.suite }}
      kernel-variant: ${{ matrix.kernel_variant }}
      git-clone: ${{ matrix.git_clone }}
      kernel-branch: ${{ matrix.branch_or_tag }}
      ref-strategy: ${{ matrix.ref_strategy }}
      tag-pattern: ${{ matrix.tag_pattern || '' }}
      srcpkg: ${{ matrix.srcpkg }}
      binpkg: ${{ matrix.binpkg }}
      kernel-config: ${{ matrix.kernel_config }}
      dkms: ${{ matrix.dkms }}
      debian-revision: ${{ matrix.debian_revision }}
      localversion: ${{ matrix.localversion || '' }}
      # Mark the version so PR artifacts never collide with the daily build's
      # in the shared Debusine workspace.
      kver-extra: -pr${{ github.event.number }}
    secrets:
      # No DEBUSINE_RELEASE_TOKEN: PR builds never promote to a release
      # workspace, so they leave target-workspace empty.
      DEBUSINE_USER: ${{ secrets.DEBUSINE_USER }}
      DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}
