name: daily

# Daily kernel package builds. Runs at 3:00 PM PST (23:00 UTC), one parallel
# build per Daily entry in ci/build-matrix.yaml. Manual dispatch can run the
# full Daily matrix, a named set of builds, or every suite of one flavour.
# Build names and flavours are matrix values, so new ones need no workflow edit.
#
# Matrix schema: ci/build-matrix.yaml
#   One entry is one generated package, so ci/scripts/resolve-matrix.py selects
#   the entries with type: Daily and passes them through as they stand. Every
#   field (name, suite, flavour, srcpkg, binpkg, kernel_config, dkms,
#   debian_revision, git_clone, branch_or_tag, ref_strategy) becomes a
#   build-kernel-deb.yml input. name labels the job; flavour is what reaches
#   the built kernel's version and its published paths.
#
# To add a daily build target: add an entry to ci/build-matrix.yaml with
# type: Daily. No workflow changes needed.

on:
  schedule:
    # 3:00 PM PST == 23:00 UTC
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      build-scope:
        description: 'Choose the whole matrix, named build(s), or every suite of one flavour'
        type: choice
        required: true
        default: 'Selected builds'
        options:
          - 'Full matrix'
          - 'Selected builds'
          - 'Selected flavour (all suites)'
      builds:
        description: 'Comma-separated build names, e.g. qcom-next-trixie,qcom-next-debug-forky (Selected builds)'
        required: true
        default: 'qcom-next-trixie'
        type: string
      flavour:
        description: 'Kernel flavour to build in every suite it targets (Selected flavour)'
        required: true
        default: 'qcom-next'
        type: string

permissions:
  contents: read
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # configure-matrix: select the Daily entries from ci/build-matrix.yaml.
  #
  # Delegates to ci/scripts/resolve-matrix.py, which validates the whole matrix
  # and returns the entries with type: Daily. Manual dispatch selects the
  # complete matrix, a comma-separated list of build names, or one flavour
  # across every suite it targets.
  # ---------------------------------------------------------------------------
  configure-matrix:
    name: Configure build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate build matrix
        id: set-matrix
        env:
          BUILD_SCOPE_INPUT: ${{ github.event.inputs.build-scope }}
          INPUT_BUILDS: ${{ github.event.inputs.builds }}
          INPUT_FLAVOUR: ${{ github.event.inputs.flavour }}
        run: |
          set -euo pipefail

          BUILD_SCOPE="$BUILD_SCOPE_INPUT"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            BUILD_SCOPE="Full matrix"
          fi

          case "$BUILD_SCOPE" in
            "Full matrix")
              echo "Source: ci/build-matrix.yaml (full Daily matrix)"
              args=(--type Daily)
              ;;
            "Selected variants")
              echo "Source: ci/build-matrix.yaml (builds: $INPUT_BUILDS)"
              args=(--type Daily --build "$INPUT_BUILDS")
              ;;
            "Selected flavour (all suites)")
              echo "Source: ci/build-matrix.yaml (flavour: $INPUT_FLAVOUR, all suites)"
              args=(--type Daily --flavour "$INPUT_FLAVOUR")
              ;;
            *)
              echo "ERROR: unsupported build scope: $BUILD_SCOPE" >&2
              exit 1
              ;;
          esac
          MATRIX=$(ci/scripts/resolve-matrix.py "${args[@]}")

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matrix entries: $(echo "$MATRIX" | jq length)"

  # ---------------------------------------------------------------------------
  # build: one parallel job per matrix entry.
  #
  # Each entry calls build-kernel-deb.yml as a reusable workflow. The full
  # set of matrix fields (suite, srcpkg, binpkg, kernel_config, dkms, etc.) is
  # threaded through as inputs. fail-fast is disabled so a failed trixie
  # build does not cancel the forky build.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    needs: configure-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.configure-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build-kernel-deb.yml
    with:
      suite: ${{ matrix.suite }}
      build: ${{ matrix.name }}
      flavour: ${{ matrix.flavour }}
      git-clone: ${{ matrix.git_clone }}
      kernel-branch: ${{ matrix.branch_or_tag }}
      ref-strategy: ${{ matrix.ref_strategy }}
      tag-pattern: ${{ matrix.tag_pattern || '' }}
      srcpkg: ${{ matrix.srcpkg }}
      binpkg: ${{ matrix.binpkg }}
      kernel-config: ${{ matrix.kernel_config }}
      dkms: ${{ matrix.dkms }}
      debian-revision: ${{ matrix.debian_revision }}
      localversion: ${{ matrix.localversion || '' }}
      kver-extra: ${{ matrix.kver_extra || '' }}
      debusine-parent-workspace: ${{ matrix.debusine_parent_workspace || '' }}
    secrets:
      DEBUSINE_USER: ${{ secrets.DEBUSINE_USER }}
      DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}
      DEBUSINE_RELEASE_TOKEN: ${{ secrets.DEBUSINE_RELEASE_TOKEN }}
