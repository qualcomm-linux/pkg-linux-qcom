name: daily

# Daily kernel package builds. Runs at 3:00 PM PST (23:00 UTC), one parallel
# build per Daily entry in ci/build-matrix.json after suite flattening.
# Manual dispatch can run the full Daily matrix, every suite for one kernel
# variant, or one kernel variant and suite. Variant and suite are matrix values,
# so future variants need no workflow edit.
#
# Matrix schema: ci/build-matrix.json
#   Each row with "type": "Daily" is expanded by ci/scripts/resolve-matrix.sh:
#   the "suites" array is flattened into one job per suite. All other fields
#   (kernel_variant, srcpkg, binpkg, kernel_config, dkms, debian_revision,
#   git_clone, branch_or_tag, ref_strategy) are passed through as inputs to
#   build-kernel-debian.yml or build-kernel-ubuntu.yml, by suite family.
#
# To add a daily build target: add a row to ci/build-matrix.json with
# "type": "Daily". No workflow changes needed.

on:
  schedule:
    # 3:00 PM PST == 23:00 UTC
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      build-scope:
        description: 'Choose all variants, all suites for one variant, or one variant and suite'
        type: choice
        required: true
        default: 'Selected variant and suite'
        options:
          - 'Full matrix'
          - 'Selected variant (all suites)'
          - 'Selected variant and suite'
      kernel-variant:
        description: 'Kernel variant to build (ignored for Full matrix)'
        required: true
        default: 'qcom-next'
        type: string
      suite:
        description: 'Target suite to build (used only for Selected variant and suite)'
        required: true
        default: 'trixie'
        type: string

permissions:
  contents: read
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # configure-matrix: flatten the Daily rows from ci/build-matrix.json.
  #
  # Delegates to ci/scripts/resolve-matrix.sh which filters type=Daily rows
  # and expands each row's "suites" array into one flat entry per suite.
  # Manual dispatch selects the complete matrix, every suite for a variant, or
  # one variant and suite.
  # ---------------------------------------------------------------------------
  configure-matrix:
    name: Configure build matrix
    runs-on: ubuntu-latest
    outputs:
      debian: ${{ steps.set-matrix.outputs.debian }}
      ubuntu: ${{ steps.set-matrix.outputs.ubuntu }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate build matrix
        id: set-matrix
        env:
          BUILD_SCOPE_INPUT: ${{ github.event.inputs.build-scope }}
          INPUT_VARIANT: ${{ github.event.inputs.kernel-variant }}
          INPUT_SUITE: ${{ github.event.inputs.suite }}
        run: |
          set -euo pipefail

          BUILD_SCOPE="$BUILD_SCOPE_INPUT"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            BUILD_SCOPE="Full matrix"
          fi

          case "$BUILD_SCOPE" in
            "Full matrix")
              echo "Source: ci/build-matrix.json (full Daily matrix)"
              args=(--type Daily)
              ;;
            "Selected variant (all suites)")
              echo "Source: ci/build-matrix.json (variant: $INPUT_VARIANT, all suites)"
              args=(--type Daily --kernel-variant "$INPUT_VARIANT")
              ;;
            "Selected variant and suite")
              echo "Source: ci/build-matrix.json (variant: $INPUT_VARIANT, suite: $INPUT_SUITE)"
              args=(--type Daily --kernel-variant "$INPUT_VARIANT" --single-suite "$INPUT_SUITE")
              ;;
            *)
              echo "ERROR: unsupported build scope: $BUILD_SCOPE" >&2
              exit 1
              ;;
          esac

          # One selection, split by build path. The two families are built by
          # different workflows, so each gets the entries it builds and neither
          # run starts a job for the other. A narrowed dispatch can leave one
          # side empty, which --family reports as [] rather than as a failure;
          # a selection that matches nothing still fails, in both calls.
          for family in debian ubuntu; do
            MATRIX=$(ci/scripts/resolve-matrix.sh "${args[@]}" --family "$family")
            echo "$family=$MATRIX" >> "$GITHUB_OUTPUT"
            echo "$family entries: $(echo "$MATRIX" | jq length)"
          done

  # ---------------------------------------------------------------------------
  # build-debian / build-ubuntu: one parallel job per flat matrix entry.
  #
  # Two jobs rather than one because the families are built by different
  # workflows, on different runners, and published from different places.
  # Splitting the matrix by family means each entry starts exactly the jobs
  # that build it: a run shows no skipped job for the path it did not take.
  #
  # Each entry calls its family's workflow as a reusable workflow. The full
  # set of matrix fields (suite, srcpkg, binpkg, kernel_config, dkms, etc.) is
  # threaded through as inputs. fail-fast is disabled so a failed trixie
  # build does not cancel the forky build.
  #
  # The if: guards only matter for a narrowed dispatch that selects nothing on
  # one path; an empty matrix is an error rather than an empty job list. The
  # scheduled full-matrix run has entries on both.
  # ---------------------------------------------------------------------------
  build-debian:
    name: ${{ matrix.kernel_variant }} / ${{ matrix.suite }}
    needs: configure-matrix
    if: needs.configure-matrix.outputs.debian != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.configure-matrix.outputs.debian) }}
    uses: ./.github/workflows/build-kernel-debian.yml
    with:
      suite: ${{ matrix.suite }}
      kernel-variant: ${{ matrix.kernel_variant }}
      git-clone: ${{ matrix.git_clone }}
      kernel-branch: ${{ matrix.branch_or_tag }}
      ref-strategy: ${{ matrix.ref_strategy }}
      tag-pattern: ${{ matrix.tag_pattern || '' }}
      srcpkg: ${{ matrix.srcpkg }}
      binpkg: ${{ matrix.binpkg }}
      kernel-config: ${{ matrix.kernel_config }}
      dkms: ${{ matrix.dkms }}
      debian-revision: ${{ matrix.debian_revision }}
      localversion: ${{ matrix.localversion || '' }}
      kver-extra: ${{ matrix.kver_extra || '' }}
      debusine-parent-workspace: ${{ matrix.debusine_parent_workspace || '' }}
    secrets:
      DEBUSINE_USER: ${{ secrets.DEBUSINE_USER }}
      DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}

  build-ubuntu:
    name: ${{ matrix.kernel_variant }} / ${{ matrix.suite }}
    needs: configure-matrix
    if: needs.configure-matrix.outputs.ubuntu != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.configure-matrix.outputs.ubuntu) }}
    uses: ./.github/workflows/build-kernel-ubuntu.yml
    with:
      suite: ${{ matrix.suite }}
      kernel-variant: ${{ matrix.kernel_variant }}
      git-clone: ${{ matrix.git_clone }}
      kernel-branch: ${{ matrix.branch_or_tag }}
      ref-strategy: ${{ matrix.ref_strategy }}
      tag-pattern: ${{ matrix.tag_pattern || '' }}
      srcpkg: ${{ matrix.srcpkg }}
      binpkg: ${{ matrix.binpkg }}
      kernel-config: ${{ matrix.kernel_config }}
      dkms: ${{ matrix.dkms }}
      debian-revision: ${{ matrix.debian_revision }}
      localversion: ${{ matrix.localversion || '' }}
      kver-extra: ${{ matrix.kver_extra || '' }}
