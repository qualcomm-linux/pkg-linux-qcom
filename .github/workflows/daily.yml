name: daily

# Daily kernel package builds. Runs at 3:00 PM PST (23:00 UTC), one parallel
# build per Daily entry in ci/build-matrix.yaml. Manual dispatch can run the
# full Daily matrix, a named set of builds, or every suite of one flavour.
# Build names and flavours are matrix values, so new ones need no workflow edit.
#
# Matrix schema: ci/build-matrix.yaml
#   One entry is one generated package, so ci/scripts/resolve-matrix.py selects
#   the entries with type: Daily and passes them through as they stand. Every
#   field (name, suite, flavour, srcpkg, binpkg, kernel_config, dkms,
#   debian_revision, git_clone, branch_or_tag, ref_strategy) becomes an input
#   of the build workflow for the entry's family. name labels the job; flavour
#   is what reaches the built kernel's version and its published paths.
#
# To add a daily build target: add an entry to ci/build-matrix.yaml with
# type: Daily. No workflow changes needed.

on:
  schedule:
    # 3:00 PM PST == 23:00 UTC
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      build-scope:
        description: 'Choose the whole matrix, named build(s), or every suite of one flavour'
        type: choice
        required: true
        default: 'Selected builds'
        options:
          - 'Full matrix'
          - 'Selected builds'
          - 'Selected flavour (all suites)'
      builds:
        description: 'Comma-separated build names, e.g. qcom-next-trixie,qcom-next-debug-forky (Selected builds)'
        required: true
        default: 'qcom-next-trixie'
        type: string
      flavour:
        description: 'Kernel flavour to build in every suite it targets (Selected flavour)'
        required: true
        default: 'qcom-next'
        type: string

permissions:
  contents: read
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # configure-matrix: select the Daily entries from ci/build-matrix.yaml.
  #
  # Delegates to ci/scripts/resolve-matrix.py, which validates the whole matrix
  # and returns the entries with type: Daily. Manual dispatch selects the
  # complete matrix, a comma-separated list of build names, or one flavour
  # across every suite it targets.
  # ---------------------------------------------------------------------------
  configure-matrix:
    name: Configure build matrix
    runs-on: ubuntu-latest
    outputs:
      debian: ${{ steps.set-matrix.outputs.debian }}
      ubuntu: ${{ steps.set-matrix.outputs.ubuntu }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate build matrix
        id: set-matrix
        env:
          BUILD_SCOPE_INPUT: ${{ github.event.inputs.build-scope }}
          INPUT_BUILDS: ${{ github.event.inputs.builds }}
          INPUT_FLAVOUR: ${{ github.event.inputs.flavour }}
        run: |
          set -euo pipefail

          BUILD_SCOPE="$BUILD_SCOPE_INPUT"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            BUILD_SCOPE="Full matrix"
          fi

          case "$BUILD_SCOPE" in
            "Full matrix")
              echo "Source: ci/build-matrix.yaml (full Daily matrix)"
              args=(--type Daily)
              ;;
            "Selected builds")
              echo "Source: ci/build-matrix.yaml (builds: $INPUT_BUILDS)"
              args=(--type Daily --build "$INPUT_BUILDS")
              ;;
            "Selected flavour (all suites)")
              echo "Source: ci/build-matrix.yaml (flavour: $INPUT_FLAVOUR, all suites)"
              args=(--type Daily --flavour "$INPUT_FLAVOUR")
              ;;
            *)
              echo "ERROR: unsupported build scope: $BUILD_SCOPE" >&2
              exit 1
              ;;
          esac

          # One selection, split by build path. The two families are built by
          # different workflows, so each gets the entries it builds and neither
          # run starts a job for the other. A narrowed dispatch can leave one
          # side empty, which --allow-empty reports as [] rather than as a
          # failure; a name that matches nothing still fails, in both calls.
          for family in debian ubuntu; do
            MATRIX=$(ci/scripts/resolve-matrix.py "${args[@]}" \
              --family "$family" --allow-empty)
            echo "$family=$MATRIX" >> "$GITHUB_OUTPUT"
            echo "$family entries: $(echo "$MATRIX" | jq length)"
          done

  # ---------------------------------------------------------------------------
  # build-debian / build-ubuntu: one parallel job per matrix entry.
  #
  # Two jobs rather than one because the families are built by different
  # workflows, on different runners, and published from different places.
  # Splitting the matrix by family means each entry starts exactly the jobs
  # that build it: a run shows no skipped job for the path it did not take.
  #
  # Both are named ${{ matrix.name }}, so the checks list reads the same as
  # one job would -- the split is in what each entry calls, not in what it is
  # called. fail-fast is disabled so a failed trixie build does not cancel the
  # forky build.
  #
  # The if: guards only matter for a narrowed dispatch that selects nothing on
  # one path; an empty matrix is an error rather than an empty job list. The
  # scheduled full-matrix run has entries on both.
  # ---------------------------------------------------------------------------
  build-debian:
    name: ${{ matrix.name }}
    needs: configure-matrix
    if: ${{ needs.configure-matrix.outputs.debian != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.configure-matrix.outputs.debian) }}
    uses: ./.github/workflows/build-kernel-debian.yml
    with:
      suite: ${{ matrix.suite }}
      build: ${{ matrix.name }}
      flavour: ${{ matrix.flavour }}
      git-clone: ${{ matrix.git_clone }}
      kernel-branch: ${{ matrix.branch_or_tag }}
      ref-strategy: ${{ matrix.ref_strategy }}
      tag-pattern: ${{ matrix.tag_pattern || '' }}
      srcpkg: ${{ matrix.srcpkg }}
      binpkg: ${{ matrix.binpkg }}
      kernel-config: ${{ matrix.kernel_config }}
      dkms: ${{ matrix.dkms }}
      debian-revision: ${{ matrix.debian_revision }}
      localversion: ${{ matrix.localversion || '' }}
      kver-extra: ${{ matrix.kver_extra || '' }}
      debusine-parent-workspace: ${{ matrix.debusine_parent_workspace || '' }}
    secrets:
      DEBUSINE_USER: ${{ secrets.DEBUSINE_USER }}
      DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}

  build-ubuntu:
    name: ${{ matrix.name }}
    needs: configure-matrix
    if: ${{ needs.configure-matrix.outputs.ubuntu != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.configure-matrix.outputs.ubuntu) }}
    uses: ./.github/workflows/build-kernel-ubuntu.yml
    with:
      suite: ${{ matrix.suite }}
      build: ${{ matrix.name }}
      flavour: ${{ matrix.flavour }}
      git-clone: ${{ matrix.git_clone }}
      kernel-branch: ${{ matrix.branch_or_tag }}
      ref-strategy: ${{ matrix.ref_strategy }}
      tag-pattern: ${{ matrix.tag_pattern || '' }}
      srcpkg: ${{ matrix.srcpkg }}
      binpkg: ${{ matrix.binpkg }}
      kernel-config: ${{ matrix.kernel_config }}
      dkms: ${{ matrix.dkms }}
      debian-revision: ${{ matrix.debian_revision }}
      localversion: ${{ matrix.localversion || '' }}
      kver-extra: ${{ matrix.kver_extra || '' }}
