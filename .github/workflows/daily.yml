name: daily

# Daily kernel package builds. Runs at 3:00 PM PST (23:00 UTC), one parallel
# build per Daily entry in ci/build-matrix.json after suite flattening.
# Manual dispatch builds one kernel variant, or every variant with "all", and
# every suite of it unless a suite is given. Variant and suite are matrix values,
# so future variants need no workflow edit.
#
# Matrix schema: ci/build-matrix.json
#   Each row with "type": "Daily" is expanded by ci/scripts/resolve-matrix.sh:
#   the "suites" array is flattened into one job per suite. All other fields
#   (kernel_variant, srcpkg, binpkg, kernel_config, dkms, debian_revision,
#   git_clone, branch_or_tag, ref_strategy) are passed through to
#   build-kernel-deb.yml as inputs.
#
# To add a daily build target: add a row to ci/build-matrix.json with
# "type": "Daily". No workflow changes needed.

on:
  schedule:
    # 3:00 PM PST == 23:00 UTC
    - cron: '0 23 * * *'
  workflow_dispatch:
    # No scope choice: GitHub cannot hide one input depending on another, so
    # a scope dropdown always showed fields that some scopes ignored. "all"
    # and a blank suite express the scope instead.
    inputs:
      kernel-variant:
        description: 'Kernel variant to build, or "all" for every variant'
        required: true
        default: 'all'
        type: string
      suite:
        description: 'Suite to build (leave blank for all suites of the variant)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # configure-matrix: flatten the Daily rows from ci/build-matrix.json.
  #
  # Delegates to ci/scripts/resolve-matrix.sh which filters type=Daily rows
  # and expands each row's "suites" array into one flat entry per suite.
  # Manual dispatch selects a variant (or "all") and optionally one suite.
  # ---------------------------------------------------------------------------
  configure-matrix:
    name: Configure build matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read  # actions/checkout
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate build matrix
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VARIANT: ${{ github.event.inputs.kernel-variant }}
          INPUT_SUITE: ${{ github.event.inputs.suite }}
        run: |
          set -euo pipefail

          # A scheduled run has no inputs and builds the full matrix.
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            INPUT_VARIANT=all
            INPUT_SUITE=
          fi

          # "all" leaves the variant unfiltered. It is spelled out rather
          # than taken from a blank field so that building everything is
          # never the result of an input left empty by mistake.
          args=(--type Daily)
          if [[ "$INPUT_VARIANT" != "all" ]]; then
            args+=(--kernel-variant "$INPUT_VARIANT")
          fi
          if [[ -n "$INPUT_SUITE" ]]; then
            args+=(--single-suite "$INPUT_SUITE")
          fi
          echo "Source: ci/build-matrix.json (variant: $INPUT_VARIANT, suite: ${INPUT_SUITE:-all})"
          MATRIX=$(ci/scripts/resolve-matrix.sh "${args[@]}")

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matrix entries: $(echo "$MATRIX" | jq length)"

  # ---------------------------------------------------------------------------
  # build: one parallel job per flat matrix entry.
  #
  # Each entry calls build-kernel-deb.yml as a reusable workflow. The full
  # set of matrix fields (suite, srcpkg, binpkg, kernel_config, dkms, etc.) is
  # threaded through as inputs. fail-fast is disabled so a failed trixie
  # build does not cancel the forky build.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.kernel_variant }} / ${{ matrix.suite }}
    needs: configure-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.configure-matrix.outputs.matrix) }}
    permissions:
      contents: read  # actions/checkout in the called workflow
      packages: read  # ghcr.io images it pulls
    uses: ./.github/workflows/build-kernel-deb.yml
    with:
      suite: ${{ matrix.suite }}
      kernel-variant: ${{ matrix.kernel_variant }}
      git-clone: ${{ matrix.git_clone }}
      kernel-branch: ${{ matrix.branch_or_tag }}
      ref-strategy: ${{ matrix.ref_strategy }}
      tag-pattern: ${{ matrix.tag_pattern || '' }}
      srcpkg: ${{ matrix.srcpkg }}
      binpkg: ${{ matrix.binpkg }}
      kernel-config: ${{ matrix.kernel_config }}
      dkms: ${{ matrix.dkms }}
      debian-revision: ${{ matrix.debian_revision }}
      localversion: ${{ matrix.localversion || '' }}
      kver-extra: ${{ matrix.kver_extra || '' }}
      debusine-parent-workspace: ${{ matrix.debusine_parent_workspace || '' }}
    secrets:
      DEBUSINE_USER: ${{ secrets.DEBUSINE_USER }}
      DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}
      DEBUSINE_RELEASE_TOKEN: ${{ secrets.DEBUSINE_RELEASE_TOKEN }}
