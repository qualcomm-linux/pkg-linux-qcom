name: release

# Promote already-built kernel packages into the release workspace.
#
# This workflow builds nothing. Every package it can release was built, tested
# and promoted into the staging workspace by daily.yml. A release copies one of
# those versions onward into the release workspace, so what ships is the
# artifact that was tested rather than a second build of the same ref.
#
# That is why there is no release ref anywhere in ci/build-matrix.yaml, and why
# releasing needs no change to it: a release names a version that already
# exists, and the matrix describes what is built rather than what has been
# blessed.
#
# A dispatch says which builds to release and which version of them. Every
# selected entry promotes <upstream-version>-<its debian_revision>: the
# upstream half is the kernel and the date it was cut, identical across the
# suites built from one ref, and the revision half is the entry's own. Check
# the version against the source workspace listing before dispatching -- a
# version that is not there fails the promotion rather than releasing
# something else.
#
# Triggered manually only, and never on a schedule: a release is a decision.

on:
  workflow_dispatch:
    inputs:
      builds:
        description: 'Builds to release: all, or comma-separated build names from ci/build-matrix.yaml (e.g. qcom-next-trixie,qcom-next-forky)'
        required: true
        default: 'all'
        type: string
      upstream-version:
        description: 'Version to release, without the Debian revision (e.g. 7.2.0~rc7+20260821)'
        required: true
        type: string
      from-workspace:
        description: 'Debusine workspace to release out of, where the nightly build put the packages'
        required: true
        default: 'qli-staging'
        type: string
      to-workspace:
        description: 'Debusine workspace to release into'
        required: true
        default: 'qli'
        type: string

permissions:
  contents: read
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # configure-matrix: select the entries that can be released.
  #
  # The Debian entries, because promotion runs through Debusine and only they
  # are built there. Naming an Ubuntu build fails the run with the entries that
  # can be released, rather than promoting nothing and reporting success.
  # ---------------------------------------------------------------------------
  configure-matrix:
    name: Configure release matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read  # actions/checkout
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate release matrix
        id: set-matrix
        env:
          INPUT_BUILDS: ${{ inputs.builds }}
        run: |
          set -euo pipefail

          BUILDS="${INPUT_BUILDS:-all}"

          # --family debian and no --allow-empty: a selection that resolves
          # to nothing releasable fails here with the names that do, rather
          # than starting a run with an empty matrix.
          args=(--family debian)
          if [[ "$BUILDS" == "all" ]]; then
            echo "Source: ci/build-matrix.yaml (every Debian entry)"
          else
            echo "Source: ci/build-matrix.yaml (builds: $BUILDS)"
            # A name matching no entry fails here, so a typo stops the run
            # rather than quietly releasing a smaller set than intended.
            args+=(--build "$BUILDS")
          fi

          MATRIX=$(ci/scripts/resolve-matrix.py "${args[@]}") || {
            echo "::error::Releasable builds: $(ci/scripts/resolve-matrix.py --family debian | jq -r 'map(.name) | join(", ")')"
            exit 1
          }

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matrix entries: $(echo "$MATRIX" | jq length)"

  # ---------------------------------------------------------------------------
  # promote: one parallel job per entry, copying its version from the staging
  # workspace the nightly build put it in into the release workspace.
  #
  # Nothing is built, so there is no prepare job and no self-hosted runner:
  # lib/release asks Debusine to publish an artifact it already holds. Both
  # workspaces are Debusine workspaces, so this is the same operation the
  # nightly build performs, one step further along.
  # ---------------------------------------------------------------------------
  promote:
    name: ${{ matrix.name }}
    needs: configure-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.configure-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read  # actions/checkout
      packages: read  # container: ghcr.io/qualcomm-linux/debusine-pkg-builder
    # Production carries the release credential and the approval gate: a
    # promotion into the release workspace is the one step here that a person
    # has to agree to.
    environment: Production
    container:
      image: ghcr.io/qualcomm-linux/debusine-pkg-builder:trixie
      options: --user 0:0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout debusine-action helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: qualcomm-linux/debusine-action
          ref: main
          path: debusine-action
          fetch-depth: 1
          sparse-checkout: |
            lib

      - name: Promote to the release workspace
        env:
          DEBUSINE_HOST: ${{ vars.DEBUSINE_HOST }}
          DEBUSINE_SCOPE: ${{ vars.DEBUSINE_SCOPE }}
          DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_RELEASE_TOKEN }}
          # Named by the dispatch, not by the entry: the staging workspace is
          # where the nightly build puts every Debian entry, so it is a
          # property of the pipeline rather than of the kernel being released.
          DEBUSINE_CI_WORKSPACE: ${{ inputs.from-workspace }}
          DEBUSINE_TARGET_WORKSPACE: ${{ inputs.to-workspace }}
          SRCPKG_NAME: ${{ matrix.srcpkg }}
          UPSTREAM_VERSION: ${{ inputs.upstream-version }}
          DEBIAN_REVISION: ${{ matrix.debian_revision }}
          SUITE: ${{ matrix.suite }}
        run: |
          set -eu
          # The revision is the entry's, not the dispatcher's: a suite's
          # packages are versioned to sort against the other suites, so the
          # full version differs per entry even though the kernel does not.
          export SRCPKG_VERSION="${UPSTREAM_VERSION}-${DEBIAN_REVISION}"
          echo "Releasing $SRCPKG_NAME $SRCPKG_VERSION" \
               "from $DEBUSINE_CI_WORKSPACE to $DEBUSINE_TARGET_WORKSPACE"
          debusine-action/lib/release
          echo "Released $SRCPKG_NAME $SRCPKG_VERSION to $DEBUSINE_TARGET_WORKSPACE" \
            >> "$GITHUB_STEP_SUMMARY"
