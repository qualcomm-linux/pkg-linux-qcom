name: release

# Release kernel package builds.
#
# Reads Release rows from ci/build-matrix.json, flattens suites, and builds
# each entry using the matrix-selected ref strategy and branch_or_tag. After a
# successful build, packages are promoted from the ephemeral Debusine CI
# workspace to the stable target workspace (e.g. qli) via debusine-action
# lib/release.
#
# To update a release ref: open a PR that changes the Release row for that
# kernel variant in ci/build-matrix.json. release-dry-run.yml builds the
# changed rows on the PR, and merging it starts this workflow for exactly the
# variants whose branch_or_tag changed, every suite of each. Nothing else in
# the matrix starts a release. Every run still waits for approval in the
# Production environment before building and again before promoting.
#
# Manual dispatch remains for releasing without a ref change and for retries.
# There is intentionally no schedule trigger.

on:
  push:
    branches: [ main ]
    paths:
      - ci/build-matrix.json
  workflow_dispatch:
    inputs:
      release-scope:
        description: 'Choose all suites for one variant or one variant and suite'
        type: choice
        required: true
        default: 'Selected variant (all suites)'
        options:
          - 'Selected variant (all suites)'
          - 'Selected variant and suite'
      kernel-variant:
        description: 'Kernel variant to release'
        required: true
        default: 'qcom-next'
        type: string
      suite:
        description: 'Target suite to release (used only for Selected variant and suite)'
        required: true
        default: 'trixie'
        type: string

# No concurrency group, deliberately. GitHub keeps at most one queued run per
# group and cancels the older queued one, so a group would let a later push,
# even one that releases nothing, silently cancel a queued run that does.
# Overlapping releases are resolved at the Production approval instead.

permissions:
  contents: read
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # configure-matrix: flatten the Release rows from ci/build-matrix.json.
  # ---------------------------------------------------------------------------
  configure-matrix:
    name: Configure release matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # A push compares the matrix against the commit main pointed at
          # before it, which a depth-1 clone does not contain.
          fetch-depth: 0

      - name: Generate release matrix
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          RELEASE_SCOPE_INPUT: ${{ github.event.inputs.release-scope }}
          INPUT_VARIANT: ${{ github.event.inputs.kernel-variant }}
          INPUT_SUITE: ${{ github.event.inputs.suite }}
        run: |
          set -euo pipefail

          # A push releases every suite of each variant whose Release
          # branch_or_tag changed in it, and nothing when none did. Comparing
          # against "before" rather than the parent commit covers pushes that
          # land several commits at once.
          if [[ "$EVENT_NAME" == "push" ]]; then
            VARIANTS=$(ci/scripts/changed-release-variants.sh \
              --base "$BEFORE_SHA" --head "$GITHUB_SHA")

            MATRIX='[]'
            while IFS= read -r variant; do
              LEGS=$(ci/scripts/resolve-matrix.sh --type Release --kernel-variant "$variant")
              MATRIX=$(jq -c --argjson legs "$LEGS" '. + $legs' <<< "$MATRIX")
            done < <(jq -r '.[]' <<< "$VARIANTS")

            if [[ "$MATRIX" == '[]' ]]; then
              echo "No Release branch_or_tag changed in $BEFORE_SHA..$GITHUB_SHA; nothing to release."
            fi
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            echo "Matrix entries: $(echo "$MATRIX" | jq length)"
            exit 0
          fi

          RELEASE_SCOPE="$RELEASE_SCOPE_INPUT"

          case "$RELEASE_SCOPE" in
            "Selected variant (all suites)")
              echo "Source: ci/build-matrix.json (variant: $INPUT_VARIANT, all suites)"
              args=(--type Release --kernel-variant "$INPUT_VARIANT")
              ;;
            "Selected variant and suite")
              echo "Source: ci/build-matrix.json (variant: $INPUT_VARIANT, suite: $INPUT_SUITE)"
              args=(--type Release --kernel-variant "$INPUT_VARIANT" --single-suite "$INPUT_SUITE")
              ;;
            *)
              echo "ERROR: unsupported release scope: $RELEASE_SCOPE" >&2
              exit 1
              ;;
          esac
          MATRIX=$(ci/scripts/resolve-matrix.sh "${args[@]}")

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matrix entries: $(echo "$MATRIX" | jq length)"

  # ---------------------------------------------------------------------------
  # build: one parallel job per flat Release matrix entry.
  #
  # Uses the ref strategy and branch_or_tag selected by the matrix.
  # Passes target_workspace so build-kernel-debusine.yml triggers the Debusine
  # release path (lib/release) instead of the S3 publish path.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.kernel_variant }} / ${{ matrix.suite }}
    needs: configure-matrix
    # An empty include list is a workflow error, and a push that touched the
    # matrix without changing a Release ref resolves to one.
    if: needs.configure-matrix.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.configure-matrix.outputs.matrix) }}
    uses: $/.github/workflows/build-kernel-deb.yml
    with:
      suite: ${{ matrix.suite }}
      kernel-variant: ${{ matrix.kernel_variant }}
      git-clone: ${{ matrix.git_clone }}
      kernel-branch: ${{ matrix.branch_or_tag }}
      ref-strategy: ${{ matrix.ref_strategy }}
      tag-pattern: ${{ matrix.tag_pattern || '' }}
      srcpkg: ${{ matrix.srcpkg }}
      binpkg: ${{ matrix.binpkg }}
      kernel-config: ${{ matrix.kernel_config }}
      dkms: ${{ matrix.dkms }}
      debian-revision: ${{ matrix.debian_revision }}
      localversion: ${{ matrix.localversion || '' }}
      kver-extra: ${{ matrix.kver_extra || '' }}
      debusine-parent-workspace: ${{ matrix.debusine_parent_workspace || '' }}
      target-workspace: ${{ matrix.target_workspace }}
    secrets:
      DEBUSINE_USER: ${{ secrets.DEBUSINE_USER }}
      DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}
      DEBUSINE_RELEASE_TOKEN: ${{ secrets.DEBUSINE_RELEASE_TOKEN }}
