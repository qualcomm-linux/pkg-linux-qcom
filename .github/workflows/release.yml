name: release

# Release kernel package builds. Triggered manually only.
#
# Reads the Release entries from ci/build-matrix.yaml and builds each one using
# the matrix-selected ref strategy and branch_or_tag. After a successful build,
# packages are promoted from the ephemeral Debusine CI workspace to the stable
# target workspace (e.g. qli) via debusine-action lib/release.
#
# A dispatch says only which entries to release: "all", or a comma-separated
# list of build names. Everything else about a release comes from the entry,
# so there is nothing here to type that the matrix has not already reviewed.
#
# To update a release ref: open a PR that changes branch_or_tag on every
# Release entry for that flavour in ci/build-matrix.yaml. A flavour's Release
# entries must agree on the ref, so resolve-matrix.py rejects the matrix if
# only some of them are updated.
#
# This workflow intentionally has no schedule trigger. Releases are always
# initiated manually after validation.

on:
  workflow_dispatch:
    inputs:
      builds:
        description: 'Builds to release: all, or comma-separated Release build names from ci/build-matrix.yaml (e.g. qcom-next-trixie,qcom-next-forky)'
        required: true
        default: 'all'
        type: string

permissions:
  contents: read
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # configure-matrix: select the Release entries from ci/build-matrix.yaml.
  # ---------------------------------------------------------------------------
  configure-matrix:
    name: Configure release matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read  # actions/checkout
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate release matrix
        id: set-matrix
        env:
          INPUT_BUILDS: ${{ inputs.builds }}
        run: |
          set -euo pipefail

          BUILDS="${INPUT_BUILDS:-all}"

          args=(--type Release)
          if [[ "$BUILDS" == "all" ]]; then
            echo "Source: ci/build-matrix.yaml (every Release entry)"
          else
            echo "Source: ci/build-matrix.yaml (builds: $BUILDS)"
            # A name matching no Release entry fails here, so a typo stops the
            # run rather than quietly releasing a smaller set than intended.
            args+=(--build "$BUILDS")
          fi
          MATRIX=$(ci/scripts/resolve-matrix.py "${args[@]}")

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matrix entries: $(echo "$MATRIX" | jq length)"

  # ---------------------------------------------------------------------------
  # build: one parallel job per Release matrix entry.
  #
  # Uses the ref strategy and branch_or_tag selected by the matrix.
  # release-kernel-debian.yml builds exactly as the daily workflow does and
  # then promotes to target_workspace, rather than publishing to the daily S3
  # path. Choosing the workflow here is what makes that the whole of the run:
  # no job in it exists to publish the other way and be skipped.
  #
  # There is no Ubuntu counterpart. Promotion runs through Debusine, which
  # builds only the Debian family, so resolve-matrix.py rejects a Release entry
  # for any other suite and this matrix is Debian by construction.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    needs: configure-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.configure-matrix.outputs.matrix) }}
    permissions:
      contents: read  # actions/checkout in the called workflow
      packages: read  # ghcr.io images it pulls
    uses: ./.github/workflows/release-kernel-debian.yml
    with:
      suite: ${{ matrix.suite }}
      build: ${{ matrix.name }}
      flavour: ${{ matrix.flavour }}
      git-clone: ${{ matrix.git_clone }}
      kernel-branch: ${{ matrix.branch_or_tag }}
      ref-strategy: ${{ matrix.ref_strategy }}
      tag-pattern: ${{ matrix.tag_pattern || '' }}
      srcpkg: ${{ matrix.srcpkg }}
      binpkg: ${{ matrix.binpkg }}
      kernel-config: ${{ matrix.kernel_config }}
      dkms: ${{ matrix.dkms }}
      debian-revision: ${{ matrix.debian_revision }}
      localversion: ${{ matrix.localversion || '' }}
      kver-extra: ${{ matrix.kver_extra || '' }}
      debusine-parent-workspace: ${{ matrix.debusine_parent_workspace || '' }}
      target-workspace: ${{ matrix.target_workspace }}
    secrets:
      DEBUSINE_USER: ${{ secrets.DEBUSINE_USER }}
      DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}
      DEBUSINE_RELEASE_TOKEN: ${{ secrets.DEBUSINE_RELEASE_TOKEN }}
