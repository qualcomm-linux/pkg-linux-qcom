name: release

# Release kernel package builds. Triggered manually only.
#
# Reads the Release entries from ci/build-matrix.yaml and builds each one using
# the matrix-selected ref strategy and branch_or_tag. After a successful build,
# packages are promoted from the ephemeral Debusine CI workspace to the stable
# target workspace (e.g. qli) via debusine-action lib/release.
#
# To update a release ref: open a PR that changes branch_or_tag on every
# Release entry for that flavour in ci/build-matrix.yaml. A flavour's Release
# entries must agree on the ref, so resolve-matrix.py rejects the matrix if
# only some of them are updated.
#
# This workflow intentionally has no schedule trigger. Releases are always
# initiated manually after validation.

on:
  workflow_dispatch:
    inputs:
      release-scope:
        description: 'Choose every suite of one flavour, or named build(s)'
        type: choice
        required: true
        default: 'Selected flavour (all suites)'
        options:
          - 'Selected flavour (all suites)'
          - 'Selected variants'
      flavour:
        description: 'Kernel flavour to release in every suite it targets (Selected flavour)'
        required: true
        default: 'qcom-next'
        type: string
      kernel-variants:
        description: 'Comma-separated variants to release, e.g. qcom-next-trixie,qcom-next-forky (Selected variants)'
        required: true
        default: 'qcom-next-trixie'
        type: string

permissions:
  contents: read
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # configure-matrix: select the Release entries from ci/build-matrix.yaml.
  # ---------------------------------------------------------------------------
  configure-matrix:
    name: Configure release matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Generate release matrix
        id: set-matrix
        env:
          RELEASE_SCOPE_INPUT: ${{ github.event.inputs.release-scope }}
          INPUT_FLAVOUR: ${{ github.event.inputs.flavour }}
          INPUT_VARIANTS: ${{ github.event.inputs.kernel-variants }}
        run: |
          set -euo pipefail

          RELEASE_SCOPE="$RELEASE_SCOPE_INPUT"

          case "$RELEASE_SCOPE" in
            "Selected flavour (all suites)")
              echo "Source: ci/build-matrix.yaml (flavour: $INPUT_FLAVOUR, all suites)"
              args=(--type Release --flavour "$INPUT_FLAVOUR")
              ;;
            "Selected variants")
              echo "Source: ci/build-matrix.yaml (variants: $INPUT_VARIANTS)"
              args=(--type Release --kernel-variant "$INPUT_VARIANTS")
              ;;
            *)
              echo "ERROR: unsupported release scope: $RELEASE_SCOPE" >&2
              exit 1
              ;;
          esac
          MATRIX=$(ci/scripts/resolve-matrix.py "${args[@]}")

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matrix entries: $(echo "$MATRIX" | jq length)"

  # ---------------------------------------------------------------------------
  # build: one parallel job per Release matrix entry.
  #
  # Uses the ref strategy and branch_or_tag selected by the matrix.
  # Passes target_workspace so build-kernel-debusine.yml triggers the Debusine
  # release path (lib/release) instead of the S3 publish path.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.kernel_variant }}
    needs: configure-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.configure-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build-kernel-deb.yml
    with:
      suite: ${{ matrix.suite }}
      kernel-variant: ${{ matrix.kernel_variant }}
      flavour: ${{ matrix.flavour }}
      git-clone: ${{ matrix.git_clone }}
      kernel-branch: ${{ matrix.branch_or_tag }}
      ref-strategy: ${{ matrix.ref_strategy }}
      tag-pattern: ${{ matrix.tag_pattern || '' }}
      srcpkg: ${{ matrix.srcpkg }}
      binpkg: ${{ matrix.binpkg }}
      kernel-config: ${{ matrix.kernel_config }}
      dkms: ${{ matrix.dkms }}
      debian-revision: ${{ matrix.debian_revision }}
      localversion: ${{ matrix.localversion || '' }}
      kver-extra: ${{ matrix.kver_extra || '' }}
      debusine-parent-workspace: ${{ matrix.debusine_parent_workspace || '' }}
      target-workspace: ${{ matrix.target_workspace }}
    secrets:
      DEBUSINE_USER: ${{ secrets.DEBUSINE_USER }}
      DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}
      DEBUSINE_RELEASE_TOKEN: ${{ secrets.DEBUSINE_RELEASE_TOKEN }}
