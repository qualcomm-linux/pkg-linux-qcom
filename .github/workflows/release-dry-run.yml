name: Release Dry Run

# Build the Release rows a pull request changes, the way release.yml will
# build them once it merges, and promote nothing.
#
# pr-build.yml only builds Daily rows, which resolve the newest tag, so it
# never builds the ref a Release row pins. When a PR changes a Release row's
# version (its branch_or_tag, debian_version_stub or a suite's suffix), this
# builds the suites whose version changed as the row now describes them, so a
# green PR shows the release will build before merging starts it.
#
# The legs are chosen by ci/scripts/changed-release-variants.sh, the same
# script release.yml uses on push, so this dry-runs exactly what the merge
# releases. A PR that changes no Release version builds nothing.
#
# What merging will release is also posted as a comment on the PR on each
# run, together with a warning for any Release row the PR changes without
# changing its version, which merging cannot release.
#
# This is its own workflow rather than more legs in pr-build.yml because a
# run's artifacts share one namespace: a Release leg and a Daily leg for the
# same variant and suite would both upload source-package-<variant>-<suite>.
#
# No path filter: a PR that doesn't touch the matrix still gets a (fast,
# empty) result, so this can be made a required check without blocking those
# PRs forever.

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: release-dry-run-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # configure-matrix: the Release rows whose version this PR changes.
  #
  # Compared from the merge base, not the base branch tip, so a ref that moved
  # on main after this PR branched isn't mistaken for a change made here. The
  # PR head rather than the merge commit, as in pr-build.yml: a push mid-run
  # must not change what this run tested.
  #
  # Pull requests from forks are refused up front, as in pr-build.yml: they get
  # none of the secrets or variables the build needs.
  # ---------------------------------------------------------------------------
  configure-matrix:
    name: Configure release dry-run matrix
    runs-on: ubuntu-26.04
    permissions:
      contents: read  # actions/checkout
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      report: ${{ steps.set-matrix.outputs.report }}
    steps:
      - name: Refuse pull requests from forks
        if: github.event.pull_request.head.repo.full_name != github.repository
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          echo "::error title=Pull request from a fork::This pull request comes from $HEAD_REPO. GitHub does not pass secrets or variables to pull requests from forks, so the Debusine and S3 builds cannot run. Push the branch to $GITHUB_REPOSITORY instead of a fork and open the pull request from there; ask a maintainer for write access if you do not have it."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          # The merge base with main has to be in the clone.
          fetch-depth: 0

      - name: Generate release dry-run matrix
        id: set-matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          LEGS=$(ci/scripts/changed-release-variants.sh \
            --base "$MERGE_BASE" --head "$HEAD_SHA")

          # A Release row that changed without a version change can't be
          # released, as it would collide with the version already out. Say so,
          # rather than let it look like it shipped. The names come from the
          # matrix, so keep them to characters that can't break the annotation.
          UNRELEASED=$(ci/scripts/changed-release-variants.sh \
            --base "$MERGE_BASE" --head "$HEAD_SHA" --unreleased)
          jq -r 'def safe: gsub("[^A-Za-z0-9_.+-]"; "?");
            to_entries[]
            | "::warning title=Release row changed without a version bump::\(.key | safe): \(.value | map(safe) | join(", ")) changed, but the Release version did not, so merging this releases nothing for it. Bump debian_version_stub on the Release row to release it."
          ' <<< "$UNRELEASED"

          MATRIX='[]'
          while IFS=$'\t' read -r variant suite; do
            LEG=$(ci/scripts/resolve-matrix.sh --type Release \
              --kernel-variant "$variant" --single-suite "$suite")
            MATRIX=$(jq -c --argjson leg "$LEG" '. + $leg' <<< "$MATRIX")
          done < <(jq -r '.[] | [.kernel_variant, .suite] | @tsv' <<< "$LEGS")

          if [[ "$MATRIX" == '[]' ]]; then
            echo "This PR changes no Release version; nothing to dry-run."
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matrix entries: $(echo "$MATRIX" | jq length)"

          # The report the report job posts on the PR, and the job summary.
          # Matrix values come from the PR, so they are quoted as code with
          # anything that could end the quote or the table cell replaced.
          REPORT=$(
            echo "### Release dry run"
            echo
            if [[ "$MATRIX" == '[]' ]]; then
              echo "Merging this PR releases nothing."
            else
              echo "Merging this PR releases:"
              echo
              jq -r 'def cell: "`" + (tostring | gsub("[`|\n]"; "?")) + "`";
                "| Variant | Suite | Ref | Debian revision |",
                "| --- | --- | --- | --- |",
                (.[] | "| \(.kernel_variant | cell) | \(.suite | cell) | \(.branch_or_tag | cell) | \(.debian_revision | cell) |")
              ' <<< "$MATRIX"
            fi
            if [[ "$UNRELEASED" != '{}' ]]; then
              echo
              echo "> [!WARNING]"
              echo "> These Release rows change, but their version does not, so merging this releases nothing for them. Bump \`debian_version_stub\` on the Release row to release them."
              echo ">"
              jq -r 'def code: "`" + (tostring | gsub("[`\n]"; "?")) + "`";
                to_entries[] | "> - \(.key | code): \(.value | map(code) | join(", "))"
              ' <<< "$UNRELEASED"
            fi
            echo
            echo "<sub>Compared with the merge base ${MERGE_BASE:0:12} at ${HEAD_SHA:0:12}.</sub>"
          )
          echo "$REPORT" >> "$GITHUB_STEP_SUMMARY"

          DELIMITER="EOF_$(openssl rand -hex 16)"
          {
            echo "report<<$DELIMITER"
            echo "$REPORT"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # report: post what merging this PR will release as a comment on it, on
  # every run, including "releases nothing", so the PR always says what its
  # merge does.
  #
  # Its own job so the pull-requests write permission is not given to the job
  # that runs code from the PR. Pull requests from forks never get here, as
  # configure-matrix refuses them.
  # ---------------------------------------------------------------------------
  report:
    name: Report what merging releases
    needs: configure-matrix
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: write  # comment on the PR
    steps:
      # The report comes from the PR's matrix, so it reaches the file
      # through the environment and is never expanded into the script.
      - name: Prepare PR comment
        env:
          REPORT: ${{ needs.configure-matrix.outputs.report }}
        run: |
          set -euo pipefail
          printf '%s\n' "$REPORT" > pr-comment.txt
          cat pr-comment.txt

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          path: pr-comment.txt
          # post a fresh comment on every run (GitHub only notifies on
          # comment creation) and minimize the previous one as outdated
          # instead of deleting it, keeping the history collapsed
          header: release-dry-run
          hide_and_recreate: true
          hide_classify: OUTDATED

  # ---------------------------------------------------------------------------
  # build: one parallel job per changed Release leg, built as release.yml would
  # except that nothing is promoted.
  #
  # target-workspace is left empty, which keeps the build in the Staging
  # environment and off the release path, and DEBUSINE_RELEASE_TOKEN is not
  # passed at all. kver-extra marks the version as in pr-build.yml, so these
  # packages can never be taken for the release itself.
  # ---------------------------------------------------------------------------
  build:
    name: dry-run ${{ matrix.kernel_variant }} / ${{ matrix.suite }}
    needs: configure-matrix
    if: needs.configure-matrix.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.configure-matrix.outputs.matrix) }}
    permissions:
      contents: read  # actions/checkout in the called workflow
      packages: read  # ghcr.io images it pulls
    uses: $/.github/workflows/build-kernel-deb.yml
    with:
      suite: ${{ matrix.suite }}
      kernel-variant: ${{ matrix.kernel_variant }}
      git-clone: ${{ matrix.git_clone }}
      kernel-branch: ${{ matrix.branch_or_tag }}
      ref-strategy: ${{ matrix.ref_strategy }}
      tag-pattern: ${{ matrix.tag_pattern || '' }}
      srcpkg: ${{ matrix.srcpkg }}
      binpkg: ${{ matrix.binpkg }}
      kernel-config: ${{ matrix.kernel_config }}
      dkms: ${{ matrix.dkms }}
      debian-revision: ${{ matrix.debian_revision }}
      localversion: ${{ matrix.localversion || '' }}
      kver-extra: -pr${{ github.event.number }}
      debusine-parent-workspace: ${{ matrix.debusine_parent_workspace || '' }}
    secrets:
      DEBUSINE_USER: ${{ secrets.DEBUSINE_USER }}
      DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}
