name: build-kernel-deb

on:
  workflow_dispatch:
    inputs:
      kernel-variant:
        description: 'Kernel variant identifier'
        required: true
        default: 'qcom-next'
        type: string
      suite:
        description: 'Target suite'
        required: true
        default: 'trixie'
        type: string
      ref-strategy:
        description: 'Kernel ref strategy'
        required: true
        default: 'latest_tag'
        type: choice
        options:
          - latest_tag
          - branch_tip
          - pinned_ref
      kernel-branch:
        description: 'Branch for branch_tip or immutable ref for pinned_ref (ignored for latest_tag)'
        required: false
        default: 'qcom-next'
      tag-pattern:
        description: 'Tag glob used only by latest_tag (ignored for branch_tip and pinned_ref)'
        required: false
        default: 'qcom-next-*'
      kernel-url:
        description: 'Advanced: custom kernel repository URL (empty uses qualcomm-linux/kernel)'
        required: false
        default: ''
      srcpkg:
        description: 'Advanced: Debian source package name'
        required: false
        default: 'linux-qcom-next'
      binpkg:
        description: 'Advanced: kernel image metapackage name'
        required: false
        default: 'linux-image-qcom-next'
      kernel-config:
        description: 'Advanced: extra config fragments applied on top of all of debian/config-available/ (e.g. intree:arch/arm64/configs/qcom_debug.config)'
        required: false
        default: ''
      dkms:
        description: 'Advanced: out-of-tree DKMS modules to build and bundle into the kernel image, comma-separated and without the -dkms suffix (e.g. kgsl,camx); empty bundles nothing'
        required: false
        default: ''
      debian-version-stub:
        description: 'Advanced: Debian version stub; the selected suite''s mapped suffix and a Daily-style trailing ~ are applied automatically'
        required: false
        default: '0qli1'
      localversion:
        description: 'Advanced: LOCALVERSION override (auto-derived from the resolved ref if empty)'
        required: false
        default: ''
      kver-extra:
        description: 'Advanced: extra KVER suffix (e.g. -ci42), appended to the kernel release verbatim'
        required: false
        default: ''
      debug-build:
        description: 'Advanced: enable the debug build configuration'
        type: boolean
        required: false
        default: false
      qcom-next-pr:
        description: 'Advanced Qualcomm-only override: qcom-next PR numbers to merge (e.g. "42 43")'
        type: string
        required: false
        default: ''
      kernel-topics-pr:
        description: 'Advanced Qualcomm-only override: kernel-topics PR numbers to apply as patches'
        type: string
        required: false
        default: ''

  # Called by daily.yml and release.yml as a reusable workflow.
  workflow_call:
    inputs:
      kernel-variant:
        description: 'Kernel variant identifier'
        type: string
        default: 'qcom-next'
      suite:
        description: 'Target suite (trixie, forky, noble, questing, resolute, sid)'
        type: string
        default: 'trixie'
      kernel-branch:
        description: 'Source branch or pinned tag used by branch_tip or pinned_ref'
        type: string
        default: 'qcom-next'
      git-clone:
        description: 'Kernel repository URL'
        type: string
        default: 'https://github.com/qualcomm-linux/kernel'
      ref-strategy:
        description: 'Kernel ref strategy: latest_tag, branch_tip, or pinned_ref'
        type: string
        default: 'latest_tag'
      tag-pattern:
        description: 'Tag glob used when ref-strategy=latest_tag'
        type: string
        default: 'qcom-next-*'
      srcpkg:
        description: 'Source package name'
        type: string
        default: 'linux-qcom-next'
      binpkg:
        description: 'Binary metapackage name'
        type: string
        default: 'linux-image-qcom-next'
      kernel-config:
        description: 'Extra config fragments applied on top of all of debian/config-available/ (e.g. intree:arch/arm64/configs/qcom_debug.config)'
        type: string
        default: ''
      dkms:
        description: 'Out-of-tree DKMS modules to build and bundle into the kernel image, comma-separated and without the -dkms suffix (e.g. kgsl,camx); empty bundles nothing'
        type: string
        default: ''
      debian-revision:
        description: 'Debian revision component of the package version'
        type: string
        default: '0qli1~'
      localversion:
        description: 'Override LOCALVERSION suffix (auto-derived from the resolved ref if empty)'
        type: string
        default: ''
      kver-extra:
        description: 'Extra KVER suffix, appended to the kernel release verbatim'
        type: string
        default: ''
      debusine-parent-workspace:
        description: 'Parent Debusine workspace for CI child workspace creation'
        type: string
        default: ''
      target-workspace:
        description: 'Debusine target workspace for release promotion (empty = daily/S3 path)'
        type: string
        default: ''
    secrets:
      DEBUSINE_USER:
        description: 'Debusine account used to submit CI and release builds'
        required: false
      DEBUSINE_TOKEN:
        description: 'Debusine token for the CI child workspace'
        required: false
      DEBUSINE_RELEASE_TOKEN:
        description: 'Debusine token for package-publish promotion to the release target workspace'
        required: false

permissions:
  contents: read
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # resolve: classify the target suite as 'debian' or 'ubuntu'.
  # ---------------------------------------------------------------------------
  resolve:
    name: Resolve suite family
    runs-on: ubuntu-latest
    outputs:
      family: ${{ steps.classify.outputs.family }}
    steps:
      - name: Classify suite
        id: classify
        shell: bash
        env:
          SUITE_INPUT: ${{ inputs.suite || 'trixie' }}
          KERNEL_VARIANT_INPUT: ${{ inputs.kernel-variant || 'qcom-next' }}
        run: |
          suite="$SUITE_INPUT"
          kernel_variant="$KERNEL_VARIANT_INPUT"
          [[ "$kernel_variant" =~ ^[a-z0-9]+([a-z0-9-]*[a-z0-9])?$ ]] || {
            echo "ERROR: kernel variant must use lowercase letters, digits, and internal hyphens" >&2
            exit 1
          }
          case "$suite" in
            trixie|forky|sid|unstable|bookworm)
              family=debian ;;
            *)
              family=ubuntu ;;
          esac
          echo "family=$family" >> "$GITHUB_OUTPUT"
          echo "Suite '$suite' classified as family=$family"

  # ---------------------------------------------------------------------------
  # prepare: clone kernel source, inject packaging, run prepare-source.sh.
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare kernel source
    runs-on: [self-hosted, lecore-prd-u2404-arm64-xlrg-od-ephem]
    # TEMPORARY, with the DKMS override in "Prepare source" below.
    needs: resolve

    env:
      KERNEL_URL: ${{ inputs.git-clone || inputs.kernel-url || 'https://github.com/qualcomm-linux/kernel' }}
      DISTRO: ${{ inputs.suite || 'trixie' }}
      # For Debian-family suites (trixie, forky, sid) use trixie as the docker
      # image distro: docker-pkg-build and pkg-builder only support trixie for
      # Debian. Debusine handles the actual suite-specific build internally.
      # For Ubuntu-family suites (noble, questing, resolute) use the real suite.
      DOCKER_DISTRO: ${{ (inputs.suite == 'forky' || inputs.suite == 'sid' || inputs.suite == 'unstable') && 'trixie' || inputs.suite || 'trixie' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout pkg-linux-qcom
        # debian/ and ci/ live on the same branch, so one checkout supplies
        # both the packaging and resolve-kernel-ref.sh, derive-localversion.sh,
        # derive-debian-revision.sh and the suite_suffix_mapping.
        uses: actions/checkout@v4

      - name: Checkout docker-pkg-build
        uses: actions/checkout@v4
        with:
          repository: qualcomm-linux/docker-pkg-build
          ref: main
          path: docker-pkg-build

      - name: Build docker image
        run: |
          ./docker-pkg-build/docker_deb_build.py --rebuild -d "$DOCKER_DISTRO"
          docker image ls

      - name: Resolve kernel ref
        id: kernel-ref
        env:
          BRANCH_INPUT: ${{ inputs.kernel-branch || 'qcom-next' }}
          REF_STRATEGY_INPUT: ${{ inputs.ref-strategy || 'latest_tag' }}
          TAG_PATTERN_INPUT: ${{ inputs.tag-pattern || 'qcom-next-*' }}
          KERNEL_VARIANT_INPUT: ${{ inputs.kernel-variant || 'qcom-next' }}
        run: |
          set -euo pipefail
          BRANCH="$BRANCH_INPUT"
          REF_STRATEGY="$REF_STRATEGY_INPUT"
          TAG_PATTERN="$TAG_PATTERN_INPUT"

          case "$REF_STRATEGY" in
            latest_tag)
              KERNEL_REF=$(ci/scripts/resolve-kernel-ref.sh \
                --url "$KERNEL_URL" \
                --latest-tag "$TAG_PATTERN")
              ;;
            branch_tip|pinned_ref)
              KERNEL_REF=$(ci/scripts/resolve-kernel-ref.sh --url "$KERNEL_URL" --ref "$BRANCH")
              ;;
            *)
              echo "ERROR: unsupported ref strategy: $REF_STRATEGY" >&2
              exit 1
              ;;
          esac

          echo "KERNEL_REF=$KERNEL_REF" >> "$GITHUB_ENV"
          echo "Kernel variant: $KERNEL_VARIANT_INPUT"
          echo "Ref strategy: $REF_STRATEGY"
          echo "Resolved kernel ref: $KERNEL_REF"

      - name: Clone kernel source
        run: |
          KERNEL_DIR="$GITHUB_WORKSPACE/kernel-source"
          echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"
          echo "Cloning $KERNEL_URL @ $KERNEL_REF (shallow)..."
          git clone --depth 1 --single-branch --branch "$KERNEL_REF" --no-tags \
            "$KERNEL_URL" "$KERNEL_DIR"
          KERNEL_SHA=$(git -C "$KERNEL_DIR" rev-parse HEAD)
          echo "KERNEL_SHA=$KERNEL_SHA" >> "$GITHUB_ENV"
          echo "Kernel HEAD SHA: $KERNEL_SHA"

      - name: Derive version fields
        env:
          LOCALVERSION_INPUT: ${{ inputs.localversion }}
          KERNEL_VARIANT_INPUT: ${{ inputs.kernel-variant || 'qcom-next' }}
        run: |
          set -euo pipefail
          OVERRIDE_LV="$LOCALVERSION_INPUT"
          if [[ -n "$OVERRIDE_LV" ]]; then
            # An override supplies no snapshot, and the ref it was chosen to
            # replace cannot be trusted to describe it. The Debian version then
            # carries no +git<date>; prepare-source.sh warns about the same.
            echo "Using explicit LOCALVERSION override: $OVERRIDE_LV"
            echo "LOCALVERSION=$OVERRIDE_LV" >> "$GITHUB_ENV"
            echo "SNAPSHOT=" >> "$GITHUB_ENV"
            echo "GITSHA=" >> "$GITHUB_ENV"
          else
            # Emits LOCALVERSION=, SNAPSHOT= and GITSHA= lines, already in
            # GITHUB_ENV form.
            FIELDS=$(ci/scripts/derive-localversion.sh \
              --variant "$KERNEL_VARIANT_INPUT" \
              --ref "$KERNEL_REF" \
              --sha "$KERNEL_SHA")
            echo "$FIELDS" >> "$GITHUB_ENV"
            echo "Derived version fields:"
            echo "$FIELDS"
          fi

      - name: Resolve Debian revision
        # workflow_call callers (daily.yml, release.yml) pass an already
        # fully-derived debian-revision from resolve-matrix.sh. Direct
        # workflow_dispatch runs pass only debian-version-stub and get the
        # selected suite's mapped suffix applied automatically, always using
        # Daily semantics since direct dispatch is build-only and
        # non-promoting.
        env:
          DEBIAN_REVISION_INPUT: ${{ inputs.debian-revision }}
          DEBIAN_VERSION_STUB_INPUT: ${{ inputs.debian-version-stub || '0qli1' }}
        run: |
          set -euo pipefail
          INPUT_REVISION="$DEBIAN_REVISION_INPUT"
          if [[ -n "$INPUT_REVISION" ]]; then
            DEBIAN_REVISION="$INPUT_REVISION"
            echo "Using matrix-derived Debian revision: $DEBIAN_REVISION"
          else
            DEBIAN_REVISION=$(ci/scripts/derive-debian-revision.sh \
              --stub "$DEBIAN_VERSION_STUB_INPUT" \
              --suite "$DISTRO" \
              --delivery-type Daily \
              --matrix-file ci/build-matrix.json)
            echo "Derived Debian revision for direct dispatch: $DEBIAN_REVISION"
          fi
          echo "DEBIAN_REVISION=$DEBIAN_REVISION" >> "$GITHUB_ENV"

      - name: Merge qcom-next PR patches
        if: ${{ inputs.qcom-next-pr != '' }}
        env:
          QCOM_NEXT_PR: ${{ inputs.qcom-next-pr }}
        run: |
          cd "$KERNEL_DIR"
          echo "Merging qcom-next PR(s): $QCOM_NEXT_PR"
          for pr in $QCOM_NEXT_PR; do
            [[ "$pr" =~ ^[0-9]+$ ]] || { echo "::error::invalid qcom-next PR number: $pr"; exit 1; }
            echo "::group::Merging qcom-next PR #$pr"
            git fetch --no-tags origin "pull/$pr/head:pr-$pr"
            if ! git merge --no-ff --no-commit "pr-$pr"; then
              echo "ERROR: Merge conflict while merging PR #$pr. Aborting."
              git merge --abort || true
              exit 1
            fi
            if ! git diff --cached --quiet; then
              git commit -m "Merged qcom-next PR #$pr"
              echo "PR #$pr merged successfully."
            else
              echo "PR #$pr already present; nothing to merge."
            fi
            echo "::endgroup::"
          done

      - name: Apply kernel-topics PR patches
        if: ${{ inputs.kernel-topics-pr != '' }}
        env:
          KERNEL_TOPICS_PR: ${{ inputs.kernel-topics-pr }}
        run: |
          cd "$KERNEL_DIR"
          echo "Applying kernel-topics PR patch(es): $KERNEL_TOPICS_PR"
          for pr in $KERNEL_TOPICS_PR; do
            [[ "$pr" =~ ^[0-9]+$ ]] || { echo "::error::invalid kernel-topics PR number: $pr"; exit 1; }
            echo "::group::Applying kernel-topics PR #$pr"
            wget -q "https://github.com/qualcomm-linux/kernel-topics/pull/$pr.patch" -O "$pr.patch"
            if ! git am "$pr.patch"; then
              echo "ERROR: Patch application failed for PR #$pr. Aborting."
              git am --abort || true
              exit 1
            fi
            echo "PR #$pr applied successfully."
            echo "::endgroup::"
          done

      - name: Prepare source
        env:
          SRCPKG_INPUT: ${{ inputs.srcpkg || 'linux-qcom-next' }}
          BINPKG_INPUT: ${{ inputs.binpkg || 'linux-image-qcom-next' }}
          KVER_EXTRA_INPUT: ${{ inputs.kver-extra }}
          KERNEL_CONFIG_INPUT: ${{ inputs.kernel-config }}
          DKMS_INPUT: ${{ inputs.dkms }}
          # TEMPORARY, consumed by the DKMS override below.
          SUITE_FAMILY: ${{ needs.resolve.outputs.family }}
          DEBUG_BUILD_INPUT: ${{ inputs.debug-build }}
        run: |
          # No -x here: keep xtrace off for this step as it assembles the
          # prepare-source.sh argument list which may include sensitive paths.
          set -euo pipefail

          DKMS_LIST="$DKMS_INPUT"

          # TEMPORARY: camx and iris-vpu are bundled on non-Ubuntu builds only.
          # A listed module is a presence contract, so an Ubuntu leg that asked
          # for them would hard-fail rather than quietly ship without them.
          #
          # This is delivery policy and belongs in ci/build-matrix.json, which
          # cannot express a per-suite dkms list yet. Revert this override —
          # and the "needs: resolve"/SUITE_FAMILY plumbing that feeds it — once
          # the matrix can.
          if [[ "$SUITE_FAMILY" == "ubuntu" ]]; then
            DKMS_LIST="kgsl"
            echo "Ubuntu build: DKMS list overridden to '$DKMS_LIST' (was '$DKMS_INPUT')"
          fi

          ARGS=(
            --source-dir "$KERNEL_DIR"
            --distro "$DISTRO"
            --srcpkg "$SRCPKG_INPUT"
            --binpkg "$BINPKG_INPUT"
            --debian-revision "$DEBIAN_REVISION"
          )

          # All three version fields come from derive-localversion.sh, which
          # composed them from the ref and HEAD together. Nothing here appends
          # to them: the SHA is already inside LOCALVERSION, and GITSHA carries
          # it separately for the Debian version, which joins it differently.
          [[ -n "$LOCALVERSION" ]]        && ARGS+=(--localversion "$LOCALVERSION")
          [[ -n "$SNAPSHOT" ]]            && ARGS+=(--snapshot "$SNAPSHOT")
          [[ -n "$GITSHA" ]]              && ARGS+=(--git-sha "$GITSHA")
          [[ -n "$KVER_EXTRA_INPUT" ]]    && ARGS+=(--kver-extra "$KVER_EXTRA_INPUT")
          [[ -n "$KERNEL_CONFIG_INPUT" ]] && ARGS+=(--kernel-config "$KERNEL_CONFIG_INPUT")
          # Always passed, unlike the optional inputs above: an empty list is a
          # genuine "bundle nothing" rather than a request for some default.
          ARGS+=(--dkms "$DKMS_LIST")
          [[ "$DEBUG_BUILD_INPUT" == "true" ]] && ARGS+=(--debug)

          docker run -i --rm \
            -v "$PWD:$PWD" --workdir="$PWD" \
            "ghcr.io/qualcomm-linux/pkg-builder:$DOCKER_DISTRO" \
            ./prepare-source.sh "${ARGS[@]}"

      - name: Upload prepared source tree
        run: |
          tar czf /tmp/kernel-srcpkg.tar.gz \
            -C "$(dirname "$KERNEL_DIR")" \
            "$(basename "$KERNEL_DIR")"

      - name: Upload prepared source tree artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-srcpkg-${{ inputs.kernel-variant }}-${{ inputs.suite }}
          path: /tmp/kernel-srcpkg.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # debusine-build: Debian suites only (trixie, forky, sid).
  # ---------------------------------------------------------------------------
  debusine-build:
    name: Build in Debusine
    needs: [resolve, prepare]
    if: ${{ needs.resolve.outputs.family == 'debian' }}
    uses: ./.github/workflows/build-kernel-debusine.yml
    with:
      suite: ${{ inputs.suite || 'trixie' }}
      kernel-variant: ${{ inputs.kernel-variant || 'qcom-next' }}
      srcpkg: ${{ inputs.srcpkg || 'linux-qcom-next' }}
      debusine-parent-workspace: ${{ inputs.debusine-parent-workspace || vars.DEBUSINE_PARENT_WORKSPACE || 'qli-ci' }}
      target-workspace: ${{ inputs.target-workspace || '' }}
    secrets:
      DEBUSINE_USER: ${{ secrets.DEBUSINE_USER }}
      DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}
      DEBUSINE_RELEASE_TOKEN: ${{ secrets.DEBUSINE_RELEASE_TOKEN }}

  # ---------------------------------------------------------------------------
  # ubuntu-build: Ubuntu suites only (noble, questing, resolute).
  # ---------------------------------------------------------------------------
  ubuntu-build:
    name: Build (Ubuntu, docker)
    needs: [resolve, prepare]
    if: ${{ needs.resolve.outputs.family == 'ubuntu' }}
    uses: ./.github/workflows/build-kernel-ubuntu.yml
    with:
      distro: ${{ inputs.suite || 'resolute' }}
      kernel-variant: ${{ inputs.kernel-variant || 'qcom-next' }}
