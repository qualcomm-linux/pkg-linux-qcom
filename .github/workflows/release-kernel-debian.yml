name: release-kernel-debian

# Build a kernel package for a Debian-family suite and promote it to a release
# workspace in Debusine.
#
# Called per matrix entry by release.yml. Identical to build-kernel-debian.yml
# up to the Debusine build -- both share the prepare-kernel-source and
# debusine-build actions -- and differs only in the tail: this one promotes the
# built package to target-workspace rather than publishing it to the daily S3
# path. Which tail a run wants is decided by the workflow that calls it, so
# neither file carries the other's tail as a job to be skipped.
#
# Only the Debian family has a release path: promotion runs through Debusine,
# and resolve-matrix.py rejects a Release entry for any other suite.
#
# Jobs:
#   prepare (self-hosted): clone, patch, inject debian/, generate the source.
#   build   (debusine-pkg-builder container): submit to Debusine.
#   release (debusine-pkg-builder container): promote to the target workspace.

on:
  workflow_call:
    inputs:
      build:
        description: 'Name of this build, as listed in ci/build-matrix.yaml'
        type: string
        default: 'qcom-next-trixie'
      flavour:
        description: 'Kernel flavour: the LOCALVERSION suffix and so the kernel release identity'
        type: string
        default: 'qcom-next'
      suite:
        description: 'Target Debian suite (trixie, forky, sid)'
        type: string
        default: 'trixie'
      kernel-branch:
        description: 'Immutable ref to build, from the entry branch_or_tag'
        type: string
        default: 'qcom-next'
      git-clone:
        description: 'Kernel repository URL'
        type: string
        default: 'https://github.com/qualcomm-linux/kernel'
      ref-strategy:
        description: 'Kernel ref strategy: a Release entry always pins one'
        type: string
        default: 'pinned_ref'
      tag-pattern:
        description: 'Tag glob, unused by pinned_ref and carried for symmetry with the Daily inputs'
        type: string
        default: ''
      srcpkg:
        description: 'Source package name'
        type: string
        default: 'linux-qcom-next'
      binpkg:
        description: 'Binary metapackage name'
        type: string
        default: 'linux-image-qcom-next'
      kernel-config:
        description: 'Extra config fragments applied on top of all of debian/config-available/'
        type: string
        default: ''
      dkms:
        description: 'Out-of-tree DKMS modules to bundle, comma-separated and without the -dkms suffix'
        type: string
        default: ''
      debian-revision:
        description: 'Debian revision component of the package version'
        type: string
        default: '0qli'
      localversion:
        description: 'Override LOCALVERSION suffix (auto-derived from the resolved ref if empty)'
        type: string
        default: ''
      kver-extra:
        description: 'Extra suffix appended to the package version'
        type: string
        default: ''
      debusine-parent-workspace:
        description: 'Parent Debusine workspace for CI child workspace creation'
        type: string
        default: ''
      target-workspace:
        description: 'Debusine workspace to promote the built package into'
        type: string
        required: true
    secrets:
      DEBUSINE_USER:
        description: 'Debusine account used to submit release builds'
        required: false
      DEBUSINE_TOKEN:
        description: 'Debusine token for the CI child workspace'
        required: false
      DEBUSINE_RELEASE_TOKEN:
        description: 'Debusine token for promotion to the release target workspace'
        required: false

permissions:
  contents: read
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # prepare: clone kernel source, inject packaging, run prepare-source.sh.
  # ---------------------------------------------------------------------------
  prepare:
    name: Generate source package
    runs-on: [self-hosted, lecore-prd-u2404-arm64-xlrg-od-ephem]
    steps:
      - name: Checkout pkg-linux-qcom
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare kernel source
        uses: ./.github/actions/prepare-kernel-source
        with:
          build: ${{ inputs.build }}
          suite: ${{ inputs.suite }}
          expect-family: debian
          flavour: ${{ inputs.flavour }}
          kernel-url: ${{ inputs.git-clone }}
          ref-strategy: ${{ inputs.ref-strategy }}
          kernel-branch: ${{ inputs.kernel-branch }}
          tag-pattern: ${{ inputs.tag-pattern }}
          srcpkg: ${{ inputs.srcpkg }}
          binpkg: ${{ inputs.binpkg }}
          kernel-config: ${{ inputs.kernel-config }}
          dkms: ${{ inputs.dkms }}
          debian-revision: ${{ inputs.debian-revision }}
          localversion: ${{ inputs.localversion }}
          kver-extra: ${{ inputs.kver-extra }}

  # ---------------------------------------------------------------------------
  # build: generate the Debian source package and submit it to Debusine.
  # ---------------------------------------------------------------------------
  build:
    name: Build package (Debusine)
    needs: prepare
    runs-on: ubuntu-latest
    environment: Production
    container:
      image: ghcr.io/qualcomm-linux/debusine-pkg-builder:trixie
      options: --user 0:0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      workspace: ${{ steps.debusine.outputs.workspace }}
      srcpkg_version: ${{ steps.debusine.outputs.srcpkg_version }}
    steps:
      - name: Checkout pkg-linux-qcom
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build in Debusine
        id: debusine
        uses: ./.github/actions/debusine-build
        with:
          suite: ${{ inputs.suite }}
          flavour: ${{ inputs.flavour }}
          debusine-host: ${{ vars.DEBUSINE_HOST }}
          debusine-scope: ${{ vars.DEBUSINE_SCOPE }}
          debusine-user: ${{ secrets.DEBUSINE_USER }}
          debusine-token: ${{ secrets.DEBUSINE_TOKEN }}
          debusine-parent-workspace: ${{ inputs.debusine-parent-workspace || vars.DEBUSINE_PARENT_WORKSPACE || 'qli-ci' }}
          # A release build reads qli alone, so a released kernel is never
          # built against something that has not been released alongside it.
          extra-build-dep-workspaces: qli

  # ---------------------------------------------------------------------------
  # release: promote the built package from the CI workspace to the target.
  # ---------------------------------------------------------------------------
  release:
    name: Release to Debusine
    needs: build
    runs-on: ubuntu-latest
    environment: Production
    container:
      image: ghcr.io/qualcomm-linux/debusine-pkg-builder:trixie
      options: --user 0:0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout debusine-action helpers
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: qualcomm-linux/debusine-action
          ref: main
          path: debusine-action
          fetch-depth: 1
          sparse-checkout: |
            lib

      - name: Promote packages to target workspace
        env:
          DEBUSINE_HOST: ${{ vars.DEBUSINE_HOST }}
          DEBUSINE_SCOPE: ${{ vars.DEBUSINE_SCOPE }}
          DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_RELEASE_TOKEN }}
          DEBUSINE_CI_WORKSPACE: ${{ needs.build.outputs.workspace }}
          DEBUSINE_TARGET_WORKSPACE: ${{ inputs.target-workspace }}
          SRCPKG_NAME: ${{ inputs.srcpkg }}
          SRCPKG_VERSION: ${{ needs.build.outputs.srcpkg_version }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -ex
          debusine-action/lib/release
