name: build-debusine

# Reusable workflow: Debian kernel build via Debusine, then publish.
#
# Called by build-kernel-deb.yml for Debian-family suites (trixie, forky, sid).
# The source package is already built by the caller's prepare job and shared
# as the source-package artifact. Artifact and workspace identity include both
# kernel_variant and suite so parallel variants cannot share inputs or outputs.
#
# Publish path is determined by target-workspace:
#   target-workspace == ''  -> daily path: upload the .deb files to S3.
#   target-workspace != ''  -> release path: promote from CI workspace to the
#                              target Debusine workspace via qli-ci lib/release.
#
# The same input picks the GitHub environment and the workspaces the build
# resolves its build-dependencies from: a Staging run also reads qli-staging,
# a Production run reads qli alone.
#
# Jobs:
#   build   (debusine-pkg-builder container): submits prepare's .dsc to Debusine.
#   publish (self-hosted runner): fetches the .deb files; S3 upload (daily path only).
#   image   (self-hosted runner): qcom-deb-images build with the kernel.
#   release (debusine-pkg-builder container): Debusine promotion (release path only).

on:
  workflow_call:
    inputs:
      suite:
        description: 'Target Debian suite (trixie, forky, sid)'
        type: string
        required: true
      kernel-variant:
        description: 'Kernel variant identifier used to isolate artifacts and Debusine workspaces'
        type: string
        required: true
      srcpkg:
        description: 'Source package name (e.g. linux-qcom-next)'
        type: string
        default: 'linux-qcom-next'
      debusine-parent-workspace:
        description: 'Parent Debusine workspace for CI child workspace creation'
        type: string
        default: 'qli-ci'
      target-workspace:
        description: 'Debusine target workspace for release promotion (empty = daily/S3 path)'
        type: string
        default: ''
    secrets:
      DEBUSINE_USER:
        required: true
      DEBUSINE_TOKEN:
        required: true
      DEBUSINE_RELEASE_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

env:
  QLI_CI_REF: main
  QCOM_DEB_IMAGES_REF: main

jobs:
  # ---------------------------------------------------------------------------
  # build: submit the source package prepare built to Debusine.
  # ---------------------------------------------------------------------------
  build:
    name: Build (Debusine)
    runs-on: ubuntu-latest
    permissions:
      contents: read  # actions/checkout
      packages: read  # container: ghcr.io/qualcomm-linux/debusine-pkg-builder
    container:
      image: ghcr.io/qualcomm-linux/debusine-pkg-builder:trixie
      options: --user 0:0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      workspace: ${{ steps.build-debusine.outputs.workspace }}
      workspace_url: ${{ steps.build-debusine.outputs.workspace_url }}
      srcpkg_version: ${{ steps.srcpkg.outputs.srcpkg_version }}
    defaults:
      run:
        shell: bash
    environment: ${{ inputs.target-workspace != '' && 'Production' || 'Staging' }}
    steps:
      - name: Checkout qli-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: qualcomm-linux/qli-ci
          ref: ${{ env.QLI_CI_REF }}
          path: qli-ci
          fetch-depth: 1
          sparse-checkout: |
            lib

      # Into the workspace root: lib/build takes the .dsc from its working
      # directory.
      - name: Download source package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-package-${{ inputs.kernel-variant }}-${{ inputs.suite }}

      - name: Read the source package version
        # From the .dsc as downloaded, which is what Debusine will be given;
        # the prepare job logged the same value from the same file.
        id: srcpkg
        run: |
          set -euo pipefail
          DSC=$(ls -- *.dsc)
          [[ $(wc -l <<<"$DSC") -eq 1 ]] || {
            echo "::error::Expected exactly one .dsc in the source package artifact, found: $DSC"
            exit 1
          }
          SRCPKG_VERSION=$(sed -n 's/^Version: //p' "$DSC")
          [[ "$SRCPKG_VERSION" =~ ^[A-Za-z0-9.+~:-]+$ ]] || {
            echo "::error::Could not read a version from $DSC (got '$SRCPKG_VERSION')"
            exit 1
          }
          echo "Submitting $DSC ($SRCPKG_VERSION)"
          echo "srcpkg_version=$SRCPKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build in Debusine
        id: build-debusine
        env:
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_INDEX: ${{ inputs.kernel-variant }}-${{ inputs.suite }}
          DEBUSINE_HOST: ${{ vars.DEBUSINE_HOST }}
          DEBUSINE_SCOPE: ${{ vars.DEBUSINE_SCOPE }}
          DEBUSINE_USER: ${{ secrets.DEBUSINE_USER }}
          DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}
          DEBUSINE_PARENT_WORKSPACE: ${{ inputs.debusine-parent-workspace }}
          SUITE: ${{ inputs.suite }}
          # Staging runs may build against packages that have not been released
          # to qli yet, so they resolve build-dependencies from qli-staging too.
          EXTRA_BUILD_DEP_WORKSPACES: ${{ inputs.target-workspace != '' && 'qli' || 'qli qli-staging' }}
        run: |
          # No -x here: DEBUSINE_TOKEN is in env, keep xtrace off.
          set -euo pipefail
          qli-ci/lib/build
          workspace=$(sed -n 's/^workspace=//p' "$GITHUB_OUTPUT")
          echo "workspace_url=https://${DEBUSINE_HOST}/${DEBUSINE_SCOPE}/${workspace}/" >> "$GITHUB_OUTPUT"

      - name: Note Debusine workspace URL
        env:
          WORKSPACE_URL: ${{ steps.build-debusine.outputs.workspace_url }}
        run: |
          echo "Debusine Workspace URL: $WORKSPACE_URL" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # publish: download .deb files from Debusine for the image job, and upload
  # them to S3 on the daily path (target-workspace is empty).
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to S3
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: [self-hosted, lecore-prd-u2404-arm64-xlrg-od-ephem]
    # Reads the built packages out of Debusine over HTTP; pulls no image.
    permissions:
      contents: read  # actions/checkout
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout qli-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: qualcomm-linux/qli-ci
          ref: ${{ env.QLI_CI_REF }}
          path: qli-ci
          fetch-depth: 1
          sparse-checkout: |
            lib

      - name: Generate Debusine apt configuration
        env:
          DEBUSINE_HOST: ${{ vars.DEBUSINE_HOST }}
          DEBUSINE_SCOPE: ${{ vars.DEBUSINE_SCOPE }}
          DEBUSINE_USER: ${{ secrets.DEBUSINE_USER }}
          DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}
          DEBUSINE_WORKSPACE: ${{ needs.build.outputs.workspace }}
          SUITE: ${{ inputs.suite }}
        run: |
          qli-ci/lib/generate-apt-config

      - name: Download .deb packages from Debusine workspace
        run: |
          set -euxo pipefail
          sudo apt-get install -y --no-install-recommends devscripts
          mkdir -p "$GITHUB_WORKSPACE/deb-artifacts"
          chdist create debusine-workspace
          rm -f ~/.chdist/debusine-workspace/etc/apt/sources.list
          install -d ~/.chdist/debusine-workspace/etc/apt/sources.list.d
          install -d ~/.chdist/debusine-workspace/etc/apt/auth.conf.d
          install -m 0644 debusine-ci.sources \
            ~/.chdist/debusine-workspace/etc/apt/sources.list.d/
          install -m 0600 debusine-ci-auth.conf \
            ~/.chdist/debusine-workspace/etc/apt/auth.conf.d/
          chdist apt-get debusine-workspace update
          packages=$(chdist apt-cache debusine-workspace search . | awk '{print $1}' | tr '\n' ' ')
          [[ -n "$packages" ]] || { echo "ERROR: no packages found in Debusine workspace"; exit 1; }
          echo "Packages to download: $packages"
          cd "$GITHUB_WORKSPACE/deb-artifacts"
          # shellcheck disable=SC2086
          chdist apt-get debusine-workspace download $packages

      - name: Upload .deb packages to GitHub artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-debs-${{ inputs.kernel-variant }}-${{ inputs.suite }}
          path: deb-artifacts
          retention-days: 7

      - name: Upload .deb packages to S3
        if: ${{ inputs.target-workspace == '' }}
        uses: qualcomm-linux/upload-private-artifact-action@4940e9327cd7386acdb908b61c714c079b7d754b # aws-v4
        with:
          s3_bucket: ${{ vars.ARTIFACT_S3_BUCKET }}
          path: deb-artifacts
          destination: ${{ github.repository_owner }}/pkg/debusine/${{ github.event.repository.name }}/${{ inputs.kernel-variant }}/${{ inputs.suite }}/${{ github.run_id }}-${{ github.run_attempt }}/

  # ---------------------------------------------------------------------------
  # image: build a qcom-deb-images disk image with the kernel publish fetched.
  # ---------------------------------------------------------------------------
  image:
    name: Build Debian image
    needs: [build, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: [self-hosted, lecore-prd-u2404-arm64-xlrg-od-ephem]
    permissions:
      contents: read  # actions/checkout
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout qcom-deb-images
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: qualcomm-linux/qcom-deb-images
          ref: ${{ env.QCOM_DEB_IMAGES_REF }}
          path: qcom-deb-images
          fetch-depth: 1

      - name: Download kernel .deb packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-debs-${{ inputs.kernel-variant }}-${{ inputs.suite }}
          path: qcom-deb-images/local-apt-repo/kernel

      - name: Build image
        env:
          SUITE: ${{ inputs.suite }}
          KERNEL_VARIANT: ${{ inputs.kernel-variant }}
        run: |
          set -euo pipefail
          mkdir -p image-artifacts
          cd qcom-deb-images
          kernelpackages=$(find local-apt-repo/kernel -type f \
            \( -name 'linux-image-*' -o -name 'linux-headers-*' \) \
            -not -name '*dbg*' -printf '%f\n' | cut -f1 -d_ | sort | paste -sd,)
          [[ -n "$kernelpackages" ]] || {
            echo "::error::No linux-image or linux-headers packages in the artifact"
            exit 1
          }
          # Placeholder: the debos rootfs build and the make disk image
          # targets go here, with -t aptlocalrepo and -t kernelpackages.
          {
            echo "suite=$SUITE"
            echo "kernel_variant=$KERNEL_VARIANT"
            echo "qcom_deb_images_commit=$(git rev-parse HEAD)"
            echo "kernelpackages=$kernelpackages"
          } | tee "$GITHUB_WORKSPACE/image-artifacts/build-info.txt"

      - name: Upload image artifacts to S3
        id: upload-image
        uses: qualcomm-linux/upload-private-artifact-action@4940e9327cd7386acdb908b61c714c079b7d754b # aws-v4
        with:
          s3_bucket: ${{ vars.ARTIFACT_S3_BUCKET }}
          path: image-artifacts
          destination: ${{ github.repository_owner }}/images/${{ github.event.repository.name }}/${{ inputs.kernel-variant }}/${{ inputs.suite }}/${{ github.run_id }}-${{ github.run_attempt }}/

      - name: Save image artifacts URL to summary
        env:
          IMAGE_URL: ${{ steps.upload-image.outputs.url }}
        run: |
          echo "Debian image artifacts: $IMAGE_URL" >> "$GITHUB_STEP_SUMMARY"

  # TODO: gate release etc on the image job

  # ---------------------------------------------------------------------------
  # release: promote packages from CI workspace to target Debusine workspace.
  # Release path only (target-workspace is non-empty).
  # ---------------------------------------------------------------------------
  release:
    name: Release to Debusine
    needs: build
    if: ${{ needs.build.result == 'success' && inputs.target-workspace != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read  # actions/checkout
      packages: read  # container: ghcr.io/qualcomm-linux/debusine-pkg-builder
    environment: Production
    container:
      image: ghcr.io/qualcomm-linux/debusine-pkg-builder:trixie
      options: --user 0:0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout qli-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: qualcomm-linux/qli-ci
          ref: ${{ env.QLI_CI_REF }}
          path: qli-ci
          fetch-depth: 1
          sparse-checkout: |
            lib

      - name: Promote packages to target workspace
        env:
          DEBUSINE_HOST: ${{ vars.DEBUSINE_HOST }}
          DEBUSINE_SCOPE: ${{ vars.DEBUSINE_SCOPE }}
          DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_RELEASE_TOKEN }}
          DEBUSINE_CI_WORKSPACE: ${{ needs.build.outputs.workspace }}
          DEBUSINE_TARGET_WORKSPACE: ${{ inputs.target-workspace }}
          SRCPKG_NAME: ${{ inputs.srcpkg }}
          SRCPKG_VERSION: ${{ needs.build.outputs.srcpkg_version }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -ex
          qli-ci/lib/release
